<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Smack sent — Smackagram</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#0D0D0D; --ink-2:#1A1A1A; --chalk:#F5F5F3; --chalk-dim:#9A9A96;
    --flare:#E8142C; --gold:#FFD400; --line:rgba(245,245,243,0.10);
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{
    background:var(--ink); color:var(--chalk); font-family:'Inter',sans-serif;
    min-height:100vh;
  }
  nav{display:flex; justify-content:space-between; align-items:center; padding:20px 24px; border-bottom:1px solid var(--line);}
  .nav-links{display:flex; gap:32px; align-items:center; font-size:14px; color:var(--chalk-dim);}
  .auth-links{display:flex; gap:20px; align-items:center; font-size:14px; color:var(--chalk-dim);}
  @media(max-width:760px){
    nav{flex-wrap:wrap; gap:12px;}
    .nav-links{display:none;}
  }
  .center-wrap{
    min-height:calc(100vh - 77px); display:flex; align-items:center; justify-content:center;
    text-align:center; padding:24px;
  }
  h1{font-family:'Anton',sans-serif; font-size:38px; margin-bottom:16px; text-transform:uppercase;}
  p{color:var(--chalk-dim); font-size:16px; margin-bottom:24px; max-width:420px;}
  a{
    display:inline-block; background:var(--flare); color:#fff; text-decoration:none;
    padding:12px 28px; font-weight:600; border-radius:2px;
  }
</style>
</head>
<body>
{% include '_nav.html' %}
<div class="center-wrap">
<div>
  <h1>Smack delivered.</h1>
  <p>Payment confirmed — the call is on its way. You'll be able to hear the reaction once it's recorded.</p>
  <a href="/">Send another one</a>
</div>
</div>
</body>
</html>
