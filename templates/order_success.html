<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Smack sent — Smackagram</title>
<meta name="description" content="Your smack is on its way.">
<meta name="robots" content="noindex">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Smackagram">
<meta property="og:title" content="Smack delivered — Smackagram">
<meta property="og:description" content="Your smack is on its way.">
<meta property="og:image" content="{{ url_for('static', filename='img/og-default.jpg', _external=True) }}">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:url" content="{{ request.base_url }}">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="Smack delivered — Smackagram">
<meta name="twitter:description" content="Your smack is on its way.">
<meta name="twitter:image" content="{{ url_for('static', filename='img/og-default.jpg', _external=True) }}">
<link rel="icon" type="image/png" sizes="32x32" href="{{ url_for('static', filename='img/favicon-32.png') }}">
<link rel="apple-touch-icon" href="{{ url_for('static', filename='img/apple-touch-icon.png') }}">
<meta name="theme-color" content="#0D0D0D">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{{ url_for('static', filename='css/smackagram.css') }}">
<style>
  :root{
    --ink:#0D0D0D; --ink-2:#1A1A1A; --chalk:#F5F5F3; --chalk-dim:#9A9A96;
    --flare:#E8142C; --gold:#FFD400; --line:rgba(245,245,243,0.10);
  }
  body{
    background:var(--ink); color:var(--chalk); font-family:'Inter',sans-serif;
    min-height:100dvh;
  }
  .center-wrap{
    min-height:calc(100dvh - var(--nav-h)); display:flex; align-items:center; justify-content:center;
    text-align:center; padding:24px;
  }
  h1{font-family:'Anton',sans-serif; font-size:var(--h1-page); margin-bottom:16px; text-transform:uppercase;}
  p{color:var(--chalk-dim); font-size:16px; margin-bottom:24px; max-width:420px;}
  .cta-btn{
    display:inline-block; background:var(--flare); color:#fff; text-decoration:none;
    padding:12px 28px; font-weight:600; border-radius:2px;
  }
</style>
</head>
<body>
{% include '_nav.html' %}
<div class="center-wrap">
<div>
  <h1>Smack delivered.</h1>
  <p>Payment confirmed — the call is on its way. You'll be able to hear the reaction once it's recorded.</p>
  <a href="/" class="cta-btn">Send another one</a>
</div>
</div>
</body>
</html>
