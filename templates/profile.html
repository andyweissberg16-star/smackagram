<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Profile — Smackagram</title>
<meta name="description" content="Manage your Smackagram account.">
<meta name="robots" content="noindex">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Smackagram">
<meta property="og:title" content="Your profile — Smackagram">
<meta property="og:description" content="Manage your Smackagram account.">
<meta property="og:image" content="{{ url_for('static', filename='img/og-default.jpg', _external=True) }}">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:url" content="{{ request.base_url }}">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="Your profile — Smackagram">
<meta name="twitter:description" content="Manage your Smackagram account.">
<meta name="twitter:image" content="{{ url_for('static', filename='img/og-default.jpg', _external=True) }}">
<link rel="icon" type="image/png" sizes="32x32" href="{{ url_for('static', filename='img/favicon-32.png') }}">
<link rel="apple-touch-icon" href="{{ url_for('static', filename='img/apple-touch-icon.png') }}">
<meta name="theme-color" content="#0D0D0D">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{{ url_for('static', filename='css/smackagram.css') }}">
<style>
  :root{
    --ink:#000000; --ink-2:#0C0C0C; --chalk:#FFFFFF; --chalk-dim:#B5B0B0;
    --flare:#E8142C; --gold:#FFD400; --line:rgba(245,245,243,0.10); --line-strong:rgba(245,245,243,0.24);
  }
  body{background:var(--ink); color:var(--chalk); font-family:'Inter',sans-serif; line-height:1.5; -webkit-font-smoothing:antialiased;}
  .wrap{max-width:460px; margin:0 auto; padding:0 24px 60px;}
  .hero{text-align:center; padding:36px 0 8px;}
  .hero h1{font-family:'Anton',sans-serif; font-size:var(--h1-form); text-transform:uppercase; letter-spacing:0.5px;}
  .customer-number{
    font-family:'JetBrains Mono',monospace; font-size:12px; color:var(--gold); margin-top:8px;
    text-transform:uppercase; letter-spacing:1px;
  }
  .card{background:var(--ink-2); border:1px solid var(--line-strong); border-radius:6px; padding:28px; margin-top:24px;}
  label{display:block; font-size:var(--fs-sm); color:var(--chalk-dim); text-transform:uppercase; letter-spacing:0.5px; margin-bottom:6px;}
  input[type=text], input[type=tel], input[type=date], input[type=email]{
    width:100%; background:var(--ink); border:1px solid var(--line-strong); color:var(--chalk);
    padding:12px 14px; font-family:'Inter',sans-serif; font-size:14px; border-radius:4px; margin-bottom:14px;
  }
  input:focus{outline:none; border-color:var(--flare);}
  input:disabled{color:var(--chalk-dim); cursor:not-allowed;}
  .row2{display:grid; grid-template-columns:1fr 1fr; gap:12px;}
  .row2 > div{min-width:0;}
  .btn{font-weight:700; font-size:14px; padding:14px 24px; border-radius:4px; border:none; cursor:pointer; text-transform:uppercase; letter-spacing:0.5px; width:100%;}
  .btn-flare{background:var(--flare); color:#fff; box-shadow:0 0 20px rgba(232,20,44,0.4);}
  .btn-flare:disabled{opacity:0.5; cursor:not-allowed;}
  .btn-logout{background:transparent; border:1px solid var(--line-strong); color:var(--chalk); margin-top:12px;}
  #formError{display:none; color:var(--flare-text); font-size:12px; margin-bottom:12px;}
  #formSuccess{display:none; color:var(--gold); font-size:12px; margin-bottom:12px;}
  /* Same tokens and card treatment as the checkout page, so the account
     pages and the money pages read as one product. */
  .vault{
    background:linear-gradient(180deg,#1A0E0F,#120A0B);
    border:1.5px solid #3A1416; border-radius:14px;
    overflow:hidden; margin-bottom:22px;
  }
  .vault-row{
    display:flex; align-items:center; gap:16px; padding:22px;
    border-bottom:1px solid #3A1416; flex-wrap:wrap;
  }
  .vault-label{
    font-size:12px; font-weight:600; letter-spacing:.16em;
    text-transform:uppercase; color:#B5B0B0; margin:0 0 8px;
  }
  /* Smacks only, never a dollar figure - credits include free ones, so a
     money value would read as cash owed back rather than a product balance. */
  .vault-count{
    font-family:'Anton',sans-serif; font-size:48px; line-height:.9;
    letter-spacing:.5px; color:#FFFFFF; margin:0;
  }
  .vault-reload{
    width:auto; margin:0; text-decoration:none;
    background:var(--flare); color:#fff; padding:13px 24px; border-radius:10px;
    font-weight:800; font-size:13.5px; letter-spacing:.04em; text-transform:uppercase;
    box-shadow:0 18px 40px -20px rgba(224,27,36,.6);
  }
  .vault-recent{padding:14px 20px 16px;}
  .vault-recent-head{display:flex; align-items:center; margin-bottom:10px;}
  .vault-link{
    font-size:12px; font-weight:700; letter-spacing:.04em;
    color:var(--flare-text); text-decoration:none; margin-left:auto;
  }
  .vault-item{
    display:flex; align-items:center; gap:11px; padding:10px 0;
    border-bottom:1px solid #2A2A2A; text-decoration:none;
  }
  .vault-item:last-child{border-bottom:none;}
  .vault-dot{
    width:24px; height:24px; border-radius:50%; flex-shrink:0;
    display:grid; place-items:center; font-size:12px;
  }
  .vault-item-body{flex:1; min-width:0;}
  .vault-item-title{display:block; font-size:13.5px; color:#FFFFFF; font-weight:600;}
  .vault-item-sub{display:block; font-size:10.5px; color:#7A7575;}
  .vault-none{color:#7A7575; font-size:12.5px; margin:0; padding:6px 0;}

</style>
</head>
<body>

{% include '_nav.html' %}

<div class="wrap">
  <div class="hero">
    <h1>My Profile</h1>
    <p class="customer-number" id="customerNumberDisplay"></p>
  </div>

  <div class="vault">
    <div class="vault-row">
      <div>
        <p class="vault-label">Smacks in the vault</p>
        <p class="vault-count" id="vaultCount">&mdash;</p>
      </div>
      <span style="flex:1"></span>
      <a href="/refill" class="btn btn-flare vault-reload">Refill</a>
    </div>

    <div class="vault-recent">
      <div class="vault-recent-head">
        <p class="vault-label" style="margin:0;">Recent activity</p>
        <a href="/locker" class="vault-link">Open your Locker &rarr;</a>
      </div>
      <div id="vaultActivity"><p class="vault-none">Nothing yet.</p></div>
    </div>
  </div>

  <div class="card">
    <label for="emailDisplay">Email Address</label>
    <input id="emailDisplay" type="email" disabled>

    <label for="screenNameInput">Screen Name</label>
    <input id="screenNameInput" type="text" autocomplete="nickname">

    <div class="row2">
      <div>
        <label for="firstNameInput">First Name</label>
        <input id="firstNameInput" type="text" autocomplete="given-name">
      </div>
      <div>
        <label for="lastNameInput">Last Name</label>
        <input id="lastNameInput" type="text" autocomplete="family-name">
      </div>
    </div>

    <label for="phoneInput">Mobile Phone</label>
    <input id="phoneInput" type="tel" autocomplete="tel">

    <label for="dobInput">Date of Birth</label>
    <input id="dobInput" type="date" autocomplete="bday">

    <div id="formError" role="alert"></div>
    <div id="formSuccess"></div>
    <button id="saveBtn" class="btn btn-flare">Save Changes</button>
    <button id="logoutBtn" class="btn btn-logout">Log Out</button>
  </div>
</div>

<script>
async function loadProfile() {
  const resp = await fetch('/api/profile');
  if (!resp.ok) {
    window.location.href = '/login';
    return;
  }
  const data = await resp.json();
  document.getElementById('customerNumberDisplay').textContent = `Customer #${data.customer_number}`;
  document.getElementById('emailDisplay').value = data.email;
  document.getElementById('firstNameInput').value = data.first_name;
  document.getElementById('screenNameInput').value = data.screen_name;
  document.getElementById('lastNameInput').value = data.last_name;
  document.getElementById('phoneInput').value = data.phone;
  document.getElementById('dobInput').value = data.date_of_birth;
}

document.getElementById('saveBtn').addEventListener('click', async () => {
  const errorEl = document.getElementById('formError');
  const successEl = document.getElementById('formSuccess');
  const btn = document.getElementById('saveBtn');
  errorEl.style.display = 'none';
  successEl.style.display = 'none';

  const payload = {
    first_name: document.getElementById('firstNameInput').value.trim(),
    screen_name: document.getElementById('screenNameInput').value.trim(),
    last_name: document.getElementById('lastNameInput').value.trim(),
    phone: document.getElementById('phoneInput').value.trim(),
    date_of_birth: document.getElementById('dobInput').value,
  };

  btn.disabled = true;
  btn.textContent = 'Saving...';

  try {
    const resp = await fetch('/api/profile', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify(payload)
    });
    const data = await resp.json();
    if (data.error) {
      errorEl.textContent = data.error;
      errorEl.style.display = 'block';
    } else {
      successEl.textContent = 'Saved.';
      successEl.style.display = 'block';
    }
  } catch (err) {
    errorEl.textContent = "Couldn't save — try again.";
    errorEl.style.display = 'block';
  } finally {
    btn.disabled = false;
    btn.textContent = 'Save Changes';
  }
});

document.getElementById('logoutBtn').addEventListener('click', async () => {
  await fetch('/api/logout', {method: 'POST'});
  window.location.href = '/';
});

loadProfile();

// Balance and a short recent list, from the same endpoint the locker uses -
// one source, so the two can never disagree about what's in the vault.
(function () {
  function esc(t) {
    return String(t == null ? '' : t).replace(/[&<>"']/g, function (c) {
      return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
    });
  }
  fetch('/api/locker').then(function (r) { return r.json(); }).then(function (d) {
    document.getElementById('vaultCount').textContent = d.balance_smacks;
    var items = (d.items || []).slice(0, 3);
    if (!items.length) return;
    document.getElementById('vaultActivity').innerHTML = items.map(function (it) {
      var armed = it.pending;
      var locked = it.kind === 'locked';
      var color = armed ? '#FFB800' : (locked ? '#FFB800' : '#E8142C');
      var sub = armed ? 'Waiting on the final'
              : (locked && it.team ? esc(it.team) + ' lost' : 'Smackagram sent');
      return '<a class="vault-item" href="/locker">' +
        '<span class="vault-dot" style="background:' + color + '22; color:' + color + ';">&#9679;</span>' +
        '<span class="vault-item-body">' +
          '<span class="vault-item-title">' + esc(it.recipient || 'Someone') + '</span>' +
          '<span class="vault-item-sub">' + sub + '</span>' +
        '</span></a>';
    }).join('');
  }).catch(function () {});
})();
</script>
{% include '_footer.html' %}
</body>
</html>
