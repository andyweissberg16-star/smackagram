<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Smack Sent</title>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;600&display=swap" rel="stylesheet">
<style>
 body{background:#0A0A0B;color:#F5F5F3;font-family:'Inter',sans-serif;
      min-height:100vh;display:flex;align-items:center;justify-content:center;}
 .box{width:min(560px,92vw);text-align:center;border:2px solid #E01B24;
      border-radius:16px;padding:44px 30px;
      background:linear-gradient(135deg,rgba(224,27,36,0.16),rgba(0,0,0,0.5));
      box-shadow:0 0 34px rgba(224,27,36,0.35);}
 h1{font-family:'Anton',sans-serif;font-size:clamp(30px,6vw,46px);
    margin:0 0 10px;letter-spacing:1px;}
 h1 span{color:#E01B24;}
 p{color:#C9CDD2;font-size:15px;line-height:1.6;margin:0 0 22px;}
 a{display:inline-block;margin:6px 8px;padding:13px 22px;border-radius:9px;
   text-decoration:none;font-family:'Anton',sans-serif;letter-spacing:1px;
   color:#F5F5F3;border:2px solid #E01B24;}
 a.hot{background:#E01B24;color:#fff;}
 a:hover{background:rgba(224,27,36,0.2);} a.hot:hover{background:#c4101f;}
</style></head><body>
<div class="box">
  <h1>YOUR SMACK <span>HAS BEEN SENT</span></h1>
  <p>The call is going out right now. Somewhere, a phone is ringing,
     and somebody's day is about to get worse in the funniest possible way.
     The call is anonymous. The loss is not.</p>
  <a class="hot" href="/smack-board">SMACK ANOTHER LOSER</a>
  <a href="/locker">MY LOCKER</a>
</div>
</body></html>
