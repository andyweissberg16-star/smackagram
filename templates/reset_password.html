<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Set a New Password — Smackagram</title>
<meta name="description" content="Log in to your Smackagram account.">
<meta name="robots" content="noindex">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Smackagram">
<meta property="og:title" content="Log in — Smackagram">
<meta property="og:description" content="Log in to your Smackagram account.">
<meta property="og:image" content="{{ url_for('static', filename='img/og-default.jpg', _external=True) }}">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:url" content="{{ request.base_url }}">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="Log in — Smackagram">
<meta name="twitter:description" content="Log in to your Smackagram account.">
<meta name="twitter:image" content="{{ url_for('static', filename='img/og-default.jpg', _external=True) }}">
<link rel="icon" type="image/png" sizes="32x32" href="{{ url_for('static', filename='img/favicon-32.png') }}">
<link rel="apple-touch-icon" href="{{ url_for('static', filename='img/apple-touch-icon.png') }}">
<meta name="theme-color" content="#0D0D0D">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{{ url_for('static', filename='css/smackagram.css') }}">
<style>
  :root{
    --ink:#0D0D0D; --ink-2:#1A1A1A; --chalk:#F5F5F3; --chalk-dim:#9A9A96;
    --flare:#E8142C; --gold:#FFD400; --line:rgba(245,245,243,0.10); --line-strong:rgba(245,245,243,0.24);
  }
  body{background:var(--ink); color:var(--chalk); font-family:'Inter',sans-serif; line-height:1.5; -webkit-font-smoothing:antialiased;}
  .wrap{max-width:420px; margin:0 auto; padding:0 24px 60px;}
  .hero{text-align:center; padding:36px 0 8px;}
  .hero h1{font-family:'Anton',sans-serif; font-size:var(--h1-form); text-transform:uppercase; letter-spacing:0.5px;}
  .hero p{color:var(--chalk-dim); font-size:13px; margin-top:8px;}
  .card{background:var(--ink-2); border:1px solid var(--line-strong); border-radius:6px; padding:28px; margin-top:24px;}
  label{display:block; font-size:var(--fs-sm); color:var(--chalk-dim); text-transform:uppercase; letter-spacing:0.5px; margin-bottom:6px;}
  input[type=email], input[type=password]{
    width:100%; background:var(--ink); border:1px solid var(--line-strong); color:var(--chalk);
    padding:12px 14px; font-family:'Inter',sans-serif; font-size:14px; border-radius:4px; margin-bottom:14px;
  }
  input:focus{outline:none; border-color:var(--flare);}
  .btn{font-weight:700; font-size:14px; padding:14px 24px; border-radius:4px; border:none; cursor:pointer; text-transform:uppercase; letter-spacing:0.5px; width:100%;}
  .btn-flare{background:var(--flare); color:#fff; box-shadow:0 0 20px rgba(232,20,44,0.4);}
  .btn-flare:disabled{opacity:0.5; cursor:not-allowed;}
  #formError{display:none; color:var(--flare-text); font-size:12px; margin-bottom:12px;}
  .switch-link{text-align:center; font-size:13px; color:var(--chalk-dim); margin-top:18px;}
  .switch-link a{color:var(--gold); text-decoration:none;}
</style>
</head>
<body>

{% include '_nav.html' %}

<div class="wrap">
  <div class="hero">
    <h1>Log In</h1>
    <p>Welcome back. Let's talk some smack.</p>
  </div>

  <div class="card">
    <label for="pw1">New password</label>
    <input id="pw1" type="password" placeholder="At least 6 characters"
           autocomplete="new-password">
    <label for="pw2">Type it again</label>
    <input id="pw2" type="password" placeholder="Same again"
           autocomplete="new-password">
    <div id="formError" role="alert"></div>
    <button id="saveBtn" class="btn btn-flare">Save it</button>
  </div>

  <div class="card">
    <label for="emailInput">Email Address</label>
    <input id="emailInput" type="email" placeholder="you@example.com" autocomplete="email">

    <label for="passwordInput">Password</label>
    <input id="passwordInput" type="password" placeholder="Your password" autocomplete="current-password">

    <div id="formError" role="alert"></div>
    <button id="loginBtn" class="btn btn-flare">Log In</button>
    <p class="switch-link" style="margin-bottom:4px;">
      <a href="/forgot-password">Forgotten your password?</a></p>
    <p class="switch-link">Need an account? <a href="/register">Register</a></p>
  </div>
</div>

<script>
const TOKEN = {{ token | tojson }};
</script>
<script>
(function () {
  var btn = document.getElementById('saveBtn');
  var err = document.getElementById('formError');
  if (!btn) return;
  btn.addEventListener('click', function () {
    var a = document.getElementById('pw1').value;
    var b = document.getElementById('pw2').value;
    err.style.display = 'none';
    // Two fields here, unlike registration, because somebody resetting a
    // password cannot check it later - a typo locks them out again.
    if (a.length < 6) {
      err.textContent = 'At least 6 characters.';
      err.style.display = 'block'; return;
    }
    if (a !== b) {
      err.textContent = 'Those do not match.';
      err.style.display = 'block'; return;
    }
    btn.disabled = true;
    btn.textContent = 'Saving\u2026';
    fetch('/api/reset-password', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({token: TOKEN, password: a})
    })
      .then(function (r) { return r.json(); })
      .then(function (d) {
        if (d.error) {
          err.textContent = d.error;
          err.style.display = 'block';
          btn.disabled = false;
          btn.textContent = 'Save it';
          return;
        }
        window.location.href = '/login';
      })
      .catch(function () {
        err.textContent = 'Could not save that. Try again.';
        err.style.display = 'block';
        btn.disabled = false;
        btn.textContent = 'Save it';
      });
  });
})();
</script>
{% include '_footer.html' %}
</body>
</html>
