<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Smack Feed &middot; Smackagram</title>
<meta name="description" content="Every smack as it goes out. Real teams, real losses, roasted by Smacky. React, hear them all, and send your own.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;600;700&family=JetBrains+Mono:wght@700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{{ url_for('static', filename='css/smackagram.css') }}">
<style>
  :root{
    --ink:#0a0608; --chalk:#F5F5F3; --chalk-dim:#9A8A90;
    --flare:#E8142C; --silver:#C3CAD3; --amber:#F5A623;
  }
  .feed-page{background:radial-gradient(ellipse at 50% -5%,rgba(232,20,44,.13),#0a0608 55%),#0a0608;min-height:100vh;}
  .feed-page *{box-sizing:border-box;}
  .fwrap{max-width:1200px;margin:0 auto;padding:0 16px 90px;}

  @keyframes ld{0%,100%{opacity:1}50%{opacity:.3}}
  @keyframes neonPulse{0%,100%{text-shadow:0 0 8px rgba(232,20,44,.9),0 0 20px rgba(232,20,44,.6),0 0 34px rgba(232,20,44,.35)}50%{text-shadow:0 0 12px rgba(232,20,44,1),0 0 28px rgba(232,20,44,.75),0 0 48px rgba(232,20,44,.5)}}
  @keyframes cardIn{0%{opacity:0;transform:translateY(8px)}100%{opacity:1;transform:translateY(0)}}
  @keyframes flash{0%{box-shadow:0 0 0 0 rgba(232,20,44,.5),0 0 16px rgba(232,20,44,.3)}100%{box-shadow:0 0 0 12px rgba(232,20,44,0),0 0 16px rgba(232,20,44,.3)}}

  .fsign{text-align:center;padding:26px 0 16px;border-bottom:1px solid #2a1a20;margin-bottom:18px;}
  .fsign h1{font-family:'Anton',sans-serif;font-size:clamp(40px,9vw,64px);
    text-transform:uppercase;letter-spacing:1px;margin:0;line-height:1;}
  .fsign h1 .w{color:#fff;animation:neonPulse 2.4s infinite;}
  .fsign h1 .r{color:#fff;animation:neonPulse 2.4s infinite;}
  .ticker{margin-top:10px;font-family:'JetBrains Mono',monospace;font-weight:700;
    font-size:11px;letter-spacing:1px;color:var(--chalk-dim);text-transform:uppercase;}
  .ticker .a{color:var(--flare);} .ticker .b{color:var(--amber);text-shadow:0 0 8px rgba(245,166,35,.5);}

  .grid{display:grid;grid-template-columns:190px 1fr 240px;gap:16px;align-items:start;}

  .rail-box{background:linear-gradient(160deg,rgba(24,14,18,.9),rgba(10,8,10,.9));
    border:1px solid #2a1a20;border-radius:12px;padding:13px;margin-bottom:12px;
    box-shadow:inset 0 0 20px rgba(0,0,0,.5);}
  .rail-h{font-family:'Anton',sans-serif;font-size:13px;text-transform:uppercase;
    letter-spacing:.6px;margin:0 0 11px;color:#ff6b73;text-shadow:0 0 8px rgba(232,20,44,.4);}
  .sidelink{display:flex;align-items:center;gap:9px;padding:8px 9px;border-radius:8px;
    color:#c9b8be;font-size:13px;font-weight:600;cursor:pointer;user-select:none;}
  .sidelink:hover{background:rgba(232,20,44,.06);}
  .sidelink.on{background:rgba(232,20,44,.12);color:#ff6b73;box-shadow:inset 0 0 12px rgba(232,20,44,.15);}
  .rail-list{display:flex;flex-direction:column;gap:6px;font-family:'JetBrains Mono',monospace;
    font-weight:700;font-size:10px;color:var(--chalk-dim);letter-spacing:.5px;}

  .lgtabs{display:flex;gap:7px;overflow-x:auto;padding-bottom:14px;-webkit-overflow-scrolling:touch;}
  .lgtab{font-family:'JetBrains Mono',monospace;font-weight:700;font-size:11px;
    letter-spacing:.5px;padding:8px 15px;border-radius:7px;border:1px solid #33202a;
    color:var(--chalk-dim);background:rgba(20,10,14,.6);cursor:pointer;white-space:nowrap;transition:.15s;}
  .lgtab.on{background:rgba(232,20,44,.15);border-color:var(--flare);color:#ff6b73;
    box-shadow:0 0 14px rgba(232,20,44,.55),inset 0 0 10px rgba(232,20,44,.15);
    text-shadow:0 0 8px rgba(232,20,44,.6);}

  .feed-box{border:2px solid var(--flare);border-radius:14px;
    box-shadow:0 0 18px rgba(232,20,44,.4),inset 0 0 24px rgba(0,0,0,.5);
    padding:12px 10px 12px 12px;height:1040px;
    overflow-y:auto;background:rgba(8,5,7,.5);}
  .feed-box::-webkit-scrollbar{width:9px;}
  .feed-box::-webkit-scrollbar-track{background:rgba(20,10,14,.6);border-radius:8px;}
  .feed-box::-webkit-scrollbar-thumb{background:var(--flare);border-radius:8px;
    box-shadow:0 0 6px rgba(232,20,44,.6);}
  .feed-box .sc:last-child{margin-bottom:0;}

  .sc{border-radius:12px;overflow:hidden;background:linear-gradient(160deg,#12151f,#0c0a0e);
    border:1px solid #2a1a20;margin-bottom:12px;box-shadow:inset 0 0 30px rgba(0,0,0,.5);
    animation:cardIn .45s ease;}
  .sc.fresh{border-color:var(--flare);box-shadow:0 0 16px rgba(232,20,44,.3),inset 0 0 30px rgba(0,0,0,.5);
    animation:cardIn .45s ease, flash 1.5s ease 1;}
  .sc-banner{padding:9px 13px;display:flex;align-items:center;gap:8px;
    border-bottom:1px solid rgba(232,20,44,.2);}
  .sc-team{font-family:'Anton',sans-serif;font-size:16px;color:#fff;text-transform:uppercase;
    text-shadow:0 0 10px rgba(255,255,255,.25);line-height:1;min-width:0;overflow:hidden;
    text-overflow:ellipsis;white-space:nowrap;}
  .typ{margin-left:auto;font-family:'JetBrains Mono',monospace;font-weight:700;font-size:8px;
    letter-spacing:1px;padding:3px 8px;border-radius:4px;text-transform:uppercase;flex:none;}
  .sc-body{padding:12px 13px;}
  .sc-score{font-family:'JetBrains Mono',monospace;font-weight:700;font-size:9px;
    color:var(--amber);letter-spacing:1px;margin-bottom:8px;text-shadow:0 0 8px rgba(245,166,35,.35);}
  .sc-desc{color:#d5cace;font-size:13px;line-height:1.4;}
  .sc-desc b{color:#fff;}
  .sc-desc .when{color:#8a7a80;}
  .splay{display:flex;align-items:center;gap:10px;margin-top:11px;}
  .spbtn{width:40px;height:40px;border-radius:50%;color:#fff;border:none;font-size:14px;
    flex:none;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:transform .1s;}
  .spbtn:active{transform:scale(.92);}
  .swave{flex:1;height:22px;display:flex;align-items:center;gap:2.5px;overflow:hidden;}
  .swave i{width:3px;border-radius:2px;flex:none;}
  .sdur{font-family:'JetBrains Mono',monospace;font-weight:700;font-size:9px;color:#8a7a80;flex:none;}
  .no-audio{font-family:'JetBrains Mono',monospace;font-weight:700;font-size:10px;
    color:#6a5a60;letter-spacing:.5px;padding:9px 0;}
  .sreact{display:flex;gap:6px;margin-top:11px;align-items:center;flex-wrap:wrap;}
  .rb{font-family:'JetBrains Mono',monospace;font-weight:700;font-size:10px;letter-spacing:.3px;
    padding:5px 9px;border-radius:6px;border:1px solid #33202a;color:var(--chalk-dim);
    display:flex;gap:4px;align-items:center;background:rgba(20,10,14,.5);cursor:pointer;
    transition:.12s;user-select:none;}
  .rb:hover{border-color:#4a2a32;color:#c9b8be;}
  .rb.on{border-color:var(--flare);color:#ff6b73;background:rgba(232,20,44,.1);box-shadow:0 0 8px rgba(232,20,44,.25);}
  .rb b{color:#fff;}
  .rb.on b{color:#ff6b73;}
  .send{margin-left:auto;font-family:'JetBrains Mono',monospace;font-weight:700;font-size:9px;
    letter-spacing:.4px;color:#fff;background:var(--flare);padding:7px 12px;border-radius:6px;
    box-shadow:0 0 12px rgba(232,20,44,.6);text-decoration:none;white-space:nowrap;cursor:pointer;border:none;}
  .send:hover{background:#ff2432;box-shadow:0 0 18px rgba(232,20,44,.8);}

  .feed-end{text-align:center;color:#6a5a60;font-family:'JetBrains Mono',monospace;
    font-weight:700;font-size:11px;letter-spacing:1px;padding:30px 0;text-transform:uppercase;}
  .feed-empty{text-align:center;color:var(--chalk-dim);padding:50px 20px;line-height:1.7;}
  .feed-empty .big{font-family:'Anton',sans-serif;font-size:24px;color:var(--chalk);
    text-transform:uppercase;margin-bottom:10px;}
  .cta{display:inline-block;margin-top:16px;background:var(--flare);color:#fff;
    font-family:'Anton',sans-serif;font-size:15px;letter-spacing:.5px;text-transform:uppercase;
    text-decoration:none;padding:11px 26px;border-radius:8px;box-shadow:0 0 18px rgba(232,20,44,.5);}

  .rail-rank{display:flex;flex-direction:column;gap:9px;font-size:12px;color:#c9b8be;}
  .rail-rank .n{color:var(--flare);font-weight:700;}
  .rail-stats{font-size:12px;color:#c9b8be;line-height:1.9;}
  .rail-stats b{color:#fff;}
  .sotd-team{font-family:'Anton',sans-serif;font-size:16px;color:#fff;text-transform:uppercase;}
  .sotd-meta{color:var(--chalk-dim);font-size:11px;margin:3px 0 10px;}
  .sotd-btn{width:100%;background:var(--flare);color:#fff;border:none;border-radius:7px;padding:9px;
    font-family:'JetBrains Mono',monospace;font-weight:700;font-size:10px;letter-spacing:.5px;
    box-shadow:0 0 14px rgba(232,20,44,.6);cursor:pointer;}

  @media(max-width:900px){
    .grid{grid-template-columns:1fr;}
    .rail-left, .rail-right{display:none;}
  }
</style>
</head>
<body class="feed-page">

{% include '_nav.html' %}

<div class="fwrap">

  <div class="fsign">
    <h1><span class="w">The Smack</span> <span class="r">Feed</span></h1>
    <div class="ticker" id="ticker"><span class="a">Loading the bar&hellip;</span></div>
  </div>

  <div class="grid">

    <div class="rail-left">
      <div class="rail-box" style="padding:8px;">
        <div class="sidelink on" data-mode="fresh">&#128293; <span>Fresh Smack</span></div>
        <div class="sidelink" data-mode="trending">&#128200; <span>Trending</span></div>
        <div class="sidelink" data-mode="loser">&#128128; <span>Loser Feed</span></div>
      </div>
      <div class="rail-box">
        <div class="rail-h">On Tap</div>
        <div class="rail-list">
          <span>LOSSES</span><span>BLOWOUTS</span><span>CHOKES</span>
          <span>RIVALRIES</span><span>FANTASY</span>
        </div>
      </div>
    </div>

    <div>
      <div class="lgtabs" id="lgtabs"></div>
      <div class="feed-box">
        <div id="feed"></div>
        <div class="feed-end" id="feedEnd" hidden>&mdash; that&rsquo;s the board &mdash;</div>
      </div>
    </div>

    <div class="rail-right">
      <div class="rail-box" style="border-color:var(--flare);box-shadow:0 0 18px rgba(232,20,44,.3),inset 0 0 20px rgba(0,0,0,.4);">
        <div class="rail-h" style="color:#fff;animation:neonPulse 2.4s infinite;">&#127942; Smack of the Day</div>
        <div id="sotd"><div class="sotd-meta">Waiting on tonight&rsquo;s winner&hellip;</div></div>
      </div>
      <div class="rail-box">
        <div class="rail-h">&#128200; Trending</div>
        <div class="rail-rank" id="trending"><div class="sotd-meta">&mdash;</div></div>
      </div>
      <div class="rail-box">
        <div class="rail-h" style="color:var(--amber);text-shadow:0 0 8px rgba(245,166,35,.4);">&#128202; Tonight</div>
        <div class="rail-stats" id="tonight">
          <div><b>&mdash;</b> smacks poured</div>
          <div><b>&mdash;</b> teams roasted</div>
        </div>
      </div>
    </div>

  </div>
</div>

<audio id="feedAudio" preload="none"></audio>

<script>
(function(){
  var REACTIONS = [
    {key:'SMACK', label:'SMACK', emoji:'\uD83D\uDD25'},
    {key:'COOKED', label:'COOKED', emoji:'\uD83D\uDE02'},
    {key:'BRUTAL', label:'BRUTAL', emoji:'\uD83D\uDC80'},
    {key:'WEAK', label:'WEAK', emoji:'\uD83D\uDC4E'}
  ];
  var TABS = [
    {key:'all', label:'ALL'}, {key:'mlb', label:'MLB'}, {key:'nfl', label:'NFL'},
    {key:'nba', label:'NBA'}, {key:'nhl', label:'NHL'}, {key:'wnba', label:'WNBA'},
    {key:'ncaa', label:'NCAA'}
  ];
  var TYPE = {
    smackagram: {label:'SMACK', bg:'rgba(255,255,255,.92)', fg:'#0A0A0B'},
    game_day:   {label:'GAME DAY', bg:'#E8142C', fg:'#fff'},
    auto:       {label:'AUTO-SMACK', bg:'#C3CAD3', fg:'#0A0A0B'},
    smackback:  {label:'SMACK BACK', bg:'#F5A623', fg:'#1A1206'},
    board:      {label:'SMACK BOARD', bg:'#F5A623', fg:'#1A1206'}
  };

  var reactor = null;
  try {
    reactor = localStorage.getItem('smack-reactor');
    if(!reactor){ reactor='r'+Math.random().toString(36).slice(2)+Date.now().toString(36);
      localStorage.setItem('smack-reactor', reactor); }
  } catch(e){ reactor='r'+Math.random().toString(36).slice(2); }
  var mine = {};
  try { mine = JSON.parse(localStorage.getItem('smack-mine') || '{}'); } catch(e){ mine={}; }
  function saveMine(){ try{ localStorage.setItem('smack-mine', JSON.stringify(mine)); }catch(e){} }

  var audio = document.getElementById('feedAudio');
  var nowPlaying = null;
  var curLeague = 'all';
  var curMode = 'fresh';
  var seenTop = null;
  var cache = [];

  function esc(t){ var d=document.createElement('div'); d.textContent=(t==null?'':t); return d.innerHTML; }

  function typeInfo(product){
    var p = (product||'').toLowerCase();
    if(TYPE[p]) return TYPE[p];
    if(p.indexOf('lock')>-1 || p.indexOf('auto')>-1) return TYPE.auto;
    if(p.indexOf('back')>-1) return TYPE.smackback;
    if(p.indexOf('game')>-1 || p.indexOf('day')>-1) return TYPE.game_day;
    if(p.indexOf('board')>-1) return TYPE.board;
    return TYPE.smackagram;
  }

  function describe(item, t){
    var head = item.headline || '';
    var lead = head ? esc(head) : (item.body ? esc(item.body).slice(0,90) : 'Got smacked.');
    var when = (item.when||'').toString();
    var extra = '';
    if(t.label === 'AUTO-SMACK') extra = ' \u26A1 Fired the second they lost.';
    else if(t.label === 'SMACK BACK') extra = ' The clapback.';
    return '<b>'+lead+'</b><span class="when"> \u00b7 '+esc(when.toUpperCase())+extra+'</span>';
  }

  function waveBars(color){
    var s='';
    for(var i=0;i<16;i++){
      var h = 5 + Math.round(Math.abs(Math.sin(i*1.7))*15);
      var on = i < 4;
      var col = on ? color : '#5a3a40';
      var glow = on ? 'box-shadow:0 0 4px '+color+';' : '';
      s += '<i style="height:'+h+'px;background:'+col+';'+glow+'"></i>';
    }
    return s;
  }

  function reactionRow(item){
    var counts = item.reactions || {};
    var mineForPost = mine[item.id] || {};
    return REACTIONS.map(function(rx){
      var n = counts[rx.key] || 0;
      var on = mineForPost[rx.key] ? ' on' : '';
      return '<button class="rb'+on+'" data-post="'+item.id+'" data-rx="'+rx.key+'">'
        + rx.emoji + (n ? ' <b>'+n+'</b>' : '') + '</button>';
    }).join('');
  }

  // CUSTOMIZE THIS SMACK -> opens the generator pre-loaded with this game,
  // where a FRESH call is made with the sender's own friend's name. It
  // never resends this audio file (that one already says someone else's
  // name) - same roast, your friend's name.
  function customizeUrl(item){
    var q = [];
    if(item.team) q.push('loser='+encodeURIComponent(item.team));
    if(item.league) q.push('sport='+encodeURIComponent(item.league.toLowerCase()));
    return '/game-day' + (q.length ? '?'+q.join('&') : '');
  }

  function card(item, isFresh){
    var t = typeInfo(item.product);
    var color = item.team_color || '#E8142C';
    var scoreLine = (item.headline || item.league)
      ? '<div class="sc-score">\u25CF '
        + (item.headline ? esc(item.headline).toUpperCase() : 'FINAL')
        + (item.league ? ' \u00b7 ' + esc(item.league) : '') + '</div>'
      : '';
    var player = item.audio_url
      ? '<div class="splay">'
        + '<button class="spbtn" style="background:'+color+';box-shadow:0 0 14px '+color+'99;" data-audio="'+esc(item.audio_url)+'">\u25B6</button>'
        + '<div class="swave">'+waveBars(color)+'</div>'
        + '<div class="sdur">TAP</div></div>'
      : '<div class="no-audio">\u25CB Line only &mdash; no audio on this one</div>';

    return '<div class="sc'+(isFresh?' fresh':'')+'" data-id="'+item.id+'">'
      + '<div class="sc-banner" style="background:linear-gradient(90deg,'+color+',#0c0a0e);">'
        + '<span class="sc-team">'+esc(item.team || 'A Mystery Fan')+' Got Smacked</span>'
        + '<span class="typ" style="background:'+t.bg+';color:'+t.fg+';box-shadow:0 0 10px '+t.bg+'88;">'+t.label+'</span>'
      + '</div>'
      + '<div class="sc-body">'
        + scoreLine
        + '<div class="sc-desc">'+describe(item, t)+'</div>'
        + player
        + '<div class="sreact">'+reactionRow(item)
          + '<a class="send" href="'+customizeUrl(item)+'" title="Same roast, your friend\u2019s name">\u2197 CUSTOMIZE THIS SMACK</a>'
        + '</div>'
      + '</div></div>';
  }

  function render(items, markFreshAboveId){
    var feed = document.getElementById('feed');
    if(!items.length){
      feed.innerHTML = '<div class="feed-empty"><div class="big">Quiet in here</div>'
        + 'No smacks on this tab yet. As calls go out they land here live.'
        + '<br><a class="cta" href="/send-a-smack">Send a Smack \u2192</a></div>';
      document.getElementById('feedEnd').hidden = true;
      return;
    }
    feed.innerHTML = items.map(function(it){
      var fresh = (markFreshAboveId!=null && it.id > markFreshAboveId);
      return card(it, fresh);
    }).join('');
    document.getElementById('feedEnd').hidden = items.length < 10;
    wire();
  }

  function wire(){
    document.querySelectorAll('.spbtn').forEach(function(btn){
      btn.addEventListener('click', function(){
        var url = btn.dataset.audio;
        if(nowPlaying === btn && !audio.paused){ audio.pause(); btn.textContent='\u25B6'; return; }
        if(nowPlaying){ nowPlaying.textContent='\u25B6'; }
        audio.src = url; audio.play();
        btn.textContent='\u275A\u275A'; nowPlaying = btn;
      });
    });
    document.querySelectorAll('.rb').forEach(function(btn){
      btn.addEventListener('click', function(){
        var pid = btn.dataset.post, rx = btn.dataset.rx;
        // LOCKED IN: once placed, an emoji can't be removed.
        if(mine[pid] && mine[pid][rx]) return;
        fetch('/api/smack-feed/react', {
          method:'POST', headers:{'Content-Type':'application/json'},
          body: JSON.stringify({post_id:Number(pid), reaction:rx, reactor:reactor})
        }).then(function(r){return r.json();}).then(function(d){
          if(!d || d.error) return;
          mine[pid] = mine[pid] || {};
          mine[pid][rx] = true;   // locked in
          saveMine();
          var row = btn.closest('.sreact');
          var counts = d.reactions || {};
          row.querySelectorAll('.rb').forEach(function(b){
            var k=b.dataset.rx, n=counts[k]||0;
            var meta = REACTIONS.find(function(x){return x.key===k;});
            var on = (mine[pid] && mine[pid][k]);
            b.className = 'rb'+(on?' on':'');
            b.innerHTML = meta.emoji+(n?' <b>'+n+'</b>':'');
          });
          updateRails(cache);
        }).catch(function(){});
      });
    });
  }
  audio.addEventListener('ended', function(){ if(nowPlaying){ nowPlaying.textContent='\u25B6'; nowPlaying=null; } });

  function reactSum(x){ var c=x.reactions||{}, s=0; for(var k in c) s+=c[k]; return s; }

  function applyMode(items){
    var arr = items.slice();
    if(curMode === 'trending'){
      arr.sort(function(a,b){ return reactSum(b)-reactSum(a); });
    } else if(curMode === 'loser'){
      arr = arr.filter(function(x){ return x.headline; });
    }
    return arr;
  }

  function load(first){
    var url = '/api/smack-feed?limit=60' + (curLeague!=='all' ? '&league='+curLeague : '');
    fetch(url).then(function(r){return r.json();}).then(function(d){
      cache = (d && d.items) || [];
      var items = applyMode(cache);
      var markAbove = (first || curMode!=='fresh') ? null : seenTop;
      render(items, markAbove);
      if(cache.length) seenTop = cache[0].id;
      updateRails(cache);
    }).catch(function(){
      document.getElementById('feed').innerHTML =
        '<div class="feed-empty"><div class="big">Couldn\u2019t load the feed</div>Try again in a moment.</div>';
    });
  }

  function updateRails(items){
    var byTeam = {};
    items.forEach(function(it){
      if(!it.team) return;
      byTeam[it.team] = (byTeam[it.team]||0) + reactSum(it) + 1;
    });
    var ranked = Object.keys(byTeam).map(function(t){return {team:t, n:byTeam[t]};})
      .sort(function(a,b){return b.n-a.n;}).slice(0,4);
    var tr = document.getElementById('trending');
    tr.innerHTML = ranked.length
      ? ranked.map(function(r,i){ return '<div><span class="n">'+(i+1)+'.</span> '+esc(r.team)+'</div>'; }).join('')
      : '<div class="sotd-meta">Nothing trending yet.</div>';

    var top = items.slice().sort(function(a,b){return reactSum(b)-reactSum(a);})[0];
    var sotd = document.getElementById('sotd');
    if(top && reactSum(top)>0){
      sotd.innerHTML = '<div class="sotd-team">'+esc(top.team||'')+'</div>'
        + '<div class="sotd-meta">'+esc(top.headline||'Got smacked')+' \u00b7 '+reactSum(top)+' reactions</div>'
        + (top.audio_url ? '<button class="sotd-btn" data-audio="'+esc(top.audio_url)+'">\u25B6 HEAR IT</button>' : '');
      var b = sotd.querySelector('.sotd-btn');
      if(b) b.addEventListener('click', function(){ audio.src=b.dataset.audio; audio.play(); });
    } else {
      sotd.innerHTML = '<div class="sotd-meta">First reactions crown the winner.</div>';
    }
  }

  function loadStats(){
    fetch('/api/smack-feed/stats').then(function(r){return r.json();}).then(function(d){
      document.getElementById('ticker').innerHTML =
        '<span class="a">\uD83D\uDD25 '+(d.sent_today||0)+'</span> SENT TONIGHT \u00b7 '
        + '<span class="b">'+(d.teams_roasted||0)+'</span> TEAMS ON THE RAIL';
      document.getElementById('tonight').innerHTML =
        '<div><b>'+(d.sent_today||0)+'</b> smacks poured</div>'
        + '<div><b>'+(d.teams_roasted||0)+'</b> teams roasted</div>';
    }).catch(function(){ document.getElementById('ticker').textContent=''; });
  }

  document.getElementById('lgtabs').innerHTML = TABS.map(function(t){
    return '<button class="lgtab'+(t.key==='all'?' on':'')+'" data-lg="'+t.key+'">'+t.label+'</button>';
  }).join('');
  document.querySelectorAll('.lgtab').forEach(function(tab){
    tab.addEventListener('click', function(){
      document.querySelectorAll('.lgtab').forEach(function(x){x.classList.remove('on');});
      tab.classList.add('on'); curLeague = tab.dataset.lg; load(true);
    });
  });
  document.querySelectorAll('.sidelink[data-mode]').forEach(function(el){
    el.addEventListener('click', function(){
      document.querySelectorAll('.sidelink[data-mode]').forEach(function(x){x.classList.remove('on');});
      el.classList.add('on'); curMode = el.dataset.mode; render(applyMode(cache), null);
    });
  });

  loadStats();
  load(true);
  setInterval(function(){ if(!document.hidden){ load(false); loadStats(); } }, 25000);
})();
</script>

</body>
</html>
