<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Smackcast Test Tool</title>
<meta name="description" content="Admin only.">
<meta name="robots" content="noindex">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Smackagram">
<meta property="og:title" content="Smackcast test tool">
<meta property="og:description" content="Admin only.">
<meta property="og:image" content="{{ url_for('static', filename='img/og-default.jpg', _external=True) }}">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:url" content="{{ request.base_url }}">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="Smackcast test tool">
<meta name="twitter:description" content="Admin only.">
<meta name="twitter:image" content="{{ url_for('static', filename='img/og-default.jpg', _external=True) }}">
<link rel="icon" type="image/png" sizes="32x32" href="{{ url_for('static', filename='img/favicon-32.png') }}">
<link rel="apple-touch-icon" href="{{ url_for('static', filename='img/apple-touch-icon.png') }}">
<meta name="theme-color" content="#0D0D0D">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{{ url_for('static', filename='css/smackagram.css') }}">
<style>
  :root{
    --ink:#0D0D0D; --ink-2:#1A1A1A; --chalk:#F5F5F3; --chalk-dim:#9A9A96;
    --flare:#E8142C; --gold:#FFD400; --line:rgba(245,245,243,0.10); --line-strong:rgba(245,245,243,0.24);
  }
  body{background:var(--ink); color:var(--chalk); font-family:'Inter',sans-serif; line-height:1.5; -webkit-font-smoothing:antialiased;}
  .wrap{max-width:640px; margin:0 auto; padding:0 24px 80px;}
  .hero{text-align:center; padding:36px 0 8px;}
  .hero .label{font-family:'JetBrains Mono',monospace; font-size:11px; color:var(--flare-text); text-transform:uppercase; letter-spacing:1px;}
  .hero h1{font-family:'Anton',sans-serif; font-size:var(--h1-form); text-transform:uppercase; letter-spacing:0.5px; margin-top:8px;}
  .hero p{color:var(--chalk-dim); font-size:13px; margin-top:10px; line-height:1.5;}

  .card{background:var(--ink-2); border:1px solid var(--line-strong); border-radius:6px; padding:24px; margin-top:24px;}
  label{display:block; font-size:var(--fs-sm); color:var(--chalk-dim); text-transform:uppercase; letter-spacing:0.5px; margin:14px 0 6px;}
  label:first-child{margin-top:0;}
  input[type=text], input[type=number]{
    width:100%; background:var(--ink); border:1px solid var(--line-strong); color:var(--chalk);
    padding:12px 14px; font-family:'Inter',sans-serif; font-size:14px; border-radius:4px;
  }
  select{
    width:100%; background:var(--ink); border:1px solid var(--line-strong); color:var(--chalk);
    padding:12px 14px; font-family:'Inter',sans-serif; font-size:14px; border-radius:4px;
  }
  input:focus, select:focus{outline:none; border-color:var(--flare);}

  .btn{font-weight:700; font-size:14px; padding:14px 24px; border-radius:4px; border:none; cursor:pointer; text-transform:uppercase; letter-spacing:0.5px; width:100%; margin-top:20px;}
  .btn-flare{background:var(--flare); color:#fff; box-shadow:0 0 20px rgba(232,20,44,0.4);}
  .btn-flare:disabled{opacity:0.5; cursor:not-allowed;}
  #formError{display:none; color:var(--flare-text); font-size:12px; margin-top:12px;}

  .result-card{display:none;}
  .matchup-line{font-size:13px; color:var(--chalk-dim); padding:6px 0; border-bottom:1px solid var(--line);}
  audio{width:100%; margin:16px 0;}
  .script-text{font-size:14px; color:#DCDCD9; white-space:pre-wrap; line-height:1.7; margin-top:16px;}
  .best-line{
    font-family:'Anton',sans-serif; font-size:18px; color:var(--gold); text-align:center;
    padding:16px; background:var(--ink); border-radius:4px; margin:16px 0;
  }
</style>
</head>
<body>

{% include '_nav.html' %}

<div class="wrap">
  <div class="hero">
    <p class="label">Admin Only — Test Tool</p>
    <h1>Smackcast Generator Test</h1>
    <p>Runs the full real pipeline (script, audio, meme) against realistic sample matchup data — no real league or account needed.</p>
  </div>

  <div class="card">
    <label for="sportSelect">Sport</label>
    <select id="sportSelect">
      <option value="nfl">Football</option>
      <option value="nba">Basketball</option>
      <option value="mlb">Baseball</option>
    </select>

    <label for="leagueNameInput">League Name</label>
    <input id="leagueNameInput" type="text" value="The League of Extraordinary Nonsense">

    <label for="teamCountInput">Team Count</label>
    <input id="teamCountInput" type="number" value="10" min="4" max="20">

    <label for="weekInput">Week Number</label>
    <input id="weekInput" type="number" value="13" min="1" max="18">

    <label style="display:flex; align-items:center; gap:10px; margin:14px 0; cursor:pointer;">
      <input type="checkbox" id="stressInput" style="width:20px; height:20px; flex-shrink:0;">
      <span>Stress test read-aloud handling &mdash; replaces every team name with a deliberately awkward one (leetspeak, emoji, all-caps, symbols)</span>
    </label>

    <label style="display:flex; align-items:center; gap:10px; margin:14px 0; cursor:pointer;">
      <input type="checkbox" id="saveInput" style="width:20px; height:20px; flex-shrink:0;">
      <span>Save to my Smackcast library &mdash; keeps this recap with a share link and download, so you can hear it again or publish it as a sample</span>
    </label>

    <div id="formError" role="alert"></div>
    <button id="generateBtn" class="btn btn-flare">Generate Test Recap</button>
  </div>

  <div class="card result-card" id="resultCard">
    <p style="font-size:11px; color:var(--chalk-dim); text-transform:uppercase; letter-spacing:0.5px; margin-bottom:10px;">Sample Matchups Used</p>
    <div id="matchupsList"></div>

    <div id="bestLineWrap"></div>
    <audio id="audioPlayer" controls preload="metadata"></audio>
    <img id="memeImage" src="" alt="Generated meme" style="width:100%; border-radius:4px; display:none;">
    <p class="script-text" id="scriptText"></p>
  </div>
</div>

<script>
document.getElementById('generateBtn').addEventListener('click', async () => {
  const errorEl = document.getElementById('formError');
  const resultCard = document.getElementById('resultCard');
  const btn = document.getElementById('generateBtn');
  errorEl.style.display = 'none';
  resultCard.style.display = 'none';

  const payload = {
    sport: document.getElementById('sportSelect').value,
    league_name: document.getElementById('leagueNameInput').value.trim(),
    team_count: parseInt(document.getElementById('teamCountInput').value, 10),
    week: parseInt(document.getElementById('weekInput').value, 10),
    stress: document.getElementById('stressInput').checked,
    save_to_library: document.getElementById('saveInput').checked,
  };

  btn.textContent = 'Generating... (this takes a bit — real AI + audio + image generation)';
  btn.disabled = true;

  function render(data) {
      document.getElementById('matchupsList').innerHTML = data.matchups.map(m =>
        `<div class="matchup-line">${m.team_a} (${m.team_a_score}) vs ${m.team_b} (${m.team_b_score})</div>`
      ).join('');

      if (data.best_line) {
        document.getElementById('bestLineWrap').innerHTML = `<p class="best-line">"${data.best_line}"</p>`;
      }

      document.getElementById('audioPlayer').src = data.audio_url;

      const memeImg = document.getElementById('memeImage');
      if (data.meme_url) {
        memeImg.src = data.meme_url;
        memeImg.style.display = 'block';
      } else {
        memeImg.style.display = 'none';
      }

      document.getElementById('scriptText').textContent = data.script;
      resultCard.style.display = 'block';
  }

  // Generation is a background job now - it makes a Claude call, one
  // ElevenLabs call per matchup, an S3 upload and a meme, which took
  // minutes. Running that inline blocked the site's single worker and took
  // every other page down with it until gunicorn killed the worker. So this
  // starts the job, gets an id back immediately, and polls.
  try {
    const startResp = await fetch('/api/smackcast/test-generate', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify(payload)
    });
    const started = await startResp.json();
    if (started.error) {
      errorEl.textContent = started.error;
      errorEl.style.display = 'block';
      btn.textContent = 'Generate Test Recap';
      btn.disabled = false;
      return;
    }

    const jobId = started.job_id;
    const startedAt = Date.now();
    // Generous ceiling - a 14-team league is a dozen-plus TTS calls - but
    // finite, so a stalled job reports instead of spinning forever.
    const LIMIT_MS = 8 * 60 * 1000;

    while (true) {
      await new Promise(r => setTimeout(r, 3000));
      if (Date.now() - startedAt > LIMIT_MS) {
        errorEl.textContent = "Generation is taking unusually long — check the Render logs.";
        errorEl.style.display = 'block';
        break;
      }
      const poll = await fetch(`/api/smackcast/test-status/${jobId}`);
      if (poll.status === 404) {
        errorEl.textContent = "Lost track of that job — the server may have restarted. Try again.";
        errorEl.style.display = 'block';
        break;
      }
      const data = await poll.json();
      if (data.status === 'generating') {
        const secs = Math.round((Date.now() - startedAt) / 1000);
        btn.textContent = `Generating... ${secs}s (AI + audio + image)`;
        continue;
      }
      if (data.status === 'failed') {
        errorEl.textContent = data.error || 'Generation failed — try again.';
        errorEl.style.display = 'block';
        break;
      }
      render(data);
      break;
    }
  } catch (err) {
    errorEl.textContent = "Generation failed — try again.";
    errorEl.style.display = 'block';
  } finally {
    btn.textContent = 'Generate Test Recap';
    btn.disabled = false;
  }
});
</script>
</body>
</html>
