<script>
const challengeCode = "{{ challenge_code }}";
const INTENSITY_LABELS = {1: 'Clean', 2: 'Mild', 3: 'Aggressive', 4: 'Savage'};
const LEAGUE_LABELS = {nfl: 'NFL', nba: 'NBA', mlb: 'MLB', nhl: 'NHL', wnba: 'WNBA', ncaaf: 'NCAA Football', ncaab: 'NCAA Basketball', soccer: 'Soccer'};
// Maps Smack Battle's own league dropdown values to the `league` keys
// actually used by /api/teams/all, for restricting the team autocomplete
// to just that league. Most are 1:1, but "soccer" spans five separate
// real leagues in the team data.
const LEAGUE_TEAM_KEYS = {
  nfl: 'nfl', nba: 'nba', mlb: 'mlb', nhl: 'nhl', wnba: 'wnba',
  ncaaf: 'ncaaf', ncaab: 'ncaab',
  soccer: 'mls,epl,laliga,bundesliga,seriea'
};
let turnTimerInterval = null;
function clearTurnTimer() {
  if (turnTimerInterval) { clearInterval(turnTimerInterval); turnTimerInterval = null; }
}

function getMySide() {
  return localStorage.getItem(`battle_side_${challengeCode}`);
}
function setMySide(side) {
  localStorage.setItem(`battle_side_${challengeCode}`, side);
}
function getVoterId() {
  let id = localStorage.getItem('smackagram_battle_voter_id');
  if (!id) {
    id = 'voter-' + crypto.randomUUID();
    localStorage.setItem('smackagram_battle_voter_id', id);
  }
  return id;
}
function getViewerId() {
  let id = localStorage.getItem('smackagram_battle_viewer_id');
  if (!id) {
    id = 'viewer-' + crypto.randomUUID();
    localStorage.setItem('smackagram_battle_viewer_id', id);
  }
  return id;
}
function escapeHtml(str) {
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

let soundEnabled = true;
let sfxUrls = null;
let introShown = false;
let lastLineCount = 0;
let lastRoundResultsCount = 0;
let knownRoundNumber = null;
let lastActionSignature = null;
let lastLineHistorySignature = null;
let judgingStartedAt = null;
let myScorecardUnlocked = false;
let finalConfirmClicked = false;
let recapWaitStartedAt = null;
let judgingBeepIntervalId = null;

function startJudgingBeep() {
  if (judgingBeepIntervalId !== null) return; // already running
  const el = document.getElementById('judgingBeepAudio');
  if (!el || !el.src) return;
  // The crowd loop restarting the beep every second on top of it was
  // producing audible stutter on the crowd track itself - these two
  // don't need to overlap, and pausing the crowd during the judging
  // beat is a nice touch anyway (quiets down for the suspense moment).
  const crowdAudio = document.getElementById('crowdLoopAudio');
  if (crowdAudio && !crowdAudio.paused) crowdAudio.pause();
  judgingBeepIntervalId = setInterval(() => playAudioElement('judgingBeepAudio'), 1000);
}

function stopJudgingBeep() {
  if (judgingBeepIntervalId !== null) {
    clearInterval(judgingBeepIntervalId);
    judgingBeepIntervalId = null;
  }
  // Resume (not restart from 0 - .pause() doesn't reset position) once
  // the beep stops, as long as the battle is still actually active.
  const crowdAudio = document.getElementById('crowdLoopAudio');
  if (crowdAudio && crowdAudio.paused && crowdAudio.src && lastKnownStatus === 'active') {
    crowdAudio.muted = false;
    crowdAudio.volume = 0.15;
    crowdAudio.play().catch(() => {});
  }
}

async function initSound() {
  try {
    if (!sfxUrls) {
      const resp = await fetch('/api/battle-sfx');
      sfxUrls = await resp.json();
    }
    soundEnabled = true;

    // Every sound effect lives on a persistent, pre-existing <audio>
    // element with its src set once here, rather than a fresh
    // `new Audio()` created at the moment each sound needs to play.
    // Mobile Safari in particular is strict about only allowing a
    // brand-new Audio object to play if it's directly tied to a user
    // gesture — but replaying an element that was already unlocked once
    // (see handlePageInteraction) is reliably allowed from anywhere,
    // including from inside a poll callback.
    const sourceMap = {
      cheerAudio: sfxUrls.cheer_url,
      booAudio: sfxUrls.boo_url,
      critiqueRevealAudio: sfxUrls.critique_reveal_url,
      bellAudio: sfxUrls.bell_url,
      introAudio: sfxUrls.intro_url,
      tickAudio: sfxUrls.countdown_tick_url,
      newLineAudio: sfxUrls.new_line_url,
      judgingBeepAudio: sfxUrls.judging_beep_url,
    };
    for (const [id, url] of Object.entries(sourceMap)) {
      const el = document.getElementById(id);
      if (el && url) el.src = url;
    }
    if (document.getElementById('critiqueRevealAudio')) {
      document.getElementById('critiqueRevealAudio').volume = 0.5;
    }

    const crowdAudio = document.getElementById('crowdLoopAudio');
    if (sfxUrls.crowd_loop_url) {
      crowdAudio.src = sfxUrls.crowd_loop_url;
      crowdAudio.volume = 0.15;
    }
    const waitingAudio = document.getElementById('waitingMusicAudio');
    if (sfxUrls.waiting_music_url) {
      waitingAudio.src = sfxUrls.waiting_music_url;
      waitingAudio.volume = 0.25;
    }
    // Browsers block audio-with-sound from truly autoplaying before any
    // interaction with the page — updateBackgroundMusic figures out
    // which loop should actually be playing for the current status;
    // this first attempt will likely get silently blocked, which is
    // fine, since handlePageInteraction catches the first real
    // interaction and retries from there.
    updateBackgroundMusic(lastKnownStatus);
  } catch (err) {
    // sound just won't be available this session — not fatal
  }
}

let lastKnownStatus = 'waiting';

// Warn before leaving mid-battle - only while waiting for an opponent
// or actively battling, never once it's complete (nothing left to
// lose by leaving at that point). Note: modern browsers (Chrome,
// Firefox, Safari) block custom text in this dialog for security
// reasons and always show their own generic message - this can
// trigger the warning dialog itself, but not control its wording.
window.addEventListener('beforeunload', function(e) {
  if (lastKnownStatus === 'waiting' || lastKnownStatus === 'active') {
    e.preventDefault();
    e.returnValue = '';
    return '';
  }
});

let completeMusicStarted = false;
let musicMuted = localStorage.getItem('smk_music_muted') === 'true';

function updateMuteButtonUI() {
  const btn = document.getElementById('musicMuteBtn');
  if (!btn) return;
  btn.textContent = musicMuted ? '🔇' : '🔊';
  btn.classList.toggle('muted', musicMuted);
  btn.setAttribute('aria-label', musicMuted ? 'Unmute background music' : 'Mute background music');
  btn.title = musicMuted ? 'Unmute music' : 'Mute music';
}
updateMuteButtonUI();

document.getElementById('musicMuteBtn').addEventListener('click', () => {
  musicMuted = !musicMuted;
  localStorage.setItem('smk_music_muted', musicMuted);
  updateMuteButtonUI();
  const crowdAudio = document.getElementById('crowdLoopAudio');
  const waitingAudio = document.getElementById('waitingMusicAudio');
  const critiqueAudio = document.getElementById('critiqueRevealAudio');
  if (crowdAudio) crowdAudio.muted = musicMuted;
  if (waitingAudio) waitingAudio.muted = musicMuted;
  if (critiqueAudio) critiqueAudio.muted = musicMuted;
});

function updateBackgroundMusic(status) {
  const crowdAudio = document.getElementById('crowdLoopAudio');
  const waitingAudio = document.getElementById('waitingMusicAudio');
  if (status !== 'complete') completeMusicStarted = false;

  if (status === 'waiting' || status === 'complete') {
    // Same epic rock track for both the "waiting to start" screen and
    // the final scorecard reveal — the crowd loop is specifically for
    // the live back-and-forth of an active battle.
    if (crowdAudio && !crowdAudio.paused) crowdAudio.pause();
    if (waitingAudio && waitingAudio.src) {
      // Respects the user's mute preference rather than always forcing
      // unmuted — the mobile unlock sequence intentionally leaves
      // elements muted afterward (see unlockOneShotSounds), so this
      // still can't just assume a prior state either way.
      if (waitingAudio.muted !== musicMuted) waitingAudio.muted = musicMuted;
      if (waitingAudio.volume !== 0.25) waitingAudio.volume = 0.25;
      if (status === 'complete' && !completeMusicStarted) {
        // The scorecard reveal should feel like a clean musical moment
        // of its own, not a continuation of whatever point the track
        // happened to be at from the pre-battle waiting screen — restart
        // it fresh exactly once, right on the transition into complete.
        // Guarded by completeMusicStarted so a later click (voting,
        // etc.) — which also runs through this same function via
        // handlePageInteraction — doesn't keep restarting the track
        // from the beginning every time.
        completeMusicStarted = true;
        waitingAudio.currentTime = 0;
        waitingAudio.play().catch(() => {});
      } else if (waitingAudio.paused) {
        waitingAudio.play().catch(() => {});
      }
    }
  } else {
    if (waitingAudio && !waitingAudio.paused) waitingAudio.pause();
    if (crowdAudio && crowdAudio.src) {
      // Only write these when they actually differ. This function runs on
      // every 1.5s poll, and blindly re-assigning muted/volume on a
      // playing media element that often is a known source of audible
      // stutter, especially on mobile Safari.
      if (crowdAudio.muted !== musicMuted) crowdAudio.muted = musicMuted;
      if (crowdAudio.volume !== 0.15) crowdAudio.volume = 0.15;
      if (crowdAudio.paused) crowdAudio.play().catch(() => {});
    }
  }
}

initSound();


function handlePageInteraction() {
  // Browsers block real autoplay-with-sound before any interaction on
  // every site — the first tap/click anywhere on the page unlocks and
  // starts the music (still subject to the user's own mute toggle above).
  updateBackgroundMusic(lastKnownStatus);
}

['click', 'touchstart', 'keydown'].forEach(evt => {
  document.addEventListener(evt, handlePageInteraction);
});

let hypeShown = false;

function showHypePopup() {
  if (hypeShown) return;
  hypeShown = true;
  const overlay = document.getElementById('hypeOverlay');
  overlay.style.display = 'flex';
  document.getElementById('hypeBtn').addEventListener('click', () => {
    overlay.style.display = 'none';
    // Explicit, direct call rather than relying on this click bubbling
    // up to the page's global click listener (handlePageInteraction) -
    // this is the moment the user has actually entered the waiting
    // room for real, so the music should start right here, guaranteed,
    // not depend on event propagation timing.
    updateBackgroundMusic(lastKnownStatus);
    unlockOneShotSounds();
  });
}

async function unlockOneShotSounds() {
  // The one-shot effects (critique reveal, cheer, boo, bell, intro,
  // tick, new-line) only ever get played later from inside poll
  // callbacks, never a direct click — without an explicit unlock during
  // a real gesture first, mobile browsers reject them outright, and
  // even more lenient desktop browsers can still cut them off
  // unreliably since they were never genuinely granted permission. This
  // is the single deliberate moment (the hype button click) to unlock
  // all of them properly — one at a time, awaiting each fully finishing
  // before starting the next, and using both muted+volume together
  // (not just volume=0, which wasn't reliably silent on its own) so
  // there's no chance of the earlier overlapping-blips bug coming back.
  // critiqueRevealAudio goes first — it's needed almost immediately
  // (right after round 1's judging finishes), so it gets unlocked
  // before anything else that has more time before it's actually
  // needed.
  // crowdLoopAudio specifically needs to be here too — unlike
  // waitingMusicAudio (which gets a genuine gesture-unlock naturally,
  // since updateBackgroundMusic() already plays it during this same
  // click), crowdLoopAudio never gets attempted until the battle
  // actually goes active, and that transition is usually detected via
  // a poll, not a direct click — so on mobile, its very first play()
  // attempt would get rejected without this.
  const ids = ['critiqueRevealAudio', 'judgingBeepAudio', 'cheerAudio', 'booAudio', 'bellAudio', 'introAudio', 'tickAudio', 'newLineAudio', 'crowdLoopAudio'];
  for (const id of ids) {
    const el = document.getElementById(id);
    if (!el || !el.src) continue;
    el.muted = true;
    el.volume = 0;
    try {
      await el.play();
      el.pause();
      el.currentTime = 0;
    } catch (err) {
      // Fine if this one didn't unlock — later attempts to play it will
      // just silently fail via the existing .catch(() => {}) handling.
    }
    // Deliberately NOT restoring volume/muted here — leaving it muted
    // is what genuinely eliminated the risk of an audible blip landing
    // right as this unlock sequence overlaps with the real round-start
    // sequence (bell, countdown, etc). playAudioElement() below now
    // explicitly sets the correct volume and unmutes every single time
    // it actually plays something for real, instead of relying on a
    // "restore" step here that could race against real playback.
  }
}

// Each sound's actual intended volume when genuinely played — mostly
// full volume, except critique-reveal which stays a bit quieter since
// it's meant to sit under the critique text, not dominate it.
const SOUND_VOLUMES = { critiqueRevealAudio: 0.5 };

function playAudioElement(id) {
  const el = document.getElementById(id);
  if (el && el.src) {
    // critiqueRevealAudio is the looping "rock music" background track
    // during round review, not a one-shot sound effect like the others
    // this function also plays (bell, cheer, boo, new-line, etc) - those
    // should always stay audible regardless of the music mute toggle,
    // but this one is background music and should respect it, same as
    // the waiting-room/crowd-loop tracks do.
    el.muted = (id === 'critiqueRevealAudio') ? musicMuted : false;
    el.volume = SOUND_VOLUMES[id] !== undefined ? SOUND_VOLUMES[id] : 1.0;
    el.currentTime = 0;
    el.play().catch(() => {});
  }
}

function showRoundResultPopup(outcome) {
  // outcome: "win", "loss", or "tie" — relative to the local viewer's side
  const popup = document.getElementById('roundResultPopup');
  popup.className = 'round-popup';
  popup.textContent = outcome === 'win' ? 'You won that round!'
    : outcome === 'loss' ? 'You lost that round'
    : 'Round tied';

  void popup.offsetWidth;
  popup.classList.add(outcome, 'show');
  setTimeout(() => { popup.classList.remove('show'); }, 5000);

  if (soundEnabled && sfxUrls) {
    if (outcome === 'win' && sfxUrls.cheer_url) playAudioElement('cheerAudio');
    if (outcome === 'loss' && sfxUrls.boo_url) playAudioElement('booAudio');
    if (sfxUrls.critique_reveal_url) playAudioElement('critiqueRevealAudio');
  }
}

function ringBell() {
  if (soundEnabled && sfxUrls && sfxUrls.bell_url) {
    playAudioElement('bellAudio');
  }
}

function playIntro(teamA, teamB, teamAColor, teamBColor) {
  const overlay = document.getElementById('introOverlay');
  const countdownEl = document.getElementById('introCountdown');
  const introTeamAEl = document.getElementById('introTeamA');
  const introTeamBEl = document.getElementById('introTeamB');
  introTeamAEl.textContent = teamA;
  introTeamBEl.textContent = teamB;
  introTeamAEl.style.color = readableColor(teamAColor, '');
  introTeamBEl.style.color = readableColor(teamBColor, '');
  countdownEl.textContent = '';
  countdownEl.className = 'intro-countdown';
  overlay.style.display = 'flex';
  if (soundEnabled && sfxUrls && sfxUrls.intro_url) {
    playAudioElement('introAudio');
  }

  // Hold on the team names + VS for a beat before the countdown starts,
  // then step through 3, 2, 1 — each number gets its own punch-in pulse
  // — before the overlay finally clears and the battle is revealed.
  // Bumped from 2200ms — the intro whoosh needs room to actually finish
  // before the first tick fires, otherwise the tick (short, likely
  // quieter) risks getting masked by the still-playing intro sound's
  // tail end.
  const holdMs = 3200;
  const stepMs = 900;
  [3, 2, 1].forEach((n, i) => {
    setTimeout(() => {
      countdownEl.textContent = n;
      // Removing then re-adding the class in the next frame restarts the
      // CSS animation each time — just re-setting the same class name
      // wouldn't replay an animation that already finished.
      countdownEl.classList.remove('pulse');
      void countdownEl.offsetWidth;
      countdownEl.classList.add('pulse');
      if (soundEnabled && sfxUrls && sfxUrls.countdown_tick_url) {
        playAudioElement('tickAudio');
      }
    }, holdMs + i * stepMs);
  });

  setTimeout(() => {
    overlay.style.display = 'none';
    if (soundEnabled && sfxUrls && sfxUrls.bell_url) {
      playAudioElement('bellAudio');
    }
    // Side A's turn timer starts right here, not the moment the battle
    // went active - this is when their input box actually appears, so
    // this is when their 60 seconds should actually begin. Side B's own
    // page runs this same intro but has nothing to start (it isn't
    // their turn), so this is scoped to mySide === 'a' only. If this
    // call somehow fails, the existing "Respond Now" gate (shown
    // whenever turn_started_at is null) is still there as a manual
    // fallback rather than leaving side A stuck with no way forward.
    if (getMySide() === 'a') {
      fetch(`/api/battles/${challengeCode}/start-turn`, {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({side: 'a'})
      })
        .then(r => r.json())
        .then(data => {
          if (!data.error) {
            lastActionSignature = null;
            render(data);
          }
        })
        .catch(() => {});
    }
  }, holdMs + 3 * stepMs);
}

function playRoundCountdown(roundNumber) {
  // Same overlay, sounds and 3-2-1 rhythm as the battle intro, but
  // announcing "ROUND N" instead of the team-vs-team reveal. Fires on
  // BOTH players' screens (it is driven by round_number ticking up,
  // which both sides see from their own poll), so the two of them start
  // each round in sync rather than one being able to type early.
  const overlay = document.getElementById('introOverlay');
  const countdownEl = document.getElementById('introCountdown');
  const introTeamAEl = document.getElementById('introTeamA');
  const introTeamBEl = document.getElementById('introTeamB');
  const vsEl = document.querySelector('.intro-vs');

  introTeamAEl.textContent = `ROUND ${roundNumber}`;
  introTeamAEl.style.color = '';
  introTeamBEl.textContent = '';
  if (vsEl) vsEl.style.display = 'none';
  countdownEl.textContent = '';
  countdownEl.className = 'intro-countdown';
  overlay.style.display = 'flex';

  if (soundEnabled && sfxUrls && sfxUrls.intro_url) {
    playAudioElement('introAudio');
  }

  // Shorter hold than the battle intro - there are no team names to read
  // here, just the round number - but the same 900ms cadence per tick.
  const holdMs = 1200;
  const stepMs = 900;
  [3, 2, 1].forEach((n, i) => {
    setTimeout(() => {
      countdownEl.textContent = n;
      countdownEl.classList.remove('pulse');
      void countdownEl.offsetWidth;
      countdownEl.classList.add('pulse');
      if (soundEnabled && sfxUrls && sfxUrls.countdown_tick_url) {
        playAudioElement('tickAudio');
      }
    }, holdMs + i * stepMs);
  });

  setTimeout(() => {
    overlay.style.display = 'none';
    // Restore the overlay for any later use (e.g. a rematch replaying
    // the full team-vs-team intro) - it is a shared element.
    if (vsEl) vsEl.style.display = '';
    ringBell();
    // Side A's clock starts here, not when the round advanced
    // server-side, so this countdown doesn't eat into their 60 seconds.
    // Only side A's own browser calls it; the backend rejects the other
    // side anyway. If it fails, the existing "Respond Now" gate (shown
    // whenever turn_started_at is null) remains as a manual fallback.
    if (getMySide() === 'a') {
      fetch(`/api/battles/${challengeCode}/start-turn`, {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({side: 'a'})
      })
        .then(r => r.json())
        .then(data => {
          if (!data.error) {
            lastActionSignature = null;
            render(data);
          }
        })
        .catch(() => {});
    }
  }, holdMs + 3 * stepMs);
}

async function loadBattle() {
  try {
    const resp = await fetch(`/api/battles/${challengeCode}?_=${Date.now()}`, {cache: 'no-store'});
    if (resp.status === 404) {
      document.getElementById('matchupHeader').innerHTML = '<p class="matchup-teams">Battle not found</p>';
      document.getElementById('content').innerHTML = '';
      return;
    }
    if (!resp.ok) throw new Error(`unexpected status ${resp.status}`);
    const battle = await resp.json();
    render(battle);
  } catch (err) {
    // A transient network error (much more common on mobile than
    // desktop) should never permanently end polling — that was the
    // actual cause of needing a hard refresh to recover. Just skip this
    // one cycle silently; the next scheduled poll will try again.
    console.warn('loadBattle poll failed, will retry:', err);
  }
}

let confettiTriggered = false;

function triggerConfetti() {
  if (confettiTriggered) return;
  confettiTriggered = true;
  const container = document.getElementById('confettiContainer');
  const colors = ['#FFD400', '#E8142C', '#F5F5F3'];
  for (let i = 0; i < 60; i++) {
    const piece = document.createElement('div');
    piece.className = 'confetti-piece';
    piece.style.left = `${Math.random() * 100}%`;
    piece.style.background = colors[Math.floor(Math.random() * colors.length)];
    piece.style.animationDuration = `${1.8 + Math.random() * 1.2}s`;
    piece.style.animationDelay = `${Math.random() * 0.4}s`;
    if (Math.random() > 0.5) piece.style.borderRadius = '50%';
    container.appendChild(piece);
    setTimeout(() => piece.remove(), 3500);
  }
}

function buildFinalScorecard(battle, mySide) {
  const results = battle.round_results || [];
  const winsA = results.filter(r => r.winner === 'a').length;
  const winsB = results.filter(r => r.winner === 'b').length;

  const scoresA = results.map(r => r.score_a).filter(s => s !== null && s !== undefined);
  const scoresB = results.map(r => r.score_b).filter(s => s !== null && s !== undefined);
  const avgA = scoresA.length ? (scoresA.reduce((sum, s) => sum + s, 0) / scoresA.length).toFixed(1) : null;
  const avgB = scoresB.length ? (scoresB.reduce((sum, s) => sum + s, 0) / scoresB.length).toFixed(1) : null;

  // A real judge's scorecard puts the per-round numbers on the card.
  // Those scores already existed in the data and were being thrown away -
  // the old chips only showed "R1", "R2". Honours max_rounds too, so a
  // 10-round battle shows all ten instead of silently stopping at five.
  const totalRounds = battle.max_rounds || 5;
  let headCells = '<div class="jsc-cell jsc-corner"></div>';
  let rowACells = '';
  let rowBCells = '';
  for (let round = 1; round <= totalRounds; round++) {
    const r = results.find(x => x.round === round);
    headCells += `<div class="jsc-cell jsc-head">R${round}</div>`;
    const wonA = r && r.winner === 'a';
    const wonB = r && r.winner === 'b';
    const sa = r && r.score_a !== null && r.score_a !== undefined ? r.score_a : '&ndash;';
    const sb = r && r.score_b !== null && r.score_b !== undefined ? r.score_b : '&ndash;';
    rowACells += `<div class="jsc-cell jsc-score${wonA ? ' won-a' : ''}">${sa}</div>`;
    rowBCells += `<div class="jsc-cell jsc-score${wonB ? ' won-b' : ''}">${sb}</div>`;
  }
  // Columns: fighter label, one per round, then the average.
  const gridCols = `minmax(58px,auto) repeat(${totalRounds}, minmax(30px,50px)) minmax(46px,auto)`;

  const isWinner = battle.overall_winner && battle.overall_winner !== 'tie' && mySide === battle.overall_winner;
  if (isWinner) triggerConfetti();
  const isLoser = battle.overall_winner && battle.overall_winner !== 'tie' && mySide !== battle.overall_winner;
  const recapText = battle.overall_winner === 'tie' ? battle.recap_winner_text
    : isWinner ? battle.recap_winner_text
    : battle.recap_loser_text;
  const recapClass = battle.overall_winner === 'tie' ? 'tie' : isWinner ? 'win' : 'loss';
  const recapLabel = battle.overall_winner === 'tie' ? "It's a tie" : isWinner ? 'You won the battle' : 'You lost the battle';

  // Recap generation is a real AI call running in the background — this
  // covers the brief window before overall_winner has actually arrived.
  const stampText = battle.overall_winner === 'tie' ? 'Draw' : isWinner ? 'You won' : 'You lost';
  const recapBlock = !battle.overall_winner
    ? '<p class="waiting-note" style="margin-top:16px;">Writing your recap...</p>'
    : `
      <div class="jsc-verdict">
        <span class="verdict-stamp ${recapClass}">${stampText}</span>
      </div>
      <p class="jsc-recap">${escapeHtml(recapText || '')}</p>
    `;

  // Only for whoever lost — a nudge toward Smack Lab (free 1-on-1 AI
  // coaching) as the natural next step after a rough outing.
  const smackLabBlock = isLoser ? `
    <div class="smack-lab-nudge">
      <p>Might be time to work on your bars. Smack Lab's got a coach ready — go sharpen up and come back when you're actually prepared.</p>
      <a href="/smack-lab" class="smack-lab-link">Train at Smack Lab &rarr;</a>
    </div>
  ` : '';

  const colorA = readableColor(battle.team_a_color, 'var(--gold)');
  const colorB = readableColor(battle.team_b_color, 'var(--flare)');

  return `
    <div class="card final-scorecard">
      <div class="jsc-header">
        <span class="jsc-eyebrow">Official scorecard</span>
        <span class="jsc-bout">Bout ${escapeHtml(battle.challenge_code)}</span>
      </div>

      <div class="jsc-bout-line">
        <div class="jsc-fighter">
          <p class="jsc-fighter-name side-a">${escapeHtml(battle.display_name_a)}</p>
          <p class="jsc-fighter-team" style="color:${colorA};">${escapeHtml(battle.team_a)}</p>
        </div>
        <div class="jsc-tally">
          <span class="side-a">${winsA}</span><span class="jsc-tally-dash">–</span><span class="side-b">${winsB}</span>
          <p class="jsc-tally-label">Rounds</p>
        </div>
        <div class="jsc-fighter jsc-fighter-right">
          <p class="jsc-fighter-name side-b">${escapeHtml(battle.display_name_b)}</p>
          <p class="jsc-fighter-team" style="color:${colorB};">${escapeHtml(battle.team_b)}</p>
        </div>
      </div>

      <div class="jsc-grid-scroll">
        <div class="jsc-grid" style="grid-template-columns:${gridCols};">
          ${headCells}<div class="jsc-cell jsc-head jsc-head-avg">Avg</div>
          <div class="jsc-cell jsc-rowlabel side-a">${escapeHtml(battle.display_name_a)}</div>
          ${rowACells}<div class="jsc-cell jsc-avg side-a">${avgA !== null ? avgA : '&ndash;'}</div>
          <div class="jsc-cell jsc-rowlabel side-b">${escapeHtml(battle.display_name_b)}</div>
          ${rowBCells}<div class="jsc-cell jsc-avg side-b">${avgB !== null ? avgB : '&ndash;'}</div>
        </div>
      </div>
      <p class="jsc-legend">Highlighted cell takes the round</p>

      ${recapBlock}
      ${smackLabBlock}
    </div>
  `;
}

function buildMomentumBar(battle) {
  const results = battle.round_results || [];
  if (results.length === 0) return ''; // nothing decided yet, a bar would just be meaningless
  const winsA = results.filter(r => r.winner === 'a').length;
  const winsB = results.filter(r => r.winner === 'b').length;
  const total = winsA + winsB;
  // Ties don't push the bar either direction — split the remainder
  // evenly down the middle so the bar still reflects "how many rounds
  // are actually decided" without pretending a tie favors someone.
  const pctA = total > 0 ? (winsA / total) * 100 : 50;
  return `
    <div class="momentum-bar">
      <div class="momentum-fill-a" style="width:${pctA}%;"></div>
      <div class="momentum-fill-b" style="width:${100 - pctA}%;"></div>
    </div>
  `;
}

function buildLedRow(battle) {
  const results = {};
  (battle.round_results || []).forEach(r => { results[r.round] = r.winner; });

  let leds = '';
  for (let round = 1; round <= battle.max_rounds; round++) {
    if (results[round]) {
      const winner = results[round]; // "a", "b", or "tie"
      leds += `<div class="led ${winner === 'tie' ? 'tie' : 'side-' + winner}"></div>`;
    } else if (battle.status === 'active' && round === battle.round_number) {
      leds += `<div class="led active"></div>`;
    } else {
      leds += `<div class="led"></div>`;
    }
  }
  return leds;
}

function render(battle) {
  const header = document.getElementById('matchupHeader');
  const content = document.getElementById('content');
  const lineHistory = document.getElementById('lineHistory');
  const actionArea = document.getElementById('actionArea');
  const mySide = getMySide();

  // Always sync against the freshly-fetched status, every render — not
  // gated behind "did status change since last time," since that check
  // relies on lastKnownStatus staying accurate, and a missed or delayed
  // poll (more common on mobile) could leave it stale, causing the
  // wrong loop (e.g. waiting-room music) to keep playing into moments
  // it shouldn't, like reading a round's critique. updateBackgroundMusic
  // itself is already safe to call repeatedly with the same status —
  // it only actually starts/stops audio when something needs to change.
  lastKnownStatus = battle.status;
  updateBackgroundMusic(battle.status);

  document.documentElement.classList.toggle('battle-complete', battle.status === 'complete');
  document.body.classList.toggle('battle-complete', battle.status === 'complete');
  document.body.classList.toggle('waiting-room', battle.status === 'waiting');
  document.documentElement.classList.toggle('waiting-room', battle.status === 'waiting');
  document.documentElement.classList.toggle('awaiting-round', battle.status === 'active' && battle.awaiting_next_round);
  document.body.classList.toggle('awaiting-round', battle.status === 'active' && battle.awaiting_next_round);

  // Updated directly here, every render, completely independent of the
  // action-area signature below — that signature deliberately excludes
  // typing status now, since including it was wiping the ACTIVE
  // TYPIST'S OWN textarea every time their typing status flickered
  // between true/false (their own pings reflected back to their own
  // client via polling, same as anyone else's). This targeted update
  // only ever touches the small indicator slot, never anything the
  // opponent might be actively typing into.
  const typingSlot = document.getElementById('typingIndicatorSlot');
  if (typingSlot && battle.status === 'active' && !battle.awaiting_next_round) {
    const opponentIsTyping = battle.current_turn === 'a' ? battle.is_typing_a : battle.is_typing_b;
    const opponentName = battle.current_turn === 'a' ? battle.display_name_a : battle.display_name_b;
    typingSlot.innerHTML = opponentIsTyping
      ? `<p class="typing-indicator">${escapeHtml(opponentName)} is typing<span class="typing-dots"><span></span><span></span><span></span></span></p>`
      : '';
  }

  if (battle.status === 'waiting') {
    content.innerHTML = '';
    lineHistory.innerHTML = '';
    const waitingHeaderText = mySide === 'a' ? '<span class="waiting-pulse">Waiting for opponent</span>' : 'Waiting for you to accept';
    header.innerHTML = `<p class="matchup-teams"><span class="side-a" style="color:${readableColor(battle.team_a_color, 'var(--gold)')};">${escapeHtml(battle.team_a)}</span></p><p class="round-indicator">${waitingHeaderText}</p><p class="viewer-count">👁 ${battle.viewer_count} watching</p>`;

    const waitingSignature = `waiting|${mySide}`;
    if (lastActionSignature !== waitingSignature) {
      lastActionSignature = waitingSignature;

      if (mySide === 'a') {
        actionArea.innerHTML = `
          <div class="card waiting-photo-card">
            <img class="smacky-waiting-img" src="/static/img/battle-waiting-smacky.png" alt="Smacky" loading="lazy">
            <p class="waiting-note">Share your battle link with whoever you're calling out. This page will update once they join.</p>
            <p class="intensity-badge">Intensity: <span>${escapeHtml(INTENSITY_LABELS[battle.intensity] || 'Savage')}</span></p>
          </div>
        `;
        showHypePopup();
      } else {
        const showAgeGate = battle.intensity !== 1;
        actionArea.innerHTML = `
          <div class="card waiting-photo-card">
            <img class="smacky-waiting-img" src="/static/img/battle-waiting-smacky.png" alt="Smacky" loading="lazy">
            <p class="waiting-note" style="margin-bottom:14px;">${escapeHtml(battle.display_name_a)}, a <span style="color:${readableColor(battle.team_a_color, 'var(--gold)')};">${escapeHtml(battle.team_a)}</span> fan, is calling YOU out. Step up?</p>
            <p class="intensity-badge" style="margin-bottom:14px;">This battle is set to <span>${escapeHtml(INTENSITY_LABELS[battle.intensity] || 'Savage')}</span> intensity.</p>
            <label for="teamBInput">Your team</label>
            <input id="teamBInput" type="text" placeholder="ex. Eagles" data-team-search data-team-league="${escapeHtml(LEAGUE_TEAM_KEYS[battle.league] || '')}">
            <label for="nameBInput">Your name</label>
            <input id="nameBInput" type="text" placeholder="ex. RivalReady" maxlength="40">
            ${showAgeGate ? `
            <div id="ageGate" style="margin-bottom:14px; padding:12px 14px; background:var(--ink); border:1px solid var(--line-strong); border-radius:6px;">
              <label style="display:flex; align-items:flex-start; gap:10px; cursor:pointer; font-size:13px; color:var(--chalk); margin-bottom:0;">
                <input type="checkbox" id="ageConfirmCheck" style="width:24px; height:24px; flex-shrink:0; margin-top:0; cursor:pointer; accent-color:var(--flare);">
                <span>This intensity level includes profanity. I confirm I am 18 years of age or older.</span>
              </label>
            </div>` : ''}
            <div id="actionError" role="alert"></div>
            <button id="joinBtn" class="btn btn-flare">Accept the challenge</button>
          </div>
        `;
        if (window.smkAttachTeamSearch) window.smkAttachTeamSearch();
        document.getElementById('joinBtn').addEventListener('click', async () => {
          const btn = document.getElementById('joinBtn');
          const teamB = document.getElementById('teamBInput').value.trim();
          const nameB = document.getElementById('nameBInput').value.trim();
          const errorEl = document.getElementById('actionError');
          errorEl.style.display = 'none';
          if (!teamB) {
            errorEl.textContent = 'Enter your team first.';
            smkInvalid(document.getElementById('teamBInput'));
            errorEl.style.display = 'block';
            return;
          }
          if (document.getElementById('teamBInput').dataset.smkSelected !== 'true') {
            errorEl.textContent = 'Select your team from the dropdown list — typing it isn\'t enough.';
            smkInvalid(document.getElementById('teamBInput'));
            errorEl.style.display = 'block';
            return;
          }
          if (showAgeGate && !document.getElementById('ageConfirmCheck').checked) {
            errorEl.textContent = 'Confirm you are 18 or older to join this battle.';
            errorEl.style.display = 'block';
            return;
          }
          // Whoever creates a battle gets the hype popup as their
          // deliberate gesture to unlock one-shot sounds — whoever
          // joins via the link never sees that popup at all, so this
          // click is their equivalent moment to do the same unlock.
          unlockOneShotSounds();
          btn.disabled = true;
          const resp = await fetch(`/api/battles/${challengeCode}/join`, {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({team_b: teamB, display_name_b: nameB})
          });
          const data = await resp.json();
          if (data.error) {
            errorEl.textContent = data.error;
            errorEl.style.display = 'block';
            btn.disabled = false;
          } else {
            setMySide('b');
            lastActionSignature = null;
            render(data);
          }
        });
      }
    }
    return;
  }

  // Fires once per page view, the first moment the battle is seen as
  // active or complete (covers both "I just joined" and "I refreshed
  // into an already-active battle").
  if (!introShown) {
    introShown = true;
    knownRoundNumber = battle.round_number;
    lastRoundResultsCount = (battle.round_results || []).length;
    lastLineCount = battle.lines.length;
    // Only play the full countdown overlay for round 1's actual start —
    // a refresh mid-battle (round 2+) was incorrectly replaying the
    // whole 3-2-1 sequence every time, since introShown is just an
    // in-memory flag that resets on every fresh page load. For any
    // later round, skip straight to showing the current state.
    if (battle.round_number === 1) {
      playIntro(battle.team_a, battle.team_b, battle.team_a_color, battle.team_b_color);
    }
  }

  // Round 1's bell is handled by playIntro (rings right as the intro
  // countdown finishes). This covers every round after that — the
  // moment round_number ticks up while still active, ring the bell
  // again to mark the new round starting.
  if (knownRoundNumber !== null && battle.status === 'active' && battle.round_number > knownRoundNumber) {
    // The bell now rings at the END of the countdown (inside
    // playRoundCountdown) rather than immediately, so it lands on the
    // actual round start instead of ~4s before it.
    playRoundCountdown(battle.round_number);
    // The round can now advance from either side clicking "ready," not
    // just this device's own click — so the critique-reveal loop needs
    // to stop here too, for whoever DIDN'T personally click, not only
    // inside the button's own click handler.
    const critiqueAudio = document.getElementById('critiqueRevealAudio');
    if (critiqueAudio && !critiqueAudio.paused) {
      critiqueAudio.pause();
      critiqueAudio.currentTime = 0;
    }
  }
  knownRoundNumber = battle.round_number;

  // A new round result landed — tell the local viewer whether they won,
  // lost, or tied that round, with the matching cheer/boo sound. Only
  // fires for results that are actually new since the last render, and
  // only once mySide is known (so this doesn't fire for pure spectators
  // watching without having joined either side).
  const results = battle.round_results || [];
  if (results.length > lastRoundResultsCount && mySide) {
    const latest = results[results.length - 1];
    const outcome = latest.winner === 'tie' ? 'tie' : (latest.winner === mySide ? 'win' : 'loss');
    showRoundResultPopup(outcome);
  }
  lastRoundResultsCount = results.length;

  // A new line arrived since the last render — celebrate it with a quick
  // crowd-pop sound, but only once sound has actually been enabled.
  if (soundEnabled && battle.lines.length > lastLineCount) {
    playAudioElement('newLineAudio');
  }
  lastLineCount = battle.lines.length;

  header.innerHTML = `
    <p class="matchup-teams"><span class="side-a" style="color:${readableColor(battle.team_a_color, 'var(--gold)')};">${escapeHtml(battle.team_a)}</span><span class="vs">vs</span><span class="side-b" style="color:${readableColor(battle.team_b_color, 'var(--flare)')};">${escapeHtml(battle.team_b)}</span></p>
    <p class="round-indicator">${battle.status === 'complete' ? 'Battle complete' : `Round ${battle.round_number} of ${battle.max_rounds}`}</p>
    <p class="viewer-count">👁 ${battle.viewer_count} watching</p>
    <div class="intensity-badge-wrap"><p class="intensity-badge">Intensity: <span>${escapeHtml(INTENSITY_LABELS[battle.intensity] || 'Savage')}</span></p></div>
    ${buildMomentumBar(battle)}
    <div class="led-row">${buildLedRow(battle)}</div>
  `;

  // Only this round's lines are shown while the battle is active — the
  // screen clears each round, with the round number labeled clearly
  // above it, rather than accumulating every line from every round on
  // one long page. Once the battle is complete, the chat history is
  // dropped entirely — just the final scorecard, nothing else.
  if (battle.status === 'complete') {
    lineHistory.innerHTML = '';
  } else {
    // EVERY line from EVERY round, not just the current one - the
    // history box is a running transcript of the whole battle that stays
    // scrollable at any point, rather than resetting each round.
    const allLines = battle.lines || [];

    // No card at all until someone has actually said something. It
    // previously rendered a box containing just "Round N" and a "you're
    // up" prompt - both already shown elsewhere (the round number in the
    // page header as "Round N of M", the turn prompt in the action card
    // right below) - so it was a second box duplicating information.
    let historyHtml = '';
    if (allLines.length > 0) {
      historyHtml = '<div class="card chat-history-card">';
      let lastRoundLabelled = null;
      allLines.forEach(l => {
        // Round divider whenever the round changes, so a long scrollback
        // stays readable instead of being one undifferentiated stream.
        if (l.round !== lastRoundLabelled) {
          lastRoundLabelled = l.round;
          historyHtml += `<p class="round-label">Round ${l.round}</p>`;
        }
        const name = l.side === 'a' ? battle.display_name_a : battle.display_name_b;
        const initial = (name || '?').trim().charAt(0).toUpperCase();
        // A timed-out turn is stored as a real line with an empty
        // message (unsafe/missed text is never kept), so render it as an
        // explicit note instead of a blank bubble.
        const messageHtml = l.timed_out
          ? '<p class="line-message" style="opacity:0.6; font-style:italic;">Ran out of time</p>'
          : `<p class="line-message">${escapeHtml(l.message)}</p>`;
        historyHtml += `
          <div class="line-row side-${l.side}">
            <div class="fighter-avatar side-${l.side}">${escapeHtml(initial)}</div>
            <div class="line side-${l.side}">
              <p class="line-name">${escapeHtml(name)}</p>
              ${messageHtml}
            </div>
          </div>
        `;
      });
      historyHtml += '</div>';
    }

    // Only actually rebuild the DOM when the line content genuinely
    // changed — rebuilding on every single poll (even when nothing was
    // new) was destroying and recreating every message element each
    // time, which replayed each one's entrance animation constantly
    // instead of just once when it was genuinely new.
    const historySignature = `${allLines.length}`;
    if (lastLineHistorySignature !== historySignature) {
      lastLineHistorySignature = historySignature;
      lineHistory.innerHTML = historyHtml;
      // Jump to the newest roast at the bottom. This only runs when the
      // content genuinely changed, so it never fights someone who has
      // deliberately scrolled up to re-read earlier rounds during an
      // idle poll - it only re-anchors when something new actually lands.
      const historyCard = lineHistory.querySelector('.chat-history-card');
      if (historyCard) historyCard.scrollTop = historyCard.scrollHeight;
    }
  }

  // The action area (turn input, waiting note, or voting) only gets
  // rebuilt when something it actually depends on changes — this is
  // what stops the textarea from losing focus and the buttons from
  // getting destroyed mid-click on every 4-second poll. A signature
  // string captures everything that would legitimately require a
  // rebuild; if it's unchanged since last render, the DOM (and whatever
  // the user is doing in it right now) is left completely alone.
  // While judging is pending with no result yet, fold in a coarse
  // time-bucket so the action area re-checks periodically instead of
  // getting stuck skipping its own rebuild forever — otherwise the
  // 20-second "try again" fallback below would never actually get a
  // chance to render, since none of the underlying battle fields change
  // while genuinely stuck waiting.
  const isPendingJudgment = (battle.status === 'active' && battle.awaiting_next_round
    && !(battle.round_results || []).some(r => r.round === battle.round_number))
    || (battle.status === 'complete' && mySide && finalConfirmClicked && !battle.overall_winner);
  const timeBucket = isPendingJudgment ? Math.floor(Date.now() / 5000) : 0;

  const actionSignature = `${battle.status}|${battle.current_turn}|${mySide}|${battle.round_number}|${battle.vote_count_a}|${battle.awaiting_next_round}|${battle.ready_a}|${battle.ready_b}|${(battle.round_results || []).length}|${battle.overall_winner}|${battle.rematch_requested_a}|${battle.rematch_requested_b}|${timeBucket}|${myScorecardUnlocked}|${finalConfirmClicked}|${!!battle.turn_started_at}|${battle.side_a_left}|${battle.side_b_left}`;
  if (lastActionSignature === actionSignature) {
    return;
  }
  lastActionSignature = actionSignature;

  clearTurnTimer();
  let actionHtml = '';

  // Opponent-left notification takes priority over every other
  // action-area state - if it fires, nothing else in this function
  // matters, since the battle is effectively over the moment one side
  // is gone. Only relevant to the two actual participants, not
  // spectators (mySide is null for them), since a spectator watching
  // doesn't need to be told to go start their own battle.
  const opponentLeft = (mySide === 'a' && battle.side_b_left) || (mySide === 'b' && battle.side_a_left);
  if (opponentLeft) {
    const opponentName = mySide === 'a' ? battle.display_name_b : battle.display_name_a;
    content.innerHTML = '';
    lineHistory.innerHTML = '';
    actionArea.innerHTML = `
      <div class="card">
        <p class="waiting-note" style="margin-bottom:14px;">${escapeHtml(opponentName)} left the battle.</p>
        <a href="/smack-battle" class="btn btn-flare" style="display:block; text-align:center; text-decoration:none;">Start New Smack Battle</a>
      </div>
    `;
    return;
  }

  if (battle.status === 'active' && battle.awaiting_next_round) {
    const latestResult = (battle.round_results || []).find(r => r.round === battle.round_number);

    if (!latestResult) {
      // Judging happens in the background now (so submitting a line
      // responds instantly) — this is the brief window before that
      // finishes. Keep polling picks it up within ~1.5s. Track how long
      // this has been pending — if it drags on well past a normal AI
      // call (20s+), something's actually gone wrong server-side rather
      // than just being mid-flight, so offer a way out instead of
      // leaving the person stuck looking at this forever with no
      // recourse but abandoning the battle.
      if (judgingStartedAt === null) judgingStartedAt = Date.now();
      const stuckTooLong = Date.now() - judgingStartedAt > 20000;

      if (stuckTooLong) {
        stopJudgingBeep();
      } else {
        startJudgingBeep();
      }

      actionHtml = stuckTooLong ? `
        <div class="card">
          <p class="waiting-note" style="margin-bottom:12px;">This is taking longer than it should.</p>
          <button id="retryJudgingBtn" class="btn" style="background:transparent; border:1px solid var(--line-strong); color:var(--chalk);">Try again</button>
        </div>
      ` : `
        <div class="card">
          <p class="judging-note">Judging this round...</p>
        </div>
      `;
    } else {
      judgingStartedAt = null;
      stopJudgingBeep();
      const myCritique = mySide === 'a' ? latestResult.critique_a : latestResult.critique_b;
      const myScore = mySide === 'a' ? latestResult.score_a : latestResult.score_b;
      const outcome = latestResult.winner === 'tie' ? 'tie' : (latestResult.winner === mySide ? 'win' : 'loss');
      const isFinalRound = battle.round_number >= battle.max_rounds;
      const myReady = mySide === 'a' ? battle.ready_a : battle.ready_b;
      const opponentName = mySide === 'a' ? battle.display_name_b : battle.display_name_a;

      actionHtml = `
        <div class="card">
          <div class="critique-box ${outcome}">
            <p class="critique-label">${outcome === 'win' ? 'You won this round' : outcome === 'loss' ? 'You lost this round' : 'Round tied'}${myScore !== null && myScore !== undefined ? ` — ${myScore}/10` : ''}</p>
            <p>${escapeHtml(myCritique)}</p>
          </div>
          ${myReady
            ? `<p class="waiting-note">Waiting for ${escapeHtml(opponentName)} to be ready too...</p>`
            : `<button id="readyBtn" class="btn btn-flare">${isFinalRound ? 'Take It To The Judges' : 'Start next round'}</button>`
          }
        </div>
      `;
    }
  } else if (battle.status === 'active') {
    if (mySide === battle.current_turn) {
      if (!battle.turn_started_at) {
        // Side just received the opponent's line - give them
        // unlimited time to actually read it before their own
        // 60-second clock starts. Nothing covers the line above
        // until they explicitly say they're ready.
        actionHtml = `
          <div class="card">
            <p class="waiting-note" style="margin-bottom:14px;">Take your time — read what they said, then respond when you're ready.</p>
            <button id="respondNowBtn" class="btn btn-flare">Respond Now</button>
          </div>
        `;
      } else {
        actionHtml = `
          <div class="card">
            <p class="waiting-note" style="margin-bottom:10px;">Your turn — round ${battle.round_number}</p>
            <p class="turn-timer" id="turnTimer">60</p>
            <textarea id="lineInput" placeholder="Say what you came to say..." maxlength="500"></textarea>
            <div id="actionError" role="alert"></div>
            <button id="submitLineBtn" class="btn btn-flare">Send it</button>
          </div>
        `;
      }
    } else {
      const waitingOn = battle.current_turn === 'a' ? battle.display_name_a : battle.display_name_b;
      const results = battle.round_results || [];
      const latestForMe = results.length > 0 ? results[results.length - 1] : null;
      const myCoachMessage = latestForMe ? (mySide === 'a' ? latestForMe.coach_message_a : latestForMe.coach_message_b) : '';

      actionHtml = `
        <div class="card">
          <p class="waiting-note">Waiting for ${escapeHtml(waitingOn)} to respond...</p>
          <div id="typingIndicatorSlot"></div>
          ${myCoachMessage ? `<p class="coach-notes-label">Coach's Notes</p><p class="coach-message">${escapeHtml(myCoachMessage)}</p>` : ''}
        </div>
      `;
    }
  } else if (battle.status === 'complete') {
    // Both sides have requested a rematch and the new battle already
    // exists — send both people there automatically.
    if (battle.rematch_challenge_code) {
      if (mySide) localStorage.setItem(`battle_side_${battle.rematch_challenge_code}`, mySide);
      window.location.href = `/battle/${battle.rematch_challenge_code}`;
      return;
    }

    // The backend finalizes the battle the instant EITHER side clicks
    // "Take It To The Judges" — that's still correct, both people's
    // data needs to be ready right away. But revealing the SCORECARD
    // itself is a more personal, deliberate moment than just advancing
    // a round, so it shouldn't be forced on someone just because their
    // opponent happened to click first. A real participant (not a
    // spectator with no side) has to see their own round 5 critique and
    // click through it themselves — independent of battle.status, which
    // may already say "complete" behind the scenes.
    if (mySide && !myScorecardUnlocked) {
      if (!finalConfirmClicked) {
        const round5Result = (battle.round_results || []).find(r => r.round === 5);
        if (!round5Result) {
          // Round 5 hasn't actually finished judging yet on the backend —
          // same "Judging this round..." holding state as any other
          // round, with the same stuck-timeout protection.
          if (judgingStartedAt === null) judgingStartedAt = Date.now();
          const stuckTooLong = Date.now() - judgingStartedAt > 20000;
          if (stuckTooLong) {
            stopJudgingBeep();
            actionHtml = `
              <div class="card">
                <p class="waiting-note" style="margin-bottom:12px;">This is taking longer than it should.</p>
                <button id="retryJudgingBtn" class="btn" style="background:transparent; border:1px solid var(--line-strong); color:var(--chalk);">Try again</button>
              </div>
            `;
          } else {
            startJudgingBeep();
            actionHtml = `<div class="card"><p class="judging-note">Judging this round...</p></div>`;
          }
        } else {
          judgingStartedAt = null;
          stopJudgingBeep();
          const myCritique = mySide === 'a' ? round5Result.critique_a : round5Result.critique_b;
          const myScore = mySide === 'a' ? round5Result.score_a : round5Result.score_b;
          const outcome = round5Result.winner === 'tie' ? 'tie' : (round5Result.winner === mySide ? 'win' : 'loss');
          actionHtml = `
            <div class="card">
              <div class="critique-box ${outcome}">
                <p class="critique-label">${outcome === 'win' ? 'You won this round' : outcome === 'loss' ? 'You lost this round' : 'Round tied'}${myScore !== null && myScore !== undefined ? ` — ${myScore}/10` : ''}</p>
                <p>${escapeHtml(myCritique)}</p>
              </div>
              <button id="unlockScorecardBtn" class="btn btn-flare">Take It To The Judges</button>
            </div>
          `;
        }
      } else {
        // They've already clicked through — now hold on a clean loading
        // state until the final recap has genuinely finished generating
        // in the background, rather than dumping them into a scorecard
        // that's still showing "Writing your recap..." internally. Same
        // stuck-timeout/retry protection as everywhere else.
        if (recapWaitStartedAt === null) recapWaitStartedAt = Date.now();
        if (battle.overall_winner) {
          // Ready — reveal the fully-complete scorecard now, all at once.
          recapWaitStartedAt = null;
          myScorecardUnlocked = true;
          lastActionSignature = null;
          render(battle);
          return;
        }
        const recapStuckTooLong = Date.now() - recapWaitStartedAt > 20000;
        if (recapStuckTooLong) {
          actionHtml = `
            <div class="card">
              <p class="waiting-note" style="margin-bottom:12px;">This is taking longer than it should.</p>
              <button id="retryJudgingBtn" class="btn" style="background:transparent; border:1px solid var(--line-strong); color:var(--chalk);">Try again</button>
            </div>
          `;
        } else {
          actionHtml = `<div class="card"><p class="judging-note">Finishing up your recap...</p></div>`;
        }
      }
      actionArea.innerHTML = actionHtml;
      const unlockBtn = document.getElementById('unlockScorecardBtn');
      if (unlockBtn) {
        unlockBtn.addEventListener('click', () => {
          ringBell();
          finalConfirmClicked = true;
          lastActionSignature = null;
          render(battle);
        });
      }
      const localRetryBtn = document.getElementById('retryJudgingBtn');
      if (localRetryBtn) {
        localRetryBtn.addEventListener('click', () => window.location.reload());
      }
      return;
    }

    stopJudgingBeep();
    // Same gap as the judging beep had — the critique-reveal loop's
    // explicit stop only lived in the readyBtn click handler and the
    // active-status round-transition check, both of which miss the
    // round 5 -> complete transition specifically (status leaves
    // 'active' entirely at that point), so whoever DIDN'T click "Take
    // It To The Judges" never got the stop command. Safety net here.
    const critiqueAudioOnComplete = document.getElementById('critiqueRevealAudio');
    if (critiqueAudioOnComplete && !critiqueAudioOnComplete.paused) {
      critiqueAudioOnComplete.pause();
      critiqueAudioOnComplete.currentTime = 0;
    }
    actionHtml = buildFinalScorecard(battle, mySide);

    const iRequestedRematch = mySide === 'a' ? battle.rematch_requested_a : battle.rematch_requested_b;
    const opponentRequestedRematch = mySide === 'a' ? battle.rematch_requested_b : battle.rematch_requested_a;
    let rematchSectionHtml;
    if (iRequestedRematch) {
      rematchSectionHtml = '<p class="waiting-note">Waiting for your opponent to accept the rematch...</p>';
    } else if (opponentRequestedRematch) {
      rematchSectionHtml = '<button id="rematchBtn" class="btn btn-flare">Accept Rematch</button>';
    } else {
      rematchSectionHtml = '<button id="rematchBtn" class="btn btn-flare">Rematch</button>';
    }
    actionHtml += `
      <div class="card">
        ${rematchSectionHtml}
        <a href="/smack-battle" class="btn" style="display:block; text-align:center; margin-top:10px; background:transparent; border:1px solid var(--line-strong); color:var(--chalk); text-decoration:none;">Start a New Battle</a>
      </div>
    `;
  }

  actionArea.innerHTML = actionHtml;

  const retryJudgingBtn = document.getElementById('retryJudgingBtn');
  if (retryJudgingBtn) {
    retryJudgingBtn.addEventListener('click', () => window.location.reload());
  }

  if (battle.status === 'active' && battle.awaiting_next_round) {
    const readyBtn = document.getElementById('readyBtn');
    if (readyBtn) {
      readyBtn.addEventListener('click', async () => {
        // Cut off the critique-reveal track (a real, longer audio file
        // that otherwise just kept playing in the background for its
        // full length even after moving on) before the bell rings —
        // clicking ready should cleanly replace whatever was playing,
        // not layer the bell on top of it.
        const critiqueAudio = document.getElementById('critiqueRevealAudio');
        if (critiqueAudio) {
          critiqueAudio.pause();
          critiqueAudio.currentTime = 0;
        }
        // The clicker hears the bell the instant they click, regardless
        // of whether the other side has clicked yet.
        ringBell();
        readyBtn.disabled = true;
        readyBtn.textContent = 'Starting...';
        const resp = await fetch(`/api/battles/${challengeCode}/ready`, {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({side: mySide})
        });
        const data = await resp.json();
        if (!data.error) {
          // Whoever personally clicked this already made their own
          // deliberate choice to move forward — they shouldn't have to
          // click a second time to confirm it. But if this was round 5
          // finishing, don't jump straight to "unlocked" — the final
          // recap is still generating in the background at this exact
          // moment, so route through the same finalConfirmClicked gate
          // that holds on a loading state until it's genuinely ready.
          if (data.status === 'complete') {
            finalConfirmClicked = true;
          }
          lastActionSignature = null;
          render(data);
        }
      });
    }
  }

  if (battle.status === 'active' && mySide === battle.current_turn && !battle.turn_started_at) {
    // "Respond Now" gate state - only this button exists in the DOM
    // right now, not #lineInput/#submitLineBtn.
    const respondBtn = document.getElementById('respondNowBtn');
    if (respondBtn) {
      respondBtn.addEventListener('click', async () => {
        respondBtn.disabled = true;
        respondBtn.textContent = 'Loading...';
        try {
          const resp = await fetch(`/api/battles/${challengeCode}/start-turn`, {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({side: mySide})
          });
          const data = await resp.json();
          if (!data.error) {
            lastActionSignature = null;
            render(data);
          } else {
            respondBtn.disabled = false;
            respondBtn.textContent = 'Respond Now';
          }
        } catch (err) {
          respondBtn.disabled = false;
          respondBtn.textContent = 'Respond Now';
        }
      });
    }
  } else if (battle.status === 'active' && mySide === battle.current_turn) {
    const submitBtn = document.getElementById('submitLineBtn');
    const lineInput = document.getElementById('lineInput');

    // Throttled typing ping — at most once every 2 seconds, not on
    // every keystroke, so the opponent's poll can pick up "still
    // typing" without hammering the server.
    let lastTypingPing = 0;
    lineInput.addEventListener('input', () => {
      const nowMs = Date.now();
      if (nowMs - lastTypingPing < 2000) return;
      lastTypingPing = nowMs;
      fetch(`/api/battles/${challengeCode}/typing`, {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({side: mySide})
      }).catch(() => {});
    });

    async function submitLine(isTimeout) {
      const message = lineInput.value.trim();
      const errorEl = document.getElementById('actionError');
      errorEl.style.display = 'none';
      // A normal manual click with nothing typed does nothing, same as
      // before - but a timeout firing with nothing typed still has to
      // reach the server, so it can be recorded as a missed turn rather
      // than silently doing nothing while the round stays stuck.
      if (!message && !isTimeout) return;
      clearTurnTimer();
      // Disable immediately so a slow connection or an impatient extra
      // click can't fire the request twice.
      submitBtn.disabled = true;
      submitBtn.textContent = 'Sending...';
      try {
        const resp = await fetch(`/api/battles/${challengeCode}/line`, {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({side: mySide, message: message, is_timeout: !!isTimeout})
        });
        const data = await resp.json();
        if (data.error) {
          errorEl.textContent = data.error;
          errorEl.style.display = 'block';
          submitBtn.disabled = false;
          submitBtn.textContent = 'Send it';
        } else {
          lastActionSignature = null;
          render(data);
        }
      } catch (err) {
        errorEl.textContent = "Couldn't send — try again.";
        errorEl.style.display = 'block';
        submitBtn.disabled = false;
        submitBtn.textContent = 'Send it';
      }
    }

    submitBtn.addEventListener('click', () => submitLine(false));
    lineInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        submitLine(false);
      }
    });

    // 60-second per-turn countdown, anchored to the server's
    // turn_started_at rather than a purely client-side count, so it's
    // consistent regardless of when this browser loaded/polled the page.
    // Auto-submits whatever's currently typed (even if empty) the moment
    // it hits zero - the server decides whether that counts as a real
    // line or a missed turn.
    clearTurnTimer();
    const timerEl = document.getElementById('turnTimer');
    function tick() {
      if (!battle.turn_started_at) return;
      const startedAt = new Date(battle.turn_started_at + 'Z').getTime();
      const elapsed = (Date.now() - startedAt) / 1000;
      const remaining = Math.max(0, Math.ceil(60 - elapsed));
      if (timerEl) {
        timerEl.textContent = remaining;
        timerEl.classList.toggle('urgent', remaining <= 10);
      }
      if (remaining <= 0) {
        clearTurnTimer();
        submitLine(true);
      }
    }
    tick();
    turnTimerInterval = setInterval(tick, 250);
  }

  if (battle.status === 'complete') {
    const rematchBtn = document.getElementById('rematchBtn');
    if (rematchBtn) {
      rematchBtn.addEventListener('click', async () => {
        rematchBtn.disabled = true;
        rematchBtn.textContent = 'Waiting for opponent...';
        const resp = await fetch(`/api/battles/${challengeCode}/rematch`, {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({side: mySide})
        });
        const data = await resp.json();
        if (!data.error) {
          lastActionSignature = null;
          render(data);
        }
      });
    }
  }
}

// A self-scheduling loop rather than a raw setInterval — each poll only
// gets scheduled after the previous one actually finishes, which avoids
// overlapping/stacked calls if a single request is ever slow, and tends
// to recover more predictably than setInterval after a mobile browser
// throttles or suspends timers in the background.
let pollTimeoutId = null;
async function pollLoop() {
  try {
    await loadBattle();
  } catch (err) {
    // loadBattle already catches its own errors internally, but this is
    // a final safety net — nothing should ever be able to break the
    // recursive scheduling below and silently end polling for the rest
    // of the session.
    console.warn('pollLoop unexpected error:', err);
  }
  pollTimeoutId = setTimeout(pollLoop, 1500);
}
pollLoop();

// Mobile browsers throttle or pause JS timers when a tab is backgrounded
// (screen lock, switching apps, etc.) — when someone comes back to the
// tab, force an immediate refresh instead of waiting for the next
// regular poll tick, so they catch up right away instead of looking
// stuck on stale state.
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible') {
    if (pollTimeoutId) clearTimeout(pollTimeoutId);
    pollLoop();
  }
});

// Live viewer count - a separate, slower heartbeat loop from the main
// battle-state poll above. Every participant and spectator alike pings
// the same way, so the count naturally includes everyone with the page
// open, not just spectators. 8s is frequent enough that the count feels
// current without hammering the server the way the 1.5s state poll needs to.
let viewerPingTimeoutId = null;
async function viewerPingLoop() {
  try {
    await fetch(`/api/battles/${challengeCode}/viewer-ping`, {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({viewer_id: getViewerId(), side: getMySide()})
    });
  } catch (err) {
    // Same reasoning as loadBattle - a transient failure here shouldn't
    // stop future pings, it just means this one cycle didn't register.
  }
  viewerPingTimeoutId = setTimeout(viewerPingLoop, 8000);
}
viewerPingLoop();

</script>
