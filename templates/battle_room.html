<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Smack Battle — Smackagram</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#0D0D0D;
    --ink-2:#1A1A1A;
    --chalk:#F5F5F3;
    --chalk-dim:#9A9A96;
    --flare:#E8142C;
    --gold:#FFD400;
    --line:rgba(245,245,243,0.10);
    --line-strong:rgba(245,245,243,0.24);
  }
  html, body{height:100%; overflow:hidden;}
  /* Battle complete: the final scorecard can genuinely be taller than
     one screen (score tally + 5 round chips + averages + recap) — unlike
     the active battle view, it's fine to unlock scrolling here rather
     than force everything into a fixed height that would just cut it
     off instead. */
  body.battle-complete, html.battle-complete{overflow:auto; height:auto;}
  body.battle-complete .wrap, html.battle-complete .wrap{height:auto; min-height:calc(100dvh - 76px);}
  *{box-sizing:border-box; margin:0; padding:0;}
  body{
    background-color:var(--ink);
    background-image:linear-gradient(rgba(13,13,13,0.88), rgba(13,13,13,0.88)), url('{{ url_for('static', filename='smack-battle-hero.png') }}');
    background-size:cover;
    background-position:center top;
    background-attachment:fixed;
    background-repeat:no-repeat;
    color:var(--chalk); font-family:'Inter',sans-serif; line-height:1.5; -webkit-font-smoothing:antialiased;
  }
  .wrap{
    max-width:620px; margin:0 auto; padding:0 24px; display:flex; flex-direction:column;
    height:calc(100vh - 76px);
    height:calc(100dvh - 76px);
  }
  #lineHistory{flex:1; overflow-y:auto; min-height:0; padding:4px 0;}
  #actionArea{flex-shrink:0; padding-bottom:16px;}

  nav{display:flex; justify-content:space-between; align-items:center; padding:20px 24px; border-bottom:1px solid var(--line);}
  nav a.back-link{color:var(--chalk-dim); text-decoration:none; font-size:14px;}
  nav a.back-link:hover{color:var(--flare);}

  .matchup{text-align:center; padding:28px 0 16px;}
  .matchup-teams{font-family:'Anton',sans-serif; font-size:24px; text-transform:uppercase; line-height:1.2;}
  .matchup-teams .vs{color:var(--chalk-dim); font-size:16px; margin:0 8px;}
  .matchup-teams .side-a{color:var(--gold);}
  .matchup-teams .side-b{color:var(--flare);}
  .round-indicator{color:var(--chalk-dim); font-size:12px; font-family:'JetBrains Mono',monospace; margin-top:6px; text-transform:uppercase;}

  .led-row{display:flex; justify-content:center; gap:12px; margin-top:16px;}
  .led{
    width:22px; height:22px; border-radius:50%; background:#1a1a1a; border:2px solid var(--line-strong);
    box-shadow:inset 0 0 6px rgba(0,0,0,0.6); position:relative;
  }
  .led.side-a{background:var(--gold); border-color:var(--gold); box-shadow:0 0 12px 2px rgba(255,212,0,0.8), inset 0 0 4px rgba(0,0,0,0.3);}
  .led.side-b{background:var(--flare); border-color:var(--flare); box-shadow:0 0 12px 2px rgba(232,20,44,0.8), inset 0 0 4px rgba(0,0,0,0.3);}
  .led.tie{background:linear-gradient(90deg, var(--gold) 50%, var(--flare) 50%); border-color:var(--chalk-dim); box-shadow:0 0 10px 1px rgba(255,255,255,0.4);}
  .led.active{animation:ledBlink 1s ease-in-out infinite;}
  @keyframes ledBlink{
    0%, 100%{background:#1a1a1a; border-color:var(--line-strong); box-shadow:inset 0 0 6px rgba(0,0,0,0.6);}
    50%{background:var(--chalk); border-color:var(--chalk); box-shadow:0 0 14px 3px rgba(245,245,243,0.8);}
  }

  .round-popup{
    position:fixed; top:24px; left:50%; transform:translateX(-50%) translateY(-100px);
    z-index:250; padding:16px 32px; border-radius:8px; font-family:'Anton',sans-serif;
    font-size:22px; text-transform:uppercase; text-align:center; opacity:0; pointer-events:none;
    box-shadow:0 8px 24px rgba(0,0,0,0.5);
  }
  .round-popup.win{background:var(--gold); color:var(--ink); box-shadow:0 8px 24px rgba(255,212,0,0.5);}
  .round-popup.loss{background:var(--flare); color:#fff; box-shadow:0 8px 24px rgba(232,20,44,0.5);}
  .round-popup.tie{background:var(--ink-2); color:var(--chalk); border:2px solid var(--chalk-dim);}
  .round-popup.show{animation:popupSlide 5s ease-in-out forwards;}
  @keyframes popupSlide{
    0%{opacity:0; transform:translateX(-50%) translateY(-40px);}
    10%{opacity:1; transform:translateX(-50%) translateY(0);}
    85%{opacity:1; transform:translateX(-50%) translateY(0);}
    100%{opacity:0; transform:translateX(-50%) translateY(-40px);}
  }

  .card{
    background:var(--ink-2); border:1px solid var(--line-strong); border-radius:8px; padding:24px; margin-bottom:16px;
  }
  label{display:block; font-size:11px; color:var(--chalk-dim); text-transform:uppercase; letter-spacing:0.5px; margin-bottom:6px;}
  input[type=text], textarea{
    width:100%; background:var(--ink); border:1px solid var(--line-strong); color:var(--chalk);
    padding:12px 14px; font-family:'Inter',sans-serif; font-size:14px; border-radius:4px; margin-bottom:14px;
  }
  input:focus, textarea:focus{outline:none; border-color:var(--flare);}
  textarea{resize:vertical; min-height:70px;}

  .btn{
    font-weight:700; font-size:14px; padding:14px 24px; border-radius:4px; border:none; cursor:pointer;
    text-transform:uppercase; letter-spacing:0.5px; width:100%;
  }
  .btn-flare{background:var(--flare); color:#fff; box-shadow:0 0 16px rgba(232,20,44,0.4);}
  .btn-flare:disabled{opacity:0.5; cursor:not-allowed;}
  #actionError{display:none; color:var(--flare); font-size:12px; margin-bottom:10px;}

  .waiting-note{text-align:center; color:var(--chalk-dim); font-size:14px; padding:8px 0;}
  .safety-note{font-size:11px; color:var(--chalk-dim); margin:8px 0 14px; line-height:1.4;}

  .line{padding:12px 16px; border-radius:8px; margin-bottom:10px; max-width:85%;}
  .line.side-a{background:rgba(255,212,0,0.08); border-left:3px solid var(--gold); margin-right:auto;}
  .line.side-b{background:rgba(232,20,44,0.08); border-left:3px solid var(--flare); margin-left:auto; text-align:right;}
  .line-name{font-size:11px; font-weight:700; margin-bottom:4px;}
  .line.side-a .line-name{color:var(--gold);}
  .line.side-b .line-name{color:var(--flare);}
  .line-message{font-size:14px; color:#DCDCD9;}

  .vote-row{display:flex; gap:12px;}
  .vote-btn{
    flex:1; background:var(--ink); border:1px solid var(--line-strong); border-radius:8px; padding:16px;
    text-align:center; cursor:pointer;
  }
  .vote-btn:hover{border-color:var(--gold);}
  .vote-btn .vote-name{font-family:'Anton',sans-serif; font-size:14px; text-transform:uppercase; margin-bottom:6px;}
  .vote-btn .vote-count{font-family:'JetBrains Mono',monospace; font-size:20px; font-weight:700; color:var(--gold);}
  .winner-banner{text-align:center; font-family:'Anton',sans-serif; font-size:18px; text-transform:uppercase; color:var(--gold); margin-bottom:14px;}

  .empty-note{color:var(--chalk-dim); font-size:13px; text-align:center; padding:20px 0;}
  .round-label{
    font-family:'JetBrains Mono',monospace; font-size:11px; color:var(--chalk-dim); text-transform:uppercase;
    letter-spacing:1px; margin-bottom:12px; text-align:center;
  }
  .critique-box{
    background:var(--ink); border:1px solid var(--line-strong); border-radius:6px; padding:14px 16px;
    font-size:13px; color:#DCDCD9; line-height:1.5; margin-bottom:14px;
  }
  .critique-label{font-family:'JetBrains Mono',monospace; font-size:10px; text-transform:uppercase; letter-spacing:0.5px; margin-bottom:6px; font-weight:700;}
  .critique-box.win .critique-label{color:var(--gold);}
  .critique-box.loss .critique-label{color:var(--flare);}
  .critique-box.tie .critique-label{color:var(--chalk-dim);}

  .final-scorecard{text-align:center;}
  .final-scorecard-title{
    font-family:'Anton',sans-serif; font-size:14px; text-transform:uppercase; letter-spacing:2px;
    color:var(--chalk-dim); margin-bottom:12px;
  }
  .final-score-tally{font-family:'Anton',sans-serif; font-size:52px; margin-bottom:18px;}
  .final-score-tally .side-a{color:var(--gold); text-shadow:0 0 20px rgba(255,212,0,0.5);}
  .final-score-tally .side-b{color:var(--flare); text-shadow:0 0 20px rgba(232,20,44,0.5);}
  .final-score-tally .final-score-dash{color:var(--chalk-dim); margin:0 14px; font-size:32px;}
  .final-round-row{display:flex; justify-content:center; gap:10px;}
  .final-round-chip{
    width:44px; height:44px; border-radius:8px; background:#1a1a1a; border:2px solid var(--line-strong);
    display:flex; align-items:center; justify-content:center;
  }
  .final-round-chip.side-a{background:rgba(255,212,0,0.15); border-color:var(--gold); box-shadow:0 0 10px rgba(255,212,0,0.4);}
  .final-round-chip.side-b{background:rgba(232,20,44,0.15); border-color:var(--flare); box-shadow:0 0 10px rgba(232,20,44,0.4);}
  .final-round-chip.tie{background:var(--ink-2); border-color:var(--chalk-dim);}
  .final-round-num{font-family:'JetBrains Mono',monospace; font-size:11px; font-weight:700; color:var(--chalk);}
  .final-avg-row{display:flex; justify-content:center; gap:32px; margin-top:18px;}
  .final-avg-label{font-size:11px; color:var(--chalk-dim); text-transform:uppercase; margin-bottom:4px;}
  .final-avg-value{font-family:'Anton',sans-serif; font-size:20px;}

  .intro-team{
    font-family:'Anton',sans-serif; font-size:44px; text-transform:uppercase; text-align:center;
    opacity:0; transform:scale(0.6);
  }
  .intro-team.side-a{color:var(--gold); text-shadow:0 0 30px rgba(255,212,0,0.6); animation:introSlideLeft 0.6s ease-out forwards;}
  .intro-team.side-b{color:var(--flare); text-shadow:0 0 30px rgba(232,20,44,0.6); animation:introSlideRight 0.6s ease-out 0.15s forwards;}
  .intro-vs{
    font-family:'Anton',sans-serif; font-size:28px; color:var(--chalk-dim); margin:16px 0;
    opacity:0; animation:introFlash 0.4s ease-out 0.5s forwards;
  }
  @keyframes introSlideLeft{
    0%{opacity:0; transform:translateX(-60px) scale(0.6);}
    100%{opacity:1; transform:translateX(0) scale(1);}
  }
  @keyframes introSlideRight{
    0%{opacity:0; transform:translateX(60px) scale(0.6);}
    100%{opacity:1; transform:translateX(0) scale(1);}
  }
  @keyframes introFlash{
    0%{opacity:0; transform:scale(1.8);}
    100%{opacity:1; transform:scale(1);}
  }
  .intro-countdown{
    font-family:'Anton',sans-serif; font-size:80px; color:var(--flare); margin-top:24px;
    text-shadow:0 0 40px rgba(232,20,44,0.7); opacity:0;
  }
  .intro-countdown.pulse{animation:countdownPulse 0.9s ease-out;}
  @keyframes countdownPulse{
    0%{opacity:0; transform:scale(2);}
    30%{opacity:1; transform:scale(1);}
    100%{opacity:0; transform:scale(0.9);}
  }

  footer{padding:32px 24px; text-align:center; font-size:12px; color:var(--chalk-dim); border-top:1px solid var(--line); margin-top:20px;}
  footer a{color:var(--chalk-dim); text-decoration:none;}
  footer a:hover{color:var(--flare);}
</style>
</head>
<body>

<nav>
  <img src="{{ url_for('static', filename='logo.png') }}" alt="Smackagram" style="height:34px; width:auto;">
  <a href="/smack-battle" class="back-link">&larr; New battle</a>
</nav>

<div class="wrap">
  <div class="matchup" id="matchupHeader">
    <p class="matchup-teams">Loading...</p>
  </div>

  <div id="content"></div>
  <div id="lineHistory"></div>
  <div id="actionArea"></div>
</div>

<div id="introOverlay" style="display:none; position:fixed; inset:0; background:#000; z-index:200; align-items:center; justify-content:center; flex-direction:column;">
  <p id="introTeamA" class="intro-team side-a"></p>
  <p class="intro-vs">VS</p>
  <p id="introTeamB" class="intro-team side-b"></p>
  <p id="introCountdown" class="intro-countdown"></p>
</div>

<audio id="crowdLoopAudio" loop style="display:none;"></audio>
<audio id="waitingMusicAudio" loop style="display:none;"></audio>
<audio id="cheerAudio" style="display:none;"></audio>
<audio id="booAudio" style="display:none;"></audio>
<audio id="critiqueRevealAudio" style="display:none;"></audio>
<audio id="bellAudio" style="display:none;"></audio>
<audio id="introAudio" style="display:none;"></audio>
<audio id="tickAudio" style="display:none;"></audio>
<audio id="newLineAudio" style="display:none;"></audio>

<div id="roundResultPopup" class="round-popup"></div>



<script>
const challengeCode = "{{ challenge_code }}";

function getMySide() {
  return localStorage.getItem(`battle_side_${challengeCode}`);
}
function setMySide(side) {
  localStorage.setItem(`battle_side_${challengeCode}`, side);
}
function getVoterId() {
  let id = localStorage.getItem('smackagram_battle_voter_id');
  if (!id) {
    id = 'voter-' + crypto.randomUUID();
    localStorage.setItem('smackagram_battle_voter_id', id);
  }
  return id;
}
function escapeHtml(str) {
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

let soundEnabled = true;
let sfxUrls = null;
let introShown = false;
let lastLineCount = 0;
let lastRoundResultsCount = 0;
let knownRoundNumber = null;
let lastActionSignature = null;
let judgingStartedAt = null;

async function initSound() {
  try {
    if (!sfxUrls) {
      const resp = await fetch('/api/battle-sfx');
      sfxUrls = await resp.json();
    }
    soundEnabled = true;

    // Every sound effect lives on a persistent, pre-existing <audio>
    // element with its src set once here, rather than a fresh
    // `new Audio()` created at the moment each sound needs to play.
    // Mobile Safari in particular is strict about only allowing a
    // brand-new Audio object to play if it's directly tied to a user
    // gesture — but replaying an element that was already unlocked once
    // (see handlePageInteraction) is reliably allowed from anywhere,
    // including from inside a poll callback.
    const sourceMap = {
      cheerAudio: sfxUrls.cheer_url,
      booAudio: sfxUrls.boo_url,
      critiqueRevealAudio: sfxUrls.critique_reveal_url,
      bellAudio: sfxUrls.bell_url,
      introAudio: sfxUrls.intro_url,
      tickAudio: sfxUrls.countdown_tick_url,
      newLineAudio: sfxUrls.new_line_url,
    };
    for (const [id, url] of Object.entries(sourceMap)) {
      const el = document.getElementById(id);
      if (el && url) el.src = url;
    }
    if (document.getElementById('critiqueRevealAudio')) {
      document.getElementById('critiqueRevealAudio').volume = 0.5;
    }

    const crowdAudio = document.getElementById('crowdLoopAudio');
    if (sfxUrls.crowd_loop_url) {
      crowdAudio.src = sfxUrls.crowd_loop_url;
      crowdAudio.volume = 0.15;
    }
    const waitingAudio = document.getElementById('waitingMusicAudio');
    if (sfxUrls.waiting_music_url) {
      waitingAudio.src = sfxUrls.waiting_music_url;
      waitingAudio.volume = 0.25;
    }
    // Browsers block audio-with-sound from truly autoplaying before any
    // interaction with the page — updateBackgroundMusic figures out
    // which loop should actually be playing for the current status;
    // this first attempt will likely get silently blocked, which is
    // fine, since handlePageInteraction catches the first real
    // interaction and retries from there.
    updateBackgroundMusic(lastKnownStatus);
  } catch (err) {
    // sound just won't be available this session — not fatal
  }
}

let lastKnownStatus = 'waiting';

function updateBackgroundMusic(status) {
  const crowdAudio = document.getElementById('crowdLoopAudio');
  const waitingAudio = document.getElementById('waitingMusicAudio');
  if (status === 'waiting' || status === 'complete') {
    // Same epic rock track for both the "waiting to start" screen and
    // the final scorecard reveal — the crowd loop is specifically for
    // the live back-and-forth of an active battle.
    if (crowdAudio && !crowdAudio.paused) crowdAudio.pause();
    if (waitingAudio && waitingAudio.paused && waitingAudio.src) waitingAudio.play().catch(() => {});
  } else {
    if (waitingAudio && !waitingAudio.paused) waitingAudio.pause();
    if (crowdAudio && crowdAudio.paused && crowdAudio.src) crowdAudio.play().catch(() => {});
  }
}

initSound();

const unlockedAudioIds = new Set();

function handlePageInteraction() {
  // Browsers block real autoplay-with-sound before any interaction on
  // every site — the first tap/click anywhere on the page unlocks and
  // starts the music. Permanent from there — no mute toggle.
  updateBackgroundMusic(lastKnownStatus);

  // Also unlock every one-shot sound effect element — mobile Safari in
  // particular will reject play() on an element later (e.g. from inside
  // a poll callback) if that exact element was never successfully
  // played during a real gesture first. Tracked per-element (not a
  // single one-time flag) so this safely retries only the ones that
  // still need it — covers the case where the very first click happens
  // before the sound URLs have finished loading — without repeating a
  // play-then-pause on every single keystroke once everything's already
  // unlocked, which would otherwise cause audible blips while typing.
  ['cheerAudio', 'booAudio', 'critiqueRevealAudio', 'bellAudio', 'introAudio', 'tickAudio', 'newLineAudio'].forEach(id => {
    if (unlockedAudioIds.has(id)) return;
    const el = document.getElementById(id);
    if (el && el.src) {
      el.play().then(() => { el.pause(); unlockedAudioIds.add(id); }).catch(() => {});
    }
  });
}

['click', 'touchstart', 'keydown'].forEach(evt => {
  document.addEventListener(evt, handlePageInteraction);
});

function playAudioElement(id) {
  const el = document.getElementById(id);
  if (el && el.src) {
    el.currentTime = 0;
    el.play().catch(() => {});
  }
}

function showRoundResultPopup(outcome) {
  // outcome: "win", "loss", or "tie" — relative to the local viewer's side
  const popup = document.getElementById('roundResultPopup');
  popup.className = 'round-popup';
  popup.textContent = outcome === 'win' ? 'You won that round!'
    : outcome === 'loss' ? 'You lost that round'
    : 'Round tied';

  void popup.offsetWidth;
  popup.classList.add(outcome, 'show');
  setTimeout(() => { popup.classList.remove('show'); }, 5000);

  if (soundEnabled && sfxUrls) {
    if (outcome === 'win' && sfxUrls.cheer_url) playAudioElement('cheerAudio');
    if (outcome === 'loss' && sfxUrls.boo_url) playAudioElement('booAudio');
    if (sfxUrls.critique_reveal_url) playAudioElement('critiqueRevealAudio');
  }
}

function ringBell() {
  if (soundEnabled && sfxUrls && sfxUrls.bell_url) {
    playAudioElement('bellAudio');
  }
}

function playIntro(teamA, teamB) {
  const overlay = document.getElementById('introOverlay');
  const countdownEl = document.getElementById('introCountdown');
  document.getElementById('introTeamA').textContent = teamA;
  document.getElementById('introTeamB').textContent = teamB;
  countdownEl.textContent = '';
  countdownEl.className = 'intro-countdown';
  overlay.style.display = 'flex';
  if (soundEnabled && sfxUrls && sfxUrls.intro_url) {
    playAudioElement('introAudio');
  }

  // Hold on the team names + VS for a beat before the countdown starts,
  // then step through 3, 2, 1 — each number gets its own punch-in pulse
  // — before the overlay finally clears and the battle is revealed.
  const holdMs = 2200;
  const stepMs = 900;
  [3, 2, 1].forEach((n, i) => {
    setTimeout(() => {
      countdownEl.textContent = n;
      // Removing then re-adding the class in the next frame restarts the
      // CSS animation each time — just re-setting the same class name
      // wouldn't replay an animation that already finished.
      countdownEl.classList.remove('pulse');
      void countdownEl.offsetWidth;
      countdownEl.classList.add('pulse');
      if (soundEnabled && sfxUrls && sfxUrls.countdown_tick_url) {
        playAudioElement('tickAudio');
      }
    }, holdMs + i * stepMs);
  });

  setTimeout(() => {
    overlay.style.display = 'none';
    if (soundEnabled && sfxUrls && sfxUrls.bell_url) {
      playAudioElement('bellAudio');
    }
  }, holdMs + 3 * stepMs);
}

async function loadBattle() {
  try {
    const resp = await fetch(`/api/battles/${challengeCode}?_=${Date.now()}`, {cache: 'no-store'});
    if (resp.status === 404) {
      document.getElementById('matchupHeader').innerHTML = '<p class="matchup-teams">Battle not found</p>';
      document.getElementById('content').innerHTML = '';
      return;
    }
    if (!resp.ok) throw new Error(`unexpected status ${resp.status}`);
    const battle = await resp.json();
    render(battle);
  } catch (err) {
    // A transient network error (much more common on mobile than
    // desktop) should never permanently end polling — that was the
    // actual cause of needing a hard refresh to recover. Just skip this
    // one cycle silently; the next scheduled poll will try again.
    console.warn('loadBattle poll failed, will retry:', err);
  }
}

function buildFinalScorecard(battle, mySide) {
  const results = battle.round_results || [];
  const winsA = results.filter(r => r.winner === 'a').length;
  const winsB = results.filter(r => r.winner === 'b').length;

  const scoresA = results.map(r => r.score_a).filter(s => s !== null && s !== undefined);
  const scoresB = results.map(r => r.score_b).filter(s => s !== null && s !== undefined);
  const avgA = scoresA.length ? (scoresA.reduce((sum, s) => sum + s, 0) / scoresA.length).toFixed(1) : null;
  const avgB = scoresB.length ? (scoresB.reduce((sum, s) => sum + s, 0) / scoresB.length).toFixed(1) : null;

  let rounds = '';
  for (let round = 1; round <= 5; round++) {
    const r = results.find(x => x.round === round);
    const cls = !r ? '' : r.winner === 'tie' ? 'tie' : 'side-' + r.winner;
    rounds += `<div class="final-round-chip ${cls}"><span class="final-round-num">R${round}</span></div>`;
  }

  const isWinner = battle.overall_winner && battle.overall_winner !== 'tie' && mySide === battle.overall_winner;
  const isLoser = battle.overall_winner && battle.overall_winner !== 'tie' && mySide !== battle.overall_winner;
  const recapText = battle.overall_winner === 'tie' ? battle.recap_winner_text
    : isWinner ? battle.recap_winner_text
    : battle.recap_loser_text;
  const recapClass = battle.overall_winner === 'tie' ? 'tie' : isWinner ? 'win' : 'loss';
  const recapLabel = battle.overall_winner === 'tie' ? "It's a tie" : isWinner ? 'You won the battle' : 'You lost the battle';

  // Recap generation is a real AI call running in the background — this
  // covers the brief window before overall_winner has actually arrived.
  const recapBlock = !battle.overall_winner
    ? '<p class="waiting-note" style="margin-top:16px;">Writing your recap...</p>'
    : `
      <div class="critique-box ${recapClass}" style="margin-top:16px;">
        <p class="critique-label">${recapLabel}</p>
        <p>${escapeHtml(recapText || '')}</p>
      </div>
    `;

  return `
    <div class="card final-scorecard">
      <p class="final-scorecard-title">Final Scorecard</p>
      <div class="final-score-tally">
        <span class="side-a">${winsA}</span>
        <span class="final-score-dash">–</span>
        <span class="side-b">${winsB}</span>
      </div>
      <div class="final-round-row">${rounds}</div>
      ${avgA !== null && avgB !== null ? `
        <div class="final-avg-row">
          <div class="final-avg-item"><p class="final-avg-label">${escapeHtml(battle.team_a)}</p><p class="final-avg-value side-a">${avgA}/10</p></div>
          <div class="final-avg-item"><p class="final-avg-label">${escapeHtml(battle.team_b)}</p><p class="final-avg-value side-b">${avgB}/10</p></div>
        </div>
      ` : ''}
      ${recapBlock}
    </div>
  `;
}

function buildLedRow(battle) {
  const results = {};
  (battle.round_results || []).forEach(r => { results[r.round] = r.winner; });

  let leds = '';
  for (let round = 1; round <= 5; round++) {
    if (results[round]) {
      const winner = results[round]; // "a", "b", or "tie"
      leds += `<div class="led ${winner === 'tie' ? 'tie' : 'side-' + winner}"></div>`;
    } else if (battle.status === 'active' && round === battle.round_number) {
      leds += `<div class="led active"></div>`;
    } else {
      leds += `<div class="led"></div>`;
    }
  }
  return leds;
}

function render(battle) {
  const header = document.getElementById('matchupHeader');
  const content = document.getElementById('content');
  const lineHistory = document.getElementById('lineHistory');
  const actionArea = document.getElementById('actionArea');
  const mySide = getMySide();

  if (battle.status !== lastKnownStatus) {
    lastKnownStatus = battle.status;
    updateBackgroundMusic(battle.status);
  }

  document.documentElement.classList.toggle('battle-complete', battle.status === 'complete');
  document.body.classList.toggle('battle-complete', battle.status === 'complete');

  if (battle.status === 'waiting') {
    content.innerHTML = '';
    lineHistory.innerHTML = '';
    header.innerHTML = `<p class="matchup-teams"><span class="side-a">${escapeHtml(battle.team_a)}</span></p><p class="round-indicator">Waiting for a challenger</p>`;

    const waitingSignature = `waiting|${mySide}`;
    if (lastActionSignature !== waitingSignature) {
      lastActionSignature = waitingSignature;

      if (mySide === 'a') {
        actionArea.innerHTML = `
          <div class="card">
            <p class="waiting-note">Share your battle link with whoever you're calling out. This page will update once they join.</p>
          </div>
        `;
      } else {
        actionArea.innerHTML = `
          <div class="card">
            <p class="waiting-note" style="margin-bottom:14px;">${escapeHtml(battle.display_name_a)} is calling out ${escapeHtml(battle.team_a)} fans. Step up?</p>
            <label for="teamBInput">Your team</label>
            <input id="teamBInput" type="text" placeholder="ex. Eagles">
            <label for="nameBInput">Your name</label>
            <input id="nameBInput" type="text" placeholder="ex. RivalReady" maxlength="40">
            <div id="actionError"></div>
            <button id="joinBtn" class="btn btn-flare">Accept the challenge</button>
          </div>
        `;
        document.getElementById('joinBtn').addEventListener('click', async () => {
          const btn = document.getElementById('joinBtn');
          const teamB = document.getElementById('teamBInput').value.trim();
          const nameB = document.getElementById('nameBInput').value.trim();
          const errorEl = document.getElementById('actionError');
          errorEl.style.display = 'none';
          if (!teamB) {
            errorEl.textContent = 'Enter your team first.';
            errorEl.style.display = 'block';
            return;
          }
          btn.disabled = true;
          const resp = await fetch(`/api/battles/${challengeCode}/join`, {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({team_b: teamB, display_name_b: nameB})
          });
          const data = await resp.json();
          if (data.error) {
            errorEl.textContent = data.error;
            errorEl.style.display = 'block';
            btn.disabled = false;
          } else {
            setMySide('b');
            lastActionSignature = null;
            render(data);
          }
        });
      }
    }
    return;
  }

  // Fires once per page view, the first moment the battle is seen as
  // active or complete (covers both "I just joined" and "I refreshed
  // into an already-active battle").
  if (!introShown) {
    introShown = true;
    knownRoundNumber = battle.round_number;
    lastRoundResultsCount = (battle.round_results || []).length;
    // Only play the full countdown overlay for round 1's actual start —
    // a refresh mid-battle (round 2+) was incorrectly replaying the
    // whole 3-2-1 sequence every time, since introShown is just an
    // in-memory flag that resets on every fresh page load. For any
    // later round, skip straight to showing the current state.
    if (battle.round_number === 1) {
      playIntro(battle.team_a, battle.team_b);
    }
  }

  // Round 1's bell is handled by playIntro (rings right as the intro
  // countdown finishes). This covers every round after that — the
  // moment round_number ticks up while still active, ring the bell
  // again to mark the new round starting.
  if (knownRoundNumber !== null && battle.status === 'active' && battle.round_number > knownRoundNumber) {
    ringBell();
  }
  knownRoundNumber = battle.round_number;

  // A new round result landed — tell the local viewer whether they won,
  // lost, or tied that round, with the matching cheer/boo sound. Only
  // fires for results that are actually new since the last render, and
  // only once mySide is known (so this doesn't fire for pure spectators
  // watching without having joined either side).
  const results = battle.round_results || [];
  if (results.length > lastRoundResultsCount && mySide) {
    const latest = results[results.length - 1];
    const outcome = latest.winner === 'tie' ? 'tie' : (latest.winner === mySide ? 'win' : 'loss');
    showRoundResultPopup(outcome);
  }
  lastRoundResultsCount = results.length;

  // A new line arrived since the last render — celebrate it with a quick
  // crowd-pop sound, but only once sound has actually been enabled.
  if (soundEnabled && battle.lines.length > lastLineCount && lastLineCount > 0) {
    const newLineAudio = document.getElementById('newLineAudio');
    newLineAudio.currentTime = 0;
    newLineAudio.play().catch(() => {});
  }
  lastLineCount = battle.lines.length;

  header.innerHTML = `
    <p class="matchup-teams"><span class="side-a">${escapeHtml(battle.team_a)}</span><span class="vs">vs</span><span class="side-b">${escapeHtml(battle.team_b)}</span></p>
    <p class="round-indicator">${battle.status === 'complete' ? 'Battle complete' : `Round ${battle.round_number} of 5`}</p>
    <div class="led-row">${buildLedRow(battle)}</div>
  `;

  // Only this round's lines are shown while the battle is active — the
  // screen clears each round, with the round number labeled clearly
  // above it, rather than accumulating every line from every round on
  // one long page. Once the battle is complete, the chat history is
  // dropped entirely — just the final scorecard, nothing else.
  if (battle.status === 'complete') {
    lineHistory.innerHTML = '';
  } else {
    const roundLines = battle.lines.filter(l => l.round === battle.round_number);

    let historyHtml = '<div class="card">';
    historyHtml += `<p class="round-label">Round ${battle.round_number}</p>`;
    if (roundLines.length === 0) {
      historyHtml += '<p class="empty-note">No lines yet — the round is about to begin.</p>';
    } else {
      roundLines.forEach(l => {
        const name = l.side === 'a' ? battle.display_name_a : battle.display_name_b;
        historyHtml += `
          <div class="line side-${l.side}">
            <p class="line-name">${escapeHtml(name)}</p>
            <p class="line-message">${escapeHtml(l.message)}</p>
          </div>
        `;
      });
    }
    historyHtml += '</div>';
    lineHistory.innerHTML = historyHtml;
  }

  // The action area (turn input, waiting note, or voting) only gets
  // rebuilt when something it actually depends on changes — this is
  // what stops the textarea from losing focus and the buttons from
  // getting destroyed mid-click on every 4-second poll. A signature
  // string captures everything that would legitimately require a
  // rebuild; if it's unchanged since last render, the DOM (and whatever
  // the user is doing in it right now) is left completely alone.
  // While judging is pending with no result yet, fold in a coarse
  // time-bucket so the action area re-checks periodically instead of
  // getting stuck skipping its own rebuild forever — otherwise the
  // 20-second "try again" fallback below would never actually get a
  // chance to render, since none of the underlying battle fields change
  // while genuinely stuck waiting.
  const isPendingJudgment = battle.status === 'active' && battle.awaiting_next_round
    && !(battle.round_results || []).some(r => r.round === battle.round_number);
  const timeBucket = isPendingJudgment ? Math.floor(Date.now() / 5000) : 0;

  const actionSignature = `${battle.status}|${battle.current_turn}|${mySide}|${battle.round_number}|${battle.vote_count_a}|${battle.awaiting_next_round}|${battle.ready_a}|${battle.ready_b}|${(battle.round_results || []).length}|${battle.overall_winner}|${battle.rematch_requested_a}|${battle.rematch_requested_b}|${timeBucket}`;
  if (lastActionSignature === actionSignature) {
    return;
  }
  lastActionSignature = actionSignature;

  let actionHtml = '';
  if (battle.status === 'active' && battle.awaiting_next_round) {
    const latestResult = (battle.round_results || []).find(r => r.round === battle.round_number);

    if (!latestResult) {
      // Judging happens in the background now (so submitting a line
      // responds instantly) — this is the brief window before that
      // finishes. Keep polling picks it up within ~1.5s. Track how long
      // this has been pending — if it drags on well past a normal AI
      // call (20s+), something's actually gone wrong server-side rather
      // than just being mid-flight, so offer a way out instead of
      // leaving the person stuck looking at this forever with no
      // recourse but abandoning the battle.
      if (judgingStartedAt === null) judgingStartedAt = Date.now();
      const stuckTooLong = Date.now() - judgingStartedAt > 20000;

      actionHtml = stuckTooLong ? `
        <div class="card">
          <p class="waiting-note" style="margin-bottom:12px;">This is taking longer than it should.</p>
          <button id="retryJudgingBtn" class="btn" style="background:transparent; border:1px solid var(--line-strong); color:var(--chalk);">Try again</button>
        </div>
      ` : `
        <div class="card">
          <p class="waiting-note">Judging this round...</p>
        </div>
      `;
    } else {
      judgingStartedAt = null;
      const myCritique = mySide === 'a' ? latestResult.critique_a : latestResult.critique_b;
      const myScore = mySide === 'a' ? latestResult.score_a : latestResult.score_b;
      const outcome = latestResult.winner === 'tie' ? 'tie' : (latestResult.winner === mySide ? 'win' : 'loss');
      const iAmReady = mySide === 'a' ? battle.ready_a : battle.ready_b;
      const isFinalRound = battle.round_number >= 5;

      actionHtml = `
        <div class="card">
          <div class="critique-box ${outcome}">
            <p class="critique-label">${outcome === 'win' ? 'You won this round' : outcome === 'loss' ? 'You lost this round' : 'Round tied'}${myScore !== null && myScore !== undefined ? ` — ${myScore}/10` : ''}</p>
            <p>${escapeHtml(myCritique)}</p>
          </div>
          ${iAmReady
            ? '<p class="waiting-note">Waiting for your opponent...</p>'
            : `<button id="readyBtn" class="btn btn-flare">${isFinalRound ? 'Take It To The Judges' : 'Start next round'}</button>`}
        </div>
      `;
    }
  } else if (battle.status === 'active') {
    if (mySide === battle.current_turn) {
      actionHtml = `
        <div class="card">
          <p class="waiting-note" style="margin-bottom:10px;">Your turn — round ${battle.round_number}</p>
          <textarea id="lineInput" placeholder="Say what you came to say..." maxlength="500"></textarea>
          <div id="actionError"></div>
          <button id="submitLineBtn" class="btn btn-flare">Send it</button>
        </div>
      `;
    } else {
      const waitingOn = battle.current_turn === 'a' ? battle.display_name_a : battle.display_name_b;
      actionHtml = `<div class="card"><p class="waiting-note">Waiting for ${escapeHtml(waitingOn)} to respond...</p></div>`;
    }
  } else if (battle.status === 'complete') {
    // Both sides have requested a rematch and the new battle already
    // exists — send both people there automatically.
    if (battle.rematch_challenge_code) {
      if (mySide) localStorage.setItem(`battle_side_${battle.rematch_challenge_code}`, mySide);
      window.location.href = `/battle/${battle.rematch_challenge_code}`;
      return;
    }

    actionHtml = buildFinalScorecard(battle, mySide);
    if (battle.vote_count_a !== null) {
      const winner = battle.vote_count_a > battle.vote_count_b ? battle.team_a
        : battle.vote_count_b > battle.vote_count_a ? battle.team_b : null;
      actionHtml += '<div class="card">';
      if (winner) actionHtml += `<p class="winner-banner">${escapeHtml(winner)} is winning the crowd</p>`;
      actionHtml += `
        <div class="vote-row">
          <div class="vote-btn" id="voteABtn">
            <p class="vote-name">${escapeHtml(battle.team_a)}</p>
            <p class="vote-count">${battle.vote_count_a}</p>
          </div>
          <div class="vote-btn" id="voteBBtn">
            <p class="vote-name">${escapeHtml(battle.team_b)}</p>
            <p class="vote-count">${battle.vote_count_b}</p>
          </div>
        </div>
        <div id="actionError" style="margin-top:12px;"></div>
      `;
      actionHtml += '</div>';
    }

    const iRequestedRematch = mySide === 'a' ? battle.rematch_requested_a : battle.rematch_requested_b;
    actionHtml += `
      <div class="card">
        ${iRequestedRematch
          ? '<p class="waiting-note">Waiting for your opponent to start a rematch...</p>'
          : '<button id="rematchBtn" class="btn btn-flare">Start New Smack Battle</button>'}
      </div>
    `;
  }

  actionArea.innerHTML = actionHtml;

  const retryJudgingBtn = document.getElementById('retryJudgingBtn');
  if (retryJudgingBtn) {
    retryJudgingBtn.addEventListener('click', () => window.location.reload());
  }

  if (battle.status === 'active' && battle.awaiting_next_round) {
    const readyBtn = document.getElementById('readyBtn');
    if (readyBtn) {
      readyBtn.addEventListener('click', async () => {
        // The clicker hears the bell the instant they click, regardless
        // of whether the other side has clicked yet.
        ringBell();
        readyBtn.disabled = true;
        readyBtn.textContent = 'Waiting for opponent...';
        const resp = await fetch(`/api/battles/${challengeCode}/ready`, {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({side: mySide})
        });
        const data = await resp.json();
        if (!data.error) {
          lastActionSignature = null;
          render(data);
        }
      });
    }
  }

  if (battle.status === 'active' && mySide === battle.current_turn) {
    const submitBtn = document.getElementById('submitLineBtn');
    const lineInput = document.getElementById('lineInput');

    async function submitLine() {
      const message = lineInput.value.trim();
      const errorEl = document.getElementById('actionError');
      errorEl.style.display = 'none';
      if (!message) return;
      // Disable immediately so a slow connection or an impatient extra
      // click can't fire the request twice.
      submitBtn.disabled = true;
      submitBtn.textContent = 'Sending...';
      try {
        const resp = await fetch(`/api/battles/${challengeCode}/line`, {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({side: mySide, message: message})
        });
        const data = await resp.json();
        if (data.error) {
          errorEl.textContent = data.error;
          errorEl.style.display = 'block';
          submitBtn.disabled = false;
          submitBtn.textContent = 'Send it';
        } else {
          lastActionSignature = null;
          render(data);
        }
      } catch (err) {
        errorEl.textContent = "Couldn't send — try again.";
        errorEl.style.display = 'block';
        submitBtn.disabled = false;
        submitBtn.textContent = 'Send it';
      }
    }

    submitBtn.addEventListener('click', submitLine);
    lineInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        submitLine();
      }
    });
  }

  if (battle.status === 'complete' && battle.vote_count_a !== null) {
    ['a', 'b'].forEach(side => {
      const btn = document.getElementById(side === 'a' ? 'voteABtn' : 'voteBBtn');
      btn.addEventListener('click', async () => {
        const resp = await fetch(`/api/battles/${challengeCode}/vote`, {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({voted_for: side, voter_id: getVoterId()})
        });
        const data = await resp.json();
        const errorEl = document.getElementById('actionError');
        if (data.error) {
          errorEl.textContent = data.error;
          errorEl.style.display = 'block';
        } else {
          lastActionSignature = null;
          loadBattle();
        }
      });
    });
  }

  if (battle.status === 'complete') {
    const rematchBtn = document.getElementById('rematchBtn');
    if (rematchBtn) {
      rematchBtn.addEventListener('click', async () => {
        rematchBtn.disabled = true;
        rematchBtn.textContent = 'Waiting for opponent...';
        const resp = await fetch(`/api/battles/${challengeCode}/rematch`, {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({side: mySide})
        });
        const data = await resp.json();
        if (!data.error) {
          lastActionSignature = null;
          render(data);
        }
      });
    }
  }
}

// A self-scheduling loop rather than a raw setInterval — each poll only
// gets scheduled after the previous one actually finishes, which avoids
// overlapping/stacked calls if a single request is ever slow, and tends
// to recover more predictably than setInterval after a mobile browser
// throttles or suspends timers in the background.
let pollTimeoutId = null;
async function pollLoop() {
  try {
    await loadBattle();
  } catch (err) {
    // loadBattle already catches its own errors internally, but this is
    // a final safety net — nothing should ever be able to break the
    // recursive scheduling below and silently end polling for the rest
    // of the session.
    console.warn('pollLoop unexpected error:', err);
  }
  pollTimeoutId = setTimeout(pollLoop, 1500);
}
pollLoop();

// Mobile browsers throttle or pause JS timers when a tab is backgrounded
// (screen lock, switching apps, etc.) — when someone comes back to the
// tab, force an immediate refresh instead of waiting for the next
// regular poll tick, so they catch up right away instead of looking
// stuck on stale state.
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible') {
    if (pollTimeoutId) clearTimeout(pollTimeoutId);
    pollLoop();
  }
});
</script>
</body>
</html>
