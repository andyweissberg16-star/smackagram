<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Smack Lab — Learn the Art of Smack | Smackagram</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#0D0D0D;
    --ink-2:#1A1A1A;
    --chalk:#F5F5F3;
    --chalk-dim:#9A9A96;
    --flare:#E8142C;
    --flare-dim:#3A0810;
    --gold:#FFD400;
    --line:rgba(245,245,243,0.10);
    --line-strong:rgba(245,245,243,0.24);
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html{scroll-behavior:smooth;}
  body{background:var(--ink); color:var(--chalk); font-family:'Inter',sans-serif; line-height:1.5; -webkit-font-smoothing:antialiased;}
  .wrap{max-width:720px; margin:0 auto; padding:0 24px;}

  ::-webkit-scrollbar{width:12px;}
  ::-webkit-scrollbar-track{background:var(--ink);}
  ::-webkit-scrollbar-thumb{background:var(--flare); border:2px solid var(--ink); border-radius:6px;}
  html{scrollbar-color:var(--flare) var(--ink); scrollbar-width:thin;}

  nav{display:flex; justify-content:space-between; align-items:center; padding:20px 24px; border-bottom:1px solid var(--line);}
  nav a.back-link{color:var(--chalk-dim); text-decoration:none; font-size:14px;}
  nav a.back-link:hover{color:var(--flare);}

  .hero{padding:40px 24px 24px; text-align:center;}
  .hero h1{font-family:'Anton',sans-serif; font-size:42px; text-transform:uppercase; letter-spacing:1px; line-height:1.05;}
  .hero h1 span{color:var(--flare);}
  .hero p{color:var(--chalk-dim); font-size:15px; margin-top:10px; max-width:480px; margin-left:auto; margin-right:auto;}

  .card{
    background:var(--ink-2); border:2px solid var(--chalk); border-radius:2px; padding:24px;
    margin-bottom:24px; box-shadow:6px 6px 0 var(--flare); position:relative;
  }

  label{display:block; font-size:12px; color:var(--chalk-dim); text-transform:uppercase; letter-spacing:0.5px; margin-bottom:6px;}
  input[type=text]{
    width:100%; background:var(--ink); border:1px solid var(--line-strong); color:var(--chalk);
    padding:12px 14px; font-family:'Inter',sans-serif; font-size:14px; border-radius:2px; margin-bottom:14px;
  }
  input[type=text]:focus{outline:none; border-color:var(--flare);}

  .btn{
    font-weight:700; font-size:14px; padding:14px 24px; border-radius:2px; border:none; cursor:pointer;
    text-transform:uppercase; letter-spacing:0.5px; width:100%; transition:transform 0.12s ease;
    font-family:'Inter',sans-serif;
  }
  .btn:hover{transform:translateY(-1px);}
  .btn:disabled{opacity:0.5; cursor:not-allowed; transform:none;}
  .btn-flare{background:var(--flare); color:#fff; box-shadow:0 0 20px rgba(232,20,44,0.4);}
  .btn-ghost{background:transparent; color:var(--chalk); border:2px solid var(--line-strong); width:auto;}
  .btn-ghost:hover{border-color:var(--flare); color:var(--flare);}

  #labSection{display:none;}

  .chat-log{
    background:var(--ink); border:1px solid var(--line-strong); border-radius:2px; padding:16px;
    max-height:500px; overflow-y:auto; margin-bottom:16px; display:flex; flex-direction:column; gap:14px;
  }

  .msg-user{
    align-self:flex-end; max-width:85%; background:var(--flare-dim); border:1px solid var(--flare);
    border-radius:10px 10px 2px 10px; padding:10px 14px; font-size:14px; position:relative;
    animation:msgIn 0.25s ease;
  }
  .msg-user .lock-btn{
    display:block; margin-top:6px; font-family:'JetBrains Mono',monospace; font-size:10px; color:var(--gold);
    background:none; border:1px solid var(--gold); border-radius:20px; padding:3px 10px; cursor:pointer;
  }
  .msg-user .lock-btn:hover{background:var(--gold); color:var(--ink);}

  .msg-ai{align-self:flex-start; max-width:90%; animation:msgIn 0.25s ease; display:flex; flex-direction:column; gap:10px;}

  .critique-block{
    background:rgba(154,154,150,0.08); border:1px solid var(--line-strong); border-left:3px solid var(--chalk-dim);
    border-radius:2px; padding:12px 14px;
  }
  .critique-block .rating-row{display:flex; align-items:center; gap:8px; margin-bottom:8px;}
  .critique-block .rating-badge{
    font-family:'JetBrains Mono',monospace; font-weight:700; font-size:13px; color:var(--ink);
    background:var(--gold); padding:3px 10px; border-radius:20px; flex-shrink:0;
  }
  .critique-block .rating-badge.low{background:var(--chalk-dim);}
  .critique-block .rating-badge.high{background:var(--flare); color:#fff;}
  .critique-block .coach-label{font-family:'JetBrains Mono',monospace; font-size:10px; color:var(--chalk-dim); text-transform:uppercase; letter-spacing:0.5px;}
  .critique-block .critique{font-size:13px; color:var(--chalk-dim); font-style:italic; line-height:1.5;}

  .comeback-block{
    background:var(--ink-2); border:1px solid var(--line-strong); border-left:3px solid var(--flare);
    border-radius:2px; padding:12px 14px;
  }
  .comeback-block .comeback-label{
    font-family:'JetBrains Mono',monospace; font-size:10px; color:var(--flare); text-transform:uppercase;
    letter-spacing:0.5px; margin-bottom:8px; display:block; font-weight:700;
  }
  .comeback-block .comeback{font-size:14px; line-height:1.5;}

  @keyframes msgIn{from{opacity:0; transform:translateY(6px);} to{opacity:1; transform:translateY(0);}}

  .input-row{display:flex; gap:8px;}
  .input-row input{margin-bottom:0; flex:1;}
  .input-row .btn{width:auto; white-space:nowrap; padding:12px 20px;}

  .empty-state{color:var(--chalk-dim); font-size:13px; text-align:center; padding:20px;}
  .typing-indicator{color:var(--chalk-dim); font-size:13px; font-style:italic; padding:4px 0;}

  footer{padding:32px 24px; text-align:center; font-size:12px; color:var(--chalk-dim); border-top:1px solid var(--line);}
</style>
</head>
<body>

<nav>
  <img src="{{ url_for('static', filename='logo.png') }}" alt="Smackagram" style="height:34px; width:auto;">
  <a href="/" class="back-link">&larr; Back to home</a>
</nav>

<img src="{{ url_for('static', filename='smack-lab-hero.png') }}" alt="Smack Lab — 1 on 1 coaching to take your smack to the big leagues" style="width:100%; height:auto; display:block;">

<div class="wrap">
  <div class="hero">
    <p>Learn the art of smack. Pick a team, throw your best line, and get rated — the good stuff, we'll help you actually send.</p>
  </div>

  <div class="card" id="setupSection">
    <label for="teamInput">Team to trash talk</label>
    <input id="teamInput" type="text" placeholder="ex. New York Yankees">

    <label for="myTeamInput">Your team (so the coach knows exactly how to get you where it hurts)</label>
    <input id="myTeamInput" type="text" placeholder="ex. Boston Red Sox">

    <label for="recipientInput">Who you'd eventually send this to (optional for now)</label>
    <input id="recipientInput" type="text" placeholder="ex. Mike">

    <button id="startBtn" class="btn btn-flare">Enter the lab</button>
  </div>

  <div id="labSection">
    <div class="card">
      <div id="avgTracker" style="display:none; margin-bottom:14px; padding:10px 14px; background:var(--ink); border:1px solid var(--line-strong); border-radius:2px; align-items:center; justify-content:space-between;">
        <span style="font-family:'JetBrains Mono',monospace; font-size:11px; color:var(--chalk-dim); text-transform:uppercase; letter-spacing:0.5px;">Session average</span>
        <span id="avgValue" style="font-family:'JetBrains Mono',monospace; font-weight:700; font-size:15px; color:var(--gold);">—</span>
      </div>
      <button id="sendBestBtn" class="btn btn-flare" style="display:none; margin-bottom:14px;">Send my best line yet</button>
      <div class="chat-log" id="chatLog">
        <div class="empty-state">Throw your first line below — the coach is waiting.</div>
      </div>
      <div class="input-row">
        <input id="lineInput" type="text" placeholder="Type your line...">
        <button id="sendBtn" class="btn btn-flare">Send</button>
      </div>
    </div>
    <button id="changeTargetBtn" class="btn btn-ghost" style="margin-bottom:24px;">Change team</button>
  </div>
</div>

<footer>
  Every line is rated on the spot. Land a good one? Send it for real from the home page.
</footer>

<script>
let currentTeam = '';
let myTeam = '';
let currentRecipient = '';
let conversationHistory = [];
let ratingHistory = [];
let sessionLines = [];
let bestLineSoFar = null;
let bestRatingSoFar = 0;
const VERDICT_MILESTONE = 5;

document.getElementById('startBtn').addEventListener('click', () => {
  const team = document.getElementById('teamInput').value.trim();
  if (!team) {
    document.getElementById('teamInput').focus();
    return;
  }
  currentTeam = team;
  myTeam = document.getElementById('myTeamInput').value.trim();
  currentRecipient = document.getElementById('recipientInput').value.trim();
  conversationHistory = [];
  ratingHistory = [];
  sessionLines = [];
  bestLineSoFar = null;
  bestRatingSoFar = 0;
  updateAverageDisplay();
  document.getElementById('sendBestBtn').style.display = 'none';

  document.getElementById('setupSection').style.display = 'none';
  document.getElementById('labSection').style.display = 'block';
  document.getElementById('chatLog').innerHTML = `<div class="empty-state">Throw your first line at ${team} — the coach is waiting.</div>`;
  document.getElementById('lineInput').focus();
});

document.getElementById('changeTargetBtn').addEventListener('click', () => {
  document.getElementById('labSection').style.display = 'none';
  document.getElementById('setupSection').style.display = 'block';
});

function ratingClass(rating) {
  if (rating <= 4) return 'low';
  if (rating >= 8) return 'high';
  return '';
}

function appendUserMessage(line) {
  const log = document.getElementById('chatLog');
  const emptyState = log.querySelector('.empty-state');
  if (emptyState) emptyState.remove();

  const div = document.createElement('div');
  div.className = 'msg-user';
  div.innerHTML = `${escapeHtml(line)}<button class="lock-btn">Lock this in</button>`;
  div.querySelector('.lock-btn').addEventListener('click', () => lockInLine(line));
  log.appendChild(div);
  log.scrollTop = log.scrollHeight;
}

function appendAiMessage(result) {
  const log = document.getElementById('chatLog');
  const div = document.createElement('div');
  div.className = 'msg-ai';
  div.innerHTML = `
    <div class="critique-block">
      <div class="rating-row">
        <span class="rating-badge ${ratingClass(result.rating)}">${result.rating}/10</span>
        <span class="coach-label">Coach's take</span>
      </div>
      <div class="critique">${escapeHtml(result.critique)}</div>
    </div>
    <div class="comeback-block">
      <span class="comeback-label">The comeback</span>
      <div class="comeback">${escapeHtml(result.comeback)}</div>
    </div>
  `;
  log.appendChild(div);
  log.scrollTop = log.scrollHeight;
}

function escapeHtml(str) {
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

async function sendLine() {
  const input = document.getElementById('lineInput');
  const line = input.value.trim();
  if (!line) return;

  const sendBtn = document.getElementById('sendBtn');
  sendBtn.disabled = true;
  input.value = '';
  appendUserMessage(line);

  const log = document.getElementById('chatLog');
  const typing = document.createElement('div');
  typing.className = 'typing-indicator';
  typing.textContent = 'Coach is rating your line...';
  log.appendChild(typing);
  log.scrollTop = log.scrollHeight;

  try {
    const resp = await fetch('/api/smack-lab/respond', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({
        team: currentTeam,
        my_team: myTeam,
        user_line: line,
        conversation_history: conversationHistory,
      })
    });
    const data = await resp.json();
    typing.remove();

    if (data.error) {
      const errDiv = document.createElement('div');
      errDiv.className = 'empty-state';
      errDiv.textContent = data.error;
      log.appendChild(errDiv);
    } else {
      appendAiMessage(data);
      conversationHistory.push({role: 'user', content: `Team you're a rival fan of: ${currentTeam}\n\nThe user's latest line: ${line}`});
      conversationHistory.push({role: 'assistant', content: JSON.stringify(data)});

      ratingHistory.push(data.rating);
      sessionLines.push(line);
      updateAverageDisplay();

      if (data.rating > bestRatingSoFar) {
        bestRatingSoFar = data.rating;
        bestLineSoFar = line;
        const sendBestBtn = document.getElementById('sendBestBtn');
        // Only surface the funnel once a line is actually good — no point
        // pushing someone toward checkout on the back of a 3/10.
        if (bestRatingSoFar >= 7) {
          sendBestBtn.style.display = 'block';
          sendBestBtn.textContent = `Send my best line yet (${bestRatingSoFar}/10)`;
        }
      }

      if (ratingHistory.length > 0 && ratingHistory.length % VERDICT_MILESTONE === 0) {
        await fetchAndShowVerdict();
      }
    }
  } catch (err) {
    typing.remove();
    const errDiv = document.createElement('div');
    errDiv.className = 'empty-state';
    errDiv.textContent = "Couldn't reach the coach right now — try again.";
    log.appendChild(errDiv);
  } finally {
    sendBtn.disabled = false;
    input.focus();
  }
}

function updateAverageDisplay() {
  const tracker = document.getElementById('avgTracker');
  const valueEl = document.getElementById('avgValue');
  if (ratingHistory.length === 0) {
    tracker.style.display = 'none';
    return;
  }
  const avg = ratingHistory.reduce((a, b) => a + b, 0) / ratingHistory.length;
  tracker.style.display = 'flex';
  valueEl.textContent = `${avg.toFixed(1)}/10 (${ratingHistory.length} line${ratingHistory.length === 1 ? '' : 's'})`;
}

async function fetchAndShowVerdict() {
  const log = document.getElementById('chatLog');
  const typing = document.createElement('div');
  typing.className = 'typing-indicator';
  typing.textContent = 'Coach is putting together your report card...';
  log.appendChild(typing);
  log.scrollTop = log.scrollHeight;

  const avg = ratingHistory.reduce((a, b) => a + b, 0) / ratingHistory.length;

  try {
    const resp = await fetch('/api/smack-lab/verdict', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({
        team: currentTeam,
        my_team: myTeam,
        average_rating: avg,
        session_lines: sessionLines,
      })
    });
    const data = await resp.json();
    typing.remove();

    if (data.verdict) {
      const div = document.createElement('div');
      div.className = 'msg-ai';
      const ctaHtml = avg >= 6.5 && bestLineSoFar
        ? `<button class="btn btn-flare verdict-cta" style="margin-top:10px;">Alright, I'm ready — send my best line (${bestRatingSoFar}/10)</button>`
        : '';
      div.innerHTML = `
        <div class="comeback-block" style="border-left-color:var(--gold);">
          <span class="comeback-label" style="color:var(--gold);">Session verdict — ${avg.toFixed(1)}/10 average</span>
          <div class="comeback">${escapeHtml(data.verdict)}</div>
          ${ctaHtml}
        </div>
      `;
      const ctaBtn = div.querySelector('.verdict-cta');
      if (ctaBtn) ctaBtn.addEventListener('click', () => lockInLine(bestLineSoFar));
      log.appendChild(div);
      log.scrollTop = log.scrollHeight;
    }
  } catch (err) {
    typing.remove();
  }
}

document.getElementById('sendBtn').addEventListener('click', sendLine);
document.getElementById('sendBestBtn').addEventListener('click', () => {
  if (bestLineSoFar) lockInLine(bestLineSoFar);
});
document.getElementById('lineInput').addEventListener('keydown', (e) => {
  if (e.key === 'Enter') sendLine();
});

function lockInLine(line) {
  const params = new URLSearchParams({
    team: currentTeam,
    recipient_name: currentRecipient,
    message: line,
  });
  window.location.href = `/?${params.toString()}#generator`;
}
</script>
</body>
</html>
