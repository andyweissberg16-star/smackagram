<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Smack Battle — Smackagram</title>
<meta name="description" content="Head-to-head trash talk, five rounds, judged by AI. Send a challenge link and find out who actually talks the better game.">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Smackagram">
<meta property="og:title" content="Smack Battle — settle it in five rounds">
<meta property="og:description" content="Head-to-head trash talk, five rounds, judged by AI. Send a challenge link and find out who actually talks the better game.">
<meta property="og:image" content="{{ url_for('static', filename='img/og-default.jpg', _external=True) }}">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:url" content="{{ request.base_url }}">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="Smack Battle — settle it in five rounds">
<meta name="twitter:description" content="Head-to-head trash talk, five rounds, judged by AI. Send a challenge link and find out who actually talks the better game.">
<meta name="twitter:image" content="{{ url_for('static', filename='img/og-default.jpg', _external=True) }}">
<link rel="icon" type="image/png" sizes="32x32" href="{{ url_for('static', filename='img/favicon-32.png') }}">
<link rel="apple-touch-icon" href="{{ url_for('static', filename='img/apple-touch-icon.png') }}">
<meta name="theme-color" content="#0D0D0D">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{{ url_for('static', filename='css/smackagram.css') }}">
<style>
  :root{
    --ink:#0D0D0D;
    --ink-2:#1A1A1A;
    --chalk:#F5F5F3;
    --chalk-dim:#9A9A96;
    --flare:#E8142C;
    --gold:#FFD400;
    --line:rgba(245,245,243,0.10);
    --line-strong:rgba(245,245,243,0.24);
  }
  body{background:var(--ink); color:var(--chalk); font-family:'Inter',sans-serif; line-height:1.5; -webkit-font-smoothing:antialiased;}
  .wrap{max-width:600px; margin:0 auto; padding:0 24px 60px;}
  nav a.back-link{color:var(--chalk-dim); text-decoration:none; font-size:14px;}
  nav a.back-link:hover{color:var(--flare);}

  .hero{text-align:center; padding:32px 0 8px;}
  .sub{color:var(--chalk-dim); font-size:14px; margin-top:8px;}

  .card{
    background:var(--ink-2); border:1px solid var(--line-strong); border-radius:4px; padding:28px; margin-top:28px;
    position:relative; overflow:hidden; box-shadow:0 20px 50px rgba(0,0,0,0.5);
  }
  .card::before{
    content:''; position:absolute; top:0; left:0; right:0; height:3px;
    background:linear-gradient(90deg, var(--flare), var(--gold), var(--flare));
  }
  .fight-card-label{
    font-family:'JetBrains Mono',monospace; font-size:10px; color:var(--chalk-dim); text-transform:uppercase;
    letter-spacing:2px; margin-bottom:20px; display:flex; align-items:center; gap:10px;
  }
  .fight-card-label::after{content:''; flex:1; height:1px; background:var(--line-strong);}

  label{
    display:block; font-family:'Anton',sans-serif; font-size:var(--fs-sm); color:var(--chalk); text-transform:uppercase;
    letter-spacing:1px; margin-bottom:8px;
  }
  input[type=text], select{
    width:100%; background:var(--ink); border:1px solid var(--line-strong); color:var(--chalk);
    padding:13px 14px; font-family:'Inter',sans-serif; font-size:14px; border-radius:4px; margin-bottom:18px;
    transition:border-color 0.15s;
  }
  input:focus, select:focus{outline:none; border-color:var(--flare); box-shadow:0 0 0 3px rgba(232,20,44,0.15);}
  input::placeholder{color:var(--chalk-dim);}

  .vs-divider{
    display:flex; align-items:center; gap:12px; margin:4px 0 20px; color:var(--chalk-dim);
    font-family:'Anton',sans-serif; font-size:12px; letter-spacing:2px;
  }
  .vs-divider::before, .vs-divider::after{content:''; flex:1; height:1px; background:var(--line-strong);}

  .btn{
    font-weight:700; font-size:var(--fs-md); padding:16px 24px; border-radius:4px; border:none; cursor:pointer;
    text-transform:uppercase; letter-spacing:0.5px; width:100%; font-family:'Inter',sans-serif;
  }
  .btn-flare{
    background:var(--flare); color:#fff; box-shadow:0 0 24px rgba(232,20,44,0.55), 0 6px 20px rgba(232,20,44,0.35);
    transition:box-shadow 0.15s, transform 0.15s;
  }
  .btn-flare:hover:not(:disabled){box-shadow:0 0 32px rgba(232,20,44,0.75), 0 6px 20px rgba(232,20,44,0.4); transform:translateY(-1px);}
  .btn-flare:disabled{opacity:0.5; cursor:not-allowed; box-shadow:none;}
  #createError{display:none; color:var(--flare-text); font-size:12px; margin-bottom:10px;}

  #resultCard{display:none; text-align:center;}
  .result-title{font-family:'Anton',sans-serif; font-size:22px; text-transform:uppercase; margin-bottom:10px; color:var(--gold); letter-spacing:0.5px;}
  .link-box{
    background:var(--ink); border:1px solid var(--line-strong); border-radius:4px; padding:12px; font-size:13px;
    color:var(--chalk-dim); word-break:break-all; margin-bottom:14px; font-family:'JetBrains Mono',monospace;
  }

  footer{padding:32px 24px; text-align:center; font-size:12px; color:var(--chalk-dim); border-top:1px solid var(--line); margin-top:40px;}
  footer a{color:var(--chalk-dim); text-decoration:none;}
  footer a:hover{color:var(--flare);}
</style>
</head>
<body>

{% include '_nav.html' %}

<picture>
  <source type="image/webp" sizes="100vw"
          srcset="{{ url_for('static', filename='img/smack-battle-hero-780.webp') }} 780w,
                  {{ url_for('static', filename='img/smack-battle-hero-1560.webp') }} 1560w,
                  {{ url_for('static', filename='img/smack-battle-hero-1983.webp') }} 1983w">
  <img src="{{ url_for('static', filename='img/smack-battle-hero-1560.jpg') }}" alt="Smack Battle — where trash talk meets its match"
       width="1983" height="793" style="width:100%; height:auto; display:block;">
</picture>

<div class="wrap">
  <div class="hero">
    <p class="sub">Challenge someone to 5 rounds. Send them the link. The crowd decides who wins.</p>
  </div>

  <div class="card" id="createCard">
    <p class="fight-card-label">Fight Card</p>

    <label for="leagueSelect">League</label>
    <select id="leagueSelect">
      <option value="nfl">NFL</option>
      <option value="nba">NBA</option>
      <option value="mlb">MLB</option>
      <option value="nhl">NHL</option>
      <option value="wnba">WNBA</option>
      <option value="ncaaf">NCAA Football</option>
      <option value="ncaab">NCAA Basketball</option>
      <option value="soccer">Soccer</option>
    </select>

    <label for="teamInput">Your team</label>
    <input id="teamInput" type="text" placeholder="ex. Cowboys">

    <div class="vs-divider">VS whoever's next</div>

    <label for="nameInput">Your name</label>
    <input id="nameInput" type="text" placeholder="ex. CowboysHater88" maxlength="40">

    <div id="createError" role="alert"></div>
    <button id="createBtn" class="btn btn-flare">Start a Smack Battle</button>
  </div>

  <div class="card" id="resultCard">
    <p class="result-title">Battle created</p>
    <p style="color:var(--chalk-dim); font-size:13px; margin-bottom:12px;">Send this link to whoever you're calling out:</p>
    <div class="link-box" id="battleLink"></div>
    <button id="copyLinkBtn" class="btn" style="background:transparent; border:1px solid var(--line-strong); color:var(--chalk); margin-bottom:12px;">Copy link</button>
    <button id="enterBtn" class="btn btn-flare">Enter your battle</button>
  </div>
</div>

<footer>
  <a href="/terms">Terms</a> &middot; <a href="/contact">Contact</a>
</footer>

<script>
let createdCode = null;

async function createBattle() {
  const league = document.getElementById('leagueSelect').value;
  const team = document.getElementById('teamInput').value.trim();
  const name = document.getElementById('nameInput').value.trim();
  const errorEl = document.getElementById('createError');
  const btn = document.getElementById('createBtn');

  errorEl.style.display = 'none';
  if (!team) {
    errorEl.textContent = 'Enter your team first.';
    errorEl.style.display = 'block';
    return;
  }
  if (!name) {
    errorEl.textContent = 'Enter your name first.';
    errorEl.style.display = 'block';
    return;
  }

  btn.disabled = true;
  btn.textContent = 'Creating...';

  try {
    const resp = await fetch('/api/battles', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({league: league, team_a: team, display_name_a: name})
    });
    const data = await resp.json();
    if (data.error) {
      errorEl.textContent = data.error;
      errorEl.style.display = 'block';
    } else {
      createdCode = data.challenge_code;
      localStorage.setItem(`battle_side_${createdCode}`, 'a');
      // Kick off sound effect generation now, in the background — by
      // the time the person actually reaches the battle room, these are
      // likely already generated/cached instead of adding to the wait
      // once they get there.
      fetch('/api/battle-sfx').catch(() => {});
      const url = `${window.location.origin}/battle/${createdCode}`;
      document.getElementById('battleLink').textContent = url;
      document.getElementById('createCard').style.display = 'none';
      document.getElementById('resultCard').style.display = 'block';
    }
  } catch (err) {
    errorEl.textContent = "Couldn't create the battle — try again.";
    errorEl.style.display = 'block';
  } finally {
    btn.disabled = false;
    btn.textContent = 'Start a Smack Battle';
  }
}

document.getElementById('createBtn').addEventListener('click', createBattle);
['teamInput', 'nameInput'].forEach(id => {
  document.getElementById(id).addEventListener('keydown', (e) => {
    if (e.key === 'Enter') {
      e.preventDefault();
      createBattle();
    }
  });
});

document.getElementById('enterBtn').addEventListener('click', () => {
  if (createdCode) window.location.href = `/battle/${createdCode}`;
});

document.getElementById('copyLinkBtn').addEventListener('click', async () => {
  const btn = document.getElementById('copyLinkBtn');
  const url = `${window.location.origin}/battle/${createdCode}`;
  try {
    await navigator.clipboard.writeText(url);
    btn.textContent = 'Copied!';
    setTimeout(() => { btn.textContent = 'Copy link'; }, 2000);
  } catch (err) {
    btn.textContent = 'Tap and hold the link above to copy';
  }
});
</script>
</body>
</html>
