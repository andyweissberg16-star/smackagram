<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Locked in — Smackagram</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#0D0D0D; --ink-2:#1A1A1A; --chalk:#F5F5F3; --chalk-dim:#9A9A96;
    --flare:#E8142C; --gold:#FFD400; --line:rgba(245,245,243,0.10);
  }
  nav{display:flex; justify-content:space-between; align-items:center; padding:20px 24px; border-bottom:1px solid var(--line);}
  .nav-links{display:flex; gap:32px; align-items:center; font-size:14px; color:var(--chalk-dim);}
  .auth-links{display:flex; gap:20px; align-items:center; font-size:14px; color:var(--chalk-dim);}
  @media(max-width:760px){
    nav{flex-wrap:wrap; gap:12px;}
    .nav-links{display:none;}
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{
    background:var(--ink); color:var(--chalk); font-family:'Inter',sans-serif;
    min-height:100vh;
  }
  .center-wrap{
    min-height:calc(100vh - 77px); display:flex; align-items:center; justify-content:center;
    text-align:center; padding:24px;
  }
  .halftone-bg{
    position:fixed; inset:0; z-index:0;
    background-image: radial-gradient(rgba(245,245,243,0.08) 1.5px, transparent 1.5px);
    background-size: 9px 9px;
  }
  .content{position:relative; z-index:1; max-width:480px;}
  .live-dot{
    display:inline-block; width:9px; height:9px; border-radius:50%; background:var(--flare);
    box-shadow:0 0 8px var(--flare); animation:pulse 1.3s ease-in-out infinite; margin-right:8px;
  }
  @keyframes pulse{0%,100%{opacity:1; transform:scale(1);} 50%{opacity:0.4; transform:scale(1.3);}}
  .eyebrow{
    color:var(--gold); font-family:'JetBrains Mono',monospace; font-size:12px; font-weight:700;
    letter-spacing:1px; text-transform:uppercase; margin-bottom:16px; text-shadow:0 0 8px rgba(255,212,0,0.6);
  }
  h1{font-family:'Anton',sans-serif; font-size:44px; margin-bottom:20px; text-transform:uppercase; text-shadow:3px 3px 0 var(--flare);}
  p{color:var(--chalk-dim); font-size:16px; margin-bottom:14px; line-height:1.6;}
  .cta-btn{
    display:inline-block; background:var(--flare); color:#fff; text-decoration:none;
    padding:12px 28px; font-weight:600; border-radius:2px; margin-top:16px;
    box-shadow:0 0 20px rgba(232,20,44,0.5), 4px 4px 0 var(--ink);
    border:2px solid #fff; outline:2px solid var(--ink); outline-offset:-1px;
    text-transform:uppercase; letter-spacing:0.5px; font-size:14px;
    transition:transform 0.12s ease;
  }
  .cta-btn:hover{transform:scale(1.04) rotate(-0.5deg);}
</style>
</head>
<body>
{% include '_nav.html' %}
<div class="center-wrap">
<div class="halftone-bg"></div>
<div class="content">
  <p class="eyebrow"><span class="live-dot"></span>Hold confirmed</p>
  <h1>Locked & Loaded.</h1>
  <p>Your card is authorized — nothing's charged yet. We're watching the game, and the second it's official, we'll either fire the call or release the hold automatically.</p>
  <p>No need to do anything else. We've got it from here.</p>
  <a href="/locked-n-loaded" class="cta-btn">Load another one</a>
</div>
</div>
</body>
</html>
