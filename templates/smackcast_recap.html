<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Smackcast — {{ subscription.league_name or "Fantasy League" }} Week {{ recap.week_number }}</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#0D0D0D; --ink-2:#1A1A1A; --chalk:#F5F5F3; --chalk-dim:#9A9A96;
    --flare:#E8142C; --gold:#FFD400; --line:rgba(245,245,243,0.10); --line-strong:rgba(245,245,243,0.24);
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{background:var(--ink); color:var(--chalk); font-family:'Inter',sans-serif; line-height:1.6; -webkit-font-smoothing:antialiased;}
  .wrap{max-width:640px; margin:0 auto; padding:0 24px 60px;}
  nav{display:flex; justify-content:space-between; align-items:center; padding:20px 24px; border-bottom:1px solid var(--line);}
  nav a{color:var(--chalk-dim); text-decoration:none; font-size:14px;}
  .hero{text-align:center; padding:36px 0 8px;}
  .hero p.label{font-family:'Anton',sans-serif; font-size:14px; color:var(--flare); text-transform:uppercase; letter-spacing:1px;}
  .hero h1{font-family:'Anton',sans-serif; font-size:28px; text-transform:uppercase; letter-spacing:0.5px; margin-top:6px;}
  .card{background:var(--ink-2); border:1px solid var(--line-strong); border-radius:6px; padding:28px; margin-top:24px;}
  audio{width:100%; margin-bottom:20px;}
  .script-text{font-size:15px; color:#DCDCD9; white-space:pre-wrap; line-height:1.7;}
  .footer-note{text-align:center; font-size:12px; color:var(--chalk-dim); margin-top:24px;}
  .footer-note a{color:var(--gold); text-decoration:none;}
</style>
</head>
<body>

<nav>
  <img src="{{ url_for('static', filename='logo.png') }}" alt="Smackagram" style="height:34px; width:auto;">
  <a href="/">smackagram.com</a>
</nav>

<div class="wrap">
  <div class="hero">
    <p class="label">Smackcast</p>
    <h1>{{ subscription.league_name or "Your League" }} — Week {{ recap.week_number }}</h1>
  </div>

  <div class="card">
    <audio controls preload="metadata" src="{{ recap.audio_url }}"></audio>
    {% if recap.meme_image_url %}
    <img src="{{ recap.meme_image_url }}" alt="Week {{ recap.week_number }} meme" style="width:100%; border-radius:4px; margin-bottom:20px;">
    {% endif %}
    <p class="script-text">{{ recap.script_text }}</p>
  </div>

  <p class="footer-note">Want this delivered automatically to your own league every week? <a href="/smackcast">Get Smackcast</a></p>
</div>

</body>
</html>
