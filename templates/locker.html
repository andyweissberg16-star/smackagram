<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Your Locker — Smackagram</title>
<link rel="stylesheet" href="{{ url_for('static', filename='css/smackagram.css') }}">
<style>
  /* Matched to the checkout page (reload.html): same tokens, same card
     treatment, same Anton display type - so the money pages and the account
     pages read as one product rather than two. */
  :root{
    --ink:#000000; --ink-2:#0C0C0C;
    --surface:#141414; --surface-2:#1C1C1C;
    --line:#3A1416; --punch:#E01B24; --amber:#FFB800;
    --ivory:#FFFFFF; --muted:#B5B0B0; --muted-2:#7A7575;
    --radius:14px;
  }
  *{box-sizing:border-box;}
  html,body{background:var(--ink); color:var(--ivory); font-family:'Inter',sans-serif; -webkit-font-smoothing:antialiased;}
  .wrap{max-width:760px; margin:0 auto; padding:30px 20px 60px;}

  .kicker{
    display:inline-flex; align-items:center; gap:8px;
    border:1px solid var(--line); background:var(--ink-2);
    padding:7px 14px; border-radius:999px; margin-bottom:16px;
    font-size:11px; font-weight:700; letter-spacing:.12em; text-transform:uppercase;
    color:var(--muted);
  }
  .kicker .pulse{width:7px; height:7px; border-radius:50%; background:var(--punch); animation:pulse 1.8s infinite;}
  @keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(224,27,36,.55)}70%{box-shadow:0 0 0 8px rgba(224,27,36,0)}}
  @media(prefers-reduced-motion:reduce){ .kicker .pulse{animation:none;} }

  h1{
    font-family:'Anton',sans-serif; font-weight:400; text-transform:uppercase;
    font-size:clamp(32px,6.5vw,54px); line-height:.96; letter-spacing:.5px; margin:0 0 10px;
  }
  h1 .hit{color:var(--punch);}
  .sub{color:var(--muted); font-size:15px; line-height:1.5; margin:0 0 26px;}

  .vault{
    background:linear-gradient(180deg,#1A0E0F,#120A0B);
    border:1.5px solid var(--line); border-radius:var(--radius);
    padding:24px 22px; margin-bottom:26px;
    display:flex; align-items:center; gap:18px; flex-wrap:wrap;
  }
  .vault-label{
    font-size:12px; font-weight:600; letter-spacing:.16em; text-transform:uppercase;
    color:var(--muted); margin:0 0 8px;
  }
  /* Smacks only, never a dollar figure - credits include free ones, so a
     money value would read as cash owed back rather than a product balance. */
  .vault-count{
    font-family:'Anton',sans-serif; font-size:56px; line-height:.9;
    letter-spacing:.5px; color:var(--ivory); margin:0;
  }
  .vault-spacer{flex:1;}
  .reload-btn{
    background:var(--punch); color:#fff; text-decoration:none;
    padding:14px 26px; border-radius:10px; font-weight:800;
    font-size:14px; letter-spacing:.04em; text-transform:uppercase;
    box-shadow:0 18px 40px -20px rgba(224,27,36,.6); display:inline-block;
  }
  .reload-btn:hover{filter:brightness(1.08);}

  .filters{display:flex; gap:8px; flex-wrap:wrap; margin-bottom:18px;}
  .filter{
    padding:7px 15px; border-radius:999px; border:1px solid var(--line);
    background:var(--ink-2); color:var(--muted); font-size:12px; cursor:pointer;
    font-family:'Inter',sans-serif; font-weight:600; letter-spacing:.04em;
  }
  .filter.on{background:var(--punch); border-color:var(--punch); color:#fff;}

  .item{
    background:var(--surface); border:1.5px solid var(--line);
    border-radius:var(--radius); padding:20px 22px; margin-bottom:14px;
    transition:transform .18s ease, border-color .18s ease;
  }
  .item:hover{transform:translateY(-2px); border-color:#5a1c20;}
  .item.locked{border-color:#3A2A08;}
  .item.locked:hover{border-color:#5a4413;}
  .item.pending{opacity:.9;}
  .item-top{display:flex; align-items:center; gap:11px; margin-bottom:10px; flex-wrap:wrap;}
  .tag{font-size:11px; font-weight:800; text-transform:uppercase; letter-spacing:.12em; padding:5px 12px; border-radius:999px;}
  .tag-smack{background:rgba(224,27,36,.12); border:1px solid rgba(224,27,36,.55); color:var(--punch);}
  .tag-fired{background:rgba(255,184,0,.12); border:1px solid rgba(255,184,0,.55); color:var(--amber);}
  .tag-armed{border:1px solid var(--amber); color:var(--amber);}
  .item-who{font-size:15px; color:var(--ivory); font-weight:700;}
  .item-when{font-size:12px; color:var(--muted-2); margin-left:auto;}
  .item-line{font-size:13.5px; color:var(--muted); font-style:italic; margin:0 0 4px; line-height:1.55;}
  .item-pending-note{font-size:13px; color:var(--muted-2); margin:0; line-height:1.5;}
  .item-divider{height:1px; background:var(--line); margin:14px 0;}
  .item-actions{display:flex; gap:9px; flex-wrap:wrap;}
  .act{
    display:inline-flex; align-items:center; gap:7px; padding:9px 16px;
    border-radius:10px; font-size:13px; font-weight:700; cursor:pointer;
    background:transparent; font-family:'Inter',sans-serif; text-decoration:none;
    letter-spacing:.03em;
  }
  .act-play{border:1.5px solid var(--punch); color:var(--punch);}
  .item.locked .act-play{border-color:var(--amber); color:var(--amber);}
  .act-quiet{border:1px solid var(--line); color:var(--muted);}
  .act:hover{filter:brightness(1.25);}

  .empty{
    background:var(--surface); border:1.5px solid var(--line);
    border-radius:var(--radius); padding:44px 24px; text-align:center;
  }
  .empty p{color:var(--muted); font-size:15px; margin:0 0 20px;}
  footer{text-align:center; padding:30px 20px; border-top:1px solid var(--line); margin-top:40px;}
  footer a{color:var(--muted-2); text-decoration:none; font-size:12px;}
</style>
</head>
<body>

{% include '_nav.html' %}

<div class="wrap">
  <span class="kicker"><span class="pulse"></span> The Smack Vault</span>
  <h1>Every smack <span class="hit">you&rsquo;ve sent</span></h1>
  <p class="sub">Smacky keeps receipts. So do you.</p>

  <div class="vault">
    <div>
      <p class="vault-label">Smacks in the vault</p>
      <p class="vault-count" id="balanceCount">&mdash;</p>
    </div>
    <span class="vault-spacer"></span>
    <a href="/reload" class="reload-btn">Reload</a>
  </div>


  <div class="filters" id="filters" hidden>
    <button class="filter on" data-filter="all" type="button">All</button>
    <button class="filter" data-filter="smackagram" type="button">Smackagrams</button>
    <button class="filter" data-filter="locked" type="button">Locked &amp; Loaded</button>
    <button class="filter" data-filter="pending" type="button">Armed</button>
  </div>

  <div id="list"></div>
  <audio id="player" style="display:none;"></audio>
</div>

<footer>
  <a href="/terms">Terms</a> &middot; <a href="/contact">Contact</a>
</footer>

<script>
(function () {
  var listEl = document.getElementById('list');
  var player = document.getElementById('player');
  var filterEl = document.getElementById('filters');
  var all = [];
  var active = 'all';

  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
    });
  }

  function when(iso) {
    if (!iso) return '';
    var d = new Date(iso);
    var today = new Date();
    var sameDay = d.toDateString() === today.toDateString();
    return sameDay
      ? 'Today, ' + d.toLocaleTimeString([], {hour:'numeric', minute:'2-digit'})
      : d.toLocaleDateString([], {month:'short', day:'numeric'}) + ', ' +
        d.toLocaleTimeString([], {hour:'numeric', minute:'2-digit'});
  }

  function tagFor(it) {
    if (it.pending) return '<span class="tag tag-armed">Armed</span>';
    if (it.kind === 'locked') return '<span class="tag tag-fired">Fired</span>';
    return '<span class="tag tag-smack">Smackagram</span>';
  }

  function render() {
    var rows = all.filter(function (it) {
      if (active === 'all') return true;
      if (active === 'pending') return it.pending;
      return it.kind === active && !it.pending;
    });

    if (!rows.length) {
      listEl.innerHTML = '<div class="empty"><p>Nothing in here yet. Go ruin somebody&rsquo;s week.</p>' +
        '<a href="/send-a-smack" class="reload-btn">Send a Smackagram</a></div>';
      return;
    }

    listEl.innerHTML = rows.map(function (it) {
      var who = esc(it.recipient || 'Someone');
      var sub = it.kind === 'locked'
        ? (it.team ? esc(it.team) + ' had to lose' : '')
        : '';
      var body = it.pending
        // Armed items genuinely have no audio - Smacky writes it after the
        // game - so say that rather than showing a dead play button.
        ? '<p class="item-pending-note">Waiting on the final. Smacky writes it once the game ends &mdash; nothing to hear yet.</p>'
        : (it.message ? '<p class="item-line">&ldquo;' + esc(it.message) + '&hellip;&rdquo;</p>' : '') +
          '<div class="item-divider"></div><div class="item-actions">' +
            (it.audio_url
              ? '<button class="act act-play" data-audio="' + esc(it.audio_url) + '" type="button">&#9654;&nbsp; ' + esc(it.audio_label) + '</button>' +
                '<a class="act act-quiet" href="/api/locker/download/' + esc(it.kind) + '/' + it.id + '">&#8595;&nbsp; Download</a>'
              : '') +
            (it.share_token
              ? '<button class="act act-quiet" type="button"' +
                ' data-smk-share="' + location.origin + '/smack/' + esc(it.share_token) + '"' +
                ' data-smk-title="' + esc(it.title || 'Somebody got Smacked') + '"' +
                ' data-smk-text="Listen to what Smacky said."' +
                (it.audio_url ? ' data-smk-audio="' + esc(it.audio_url) + '"' : '') +
                '>&#8599;&nbsp; Share</button>'
              : '') +
          '</div>';

      return '<div class="item ' + (it.kind === 'locked' ? 'locked ' : '') + (it.pending ? 'pending' : '') + '">' +
        '<div class="item-top">' + tagFor(it) +
          '<span class="item-who">' + who + (sub ? ' &middot; ' + sub : '') + '</span>' +
          '<span class="item-when">' + when(it.created_at) + '</span>' +
        '</div>' + body + '</div>';
    }).join('');
  }

  listEl.addEventListener('click', function (e) {
    var play = e.target.closest('[data-audio]');
    if (play) {
      player.src = play.dataset.audio;
      player.play();
      return;
    }
    var share = e.target.closest('[data-share]');
    if (share) {
      var url = location.origin + share.dataset.share;
      // Native share sheet on mobile, clipboard everywhere else. The social
      // buttons coming later hang off this same URL.
      if (navigator.share) {
        navigator.share({title: 'Listen to this Smackagram', url: url}).catch(function () {});
      } else {
        navigator.clipboard.writeText(url).then(function () {
          share.textContent = '✓  Link copied';
          setTimeout(function () { share.innerHTML = '&#8599;&nbsp; Share'; }, 1800);
        });
      }
    }
  });

  filterEl.addEventListener('click', function (e) {
    var b = e.target.closest('[data-filter]');
    if (!b) return;
    active = b.dataset.filter;
    filterEl.querySelectorAll('.filter').forEach(function (f) { f.classList.toggle('on', f === b); });
    render();
  });

  fetch('/api/locker').then(function (r) { return r.json(); }).then(function (d) {
    document.getElementById('balanceCount').textContent = d.balance_smacks;
    all = d.items || [];
    // Filters are clutter with a handful of items - only worth showing once
    // there's enough here to actually need narrowing down.
    filterEl.hidden = all.length < 8;
    render();
  }).catch(function () {
    listEl.innerHTML = '<div class="empty"><p>Couldn&rsquo;t load your locker just now. Refresh and try again.</p></div>';
  });
})();
</script>

<script src="{{ url_for('static', filename='js/share.js') }}"></script>
</body>
</html>
