<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Your Locker — Smackagram</title>
<link rel="stylesheet" href="{{ url_for('static', filename='css/smackagram.css') }}">
<style>
  :root{
    --surface:#141414; --surface-2:#1C1C1C; --hairline:#3A1416;
    --punch:#E01B24; --amber:#FFB800; --muted:#B5B0B0; --muted-2:#7A7575;
    --radius:14px;
  }
  body{background:var(--ink); color:var(--chalk); font-family:'Inter',sans-serif; line-height:1.5;}
  .wrap{max-width:760px; margin:0 auto; padding:28px 20px 60px;}

  .vault-head{
    background:var(--surface-2); border:2px solid var(--hairline);
    border-radius:var(--radius); padding:20px; margin-bottom:22px;
    display:flex; align-items:center; gap:16px; flex-wrap:wrap;
  }
  .vault-label{
    font-family:'JetBrains Mono',monospace; font-size:9px; letter-spacing:2.5px;
    text-transform:uppercase; color:var(--muted-2); margin:0 0 6px;
  }
  /* Smacks only, never a dollar figure. Credits include free ones, so a
     money value would imply cash owed back rather than a product balance. */
  .vault-count{font-size:44px; font-weight:600; color:var(--punch); margin:0; line-height:1;}
  .vault-spacer{flex:1;}

  .locker-title{font-family:'Anton',sans-serif; font-size:clamp(24px,6vw,34px); text-transform:uppercase; margin:0 0 4px;}
  .locker-sub{font-size:13px; color:var(--muted); margin:0 0 20px;}

  .filters{display:flex; gap:7px; flex-wrap:wrap; margin-bottom:18px;}
  .filter{
    padding:5px 13px; border-radius:20px; border:1px solid var(--hairline);
    color:var(--muted); font-size:11.5px; cursor:pointer; background:transparent;
    font-family:'Inter',sans-serif;
  }
  .filter.on{background:var(--punch); border-color:var(--punch); color:#fff; font-weight:600;}

  .item{
    background:var(--surface); border:1.5px solid var(--hairline);
    border-radius:var(--radius); padding:16px 18px; margin-bottom:12px;
  }
  .item.locked{border-color:#3A2A08;}
  .item.pending{opacity:0.85;}
  .item-top{display:flex; align-items:center; gap:10px; margin-bottom:9px; flex-wrap:wrap;}
  .tag{
    padding:3px 9px; border-radius:4px; font-family:'JetBrains Mono',monospace;
    font-size:9px; letter-spacing:1.5px; text-transform:uppercase;
  }
  .tag-smack{background:rgba(224,27,36,0.15); color:var(--punch);}
  .tag-fired{background:rgba(255,184,0,0.15); color:var(--amber);}
  .tag-armed{border:1px solid var(--amber); color:var(--amber);}
  .item-who{font-size:14.5px; color:#fff; font-weight:600;}
  .item-when{font-size:11px; color:var(--muted-2); margin-left:auto;}
  .item-line{font-size:12.5px; color:var(--muted); font-style:italic; margin:0 0 12px; line-height:1.5;}
  .item-pending-note{font-size:12px; color:var(--muted-2); margin:0; line-height:1.5;}

  .item-actions{display:flex; gap:8px; flex-wrap:wrap;}
  .act{
    display:inline-flex; align-items:center; gap:6px; padding:7px 13px;
    border-radius:8px; font-size:12px; font-weight:500; cursor:pointer;
    background:transparent; font-family:'Inter',sans-serif;
  }
  .act-play{border:1.5px solid var(--punch); color:var(--punch);}
  .item.locked .act-play{border-color:var(--amber); color:var(--amber);}
  .act-quiet{border:1px solid var(--hairline); color:var(--muted);}
  .act:hover{filter:brightness(1.2);}

  .empty{
    background:var(--surface); border:1.5px solid var(--hairline);
    border-radius:var(--radius); padding:34px 22px; text-align:center;
  }
  .empty p{color:var(--muted); font-size:14px; margin:0 0 16px;}
  footer{text-align:center; padding:28px 20px; border-top:1px solid var(--line); margin-top:36px;}
  footer a{color:var(--chalk-dim); text-decoration:none; font-size:12px;}
</style>
</head>
<body>

{% include '_nav.html' %}

<div class="wrap">
  <div class="vault-head">
    <div>
      <p class="vault-label">Smacks in the vault</p>
      <p class="vault-count" id="balanceCount">—</p>
    </div>
    <span class="vault-spacer"></span>
    <a href="/reload" class="btn btn-flare" style="text-decoration:none; padding:11px 20px;">Reload</a>
  </div>

  <h1 class="locker-title">Every smack you've sent</h1>
  <p class="locker-sub">Smacky keeps receipts. So do you.</p>

  <div class="filters" id="filters" hidden>
    <button class="filter on" data-filter="all" type="button">All</button>
    <button class="filter" data-filter="smackagram" type="button">Smackagrams</button>
    <button class="filter" data-filter="locked" type="button">Locked &amp; Loaded</button>
    <button class="filter" data-filter="pending" type="button">Armed</button>
  </div>

  <div id="list"></div>
  <audio id="player" style="display:none;"></audio>
</div>

<footer>
  <a href="/terms">Terms</a> &middot; <a href="/contact">Contact</a>
</footer>

<script>
(function () {
  var listEl = document.getElementById('list');
  var player = document.getElementById('player');
  var filterEl = document.getElementById('filters');
  var all = [];
  var active = 'all';

  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
    });
  }

  function when(iso) {
    if (!iso) return '';
    var d = new Date(iso);
    var today = new Date();
    var sameDay = d.toDateString() === today.toDateString();
    return sameDay
      ? 'Today, ' + d.toLocaleTimeString([], {hour:'numeric', minute:'2-digit'})
      : d.toLocaleDateString([], {month:'short', day:'numeric'}) + ', ' +
        d.toLocaleTimeString([], {hour:'numeric', minute:'2-digit'});
  }

  function tagFor(it) {
    if (it.pending) return '<span class="tag tag-armed">Armed</span>';
    if (it.kind === 'locked') return '<span class="tag tag-fired">Fired</span>';
    return '<span class="tag tag-smack">Smackagram</span>';
  }

  function render() {
    var rows = all.filter(function (it) {
      if (active === 'all') return true;
      if (active === 'pending') return it.pending;
      return it.kind === active && !it.pending;
    });

    if (!rows.length) {
      listEl.innerHTML = '<div class="empty"><p>Nothing in here yet. Go ruin somebody&rsquo;s week.</p>' +
        '<a href="/send-a-smack" class="btn btn-flare" style="text-decoration:none; padding:12px 24px;">Send a Smackagram</a></div>';
      return;
    }

    listEl.innerHTML = rows.map(function (it) {
      var who = esc(it.recipient || 'Someone');
      var sub = it.kind === 'locked'
        ? (it.team ? esc(it.team) + ' had to lose' : '')
        : '';
      var body = it.pending
        // Armed items genuinely have no audio - Smacky writes it after the
        // game - so say that rather than showing a dead play button.
        ? '<p class="item-pending-note">Waiting on the final. Smacky writes it once the game ends &mdash; nothing to hear yet.</p>'
        : (it.message ? '<p class="item-line">&ldquo;' + esc(it.message) + '&hellip;&rdquo;</p>' : '') +
          '<div class="item-actions">' +
            (it.audio_url
              ? '<button class="act act-play" data-audio="' + esc(it.audio_url) + '" type="button">&#9654;&nbsp; ' + esc(it.audio_label) + '</button>' +
                '<a class="act act-quiet" href="/api/locker/download/' + esc(it.kind) + '/' + it.id + '">&#8595;&nbsp; Download</a>'
              : '') +
            (it.share_token
              ? '<button class="act act-quiet" data-share="/smack/' + esc(it.share_token) + '" type="button">&#8599;&nbsp; Share</button>'
              : '') +
          '</div>';

      return '<div class="item ' + (it.kind === 'locked' ? 'locked ' : '') + (it.pending ? 'pending' : '') + '">' +
        '<div class="item-top">' + tagFor(it) +
          '<span class="item-who">' + who + (sub ? ' &middot; ' + sub : '') + '</span>' +
          '<span class="item-when">' + when(it.created_at) + '</span>' +
        '</div>' + body + '</div>';
    }).join('');
  }

  listEl.addEventListener('click', function (e) {
    var play = e.target.closest('[data-audio]');
    if (play) {
      player.src = play.dataset.audio;
      player.play();
      return;
    }
    var share = e.target.closest('[data-share]');
    if (share) {
      var url = location.origin + share.dataset.share;
      // Native share sheet on mobile, clipboard everywhere else. The social
      // buttons coming later hang off this same URL.
      if (navigator.share) {
        navigator.share({title: 'Listen to this Smackagram', url: url}).catch(function () {});
      } else {
        navigator.clipboard.writeText(url).then(function () {
          share.textContent = '✓  Link copied';
          setTimeout(function () { share.innerHTML = '&#8599;&nbsp; Share'; }, 1800);
        });
      }
    }
  });

  filterEl.addEventListener('click', function (e) {
    var b = e.target.closest('[data-filter]');
    if (!b) return;
    active = b.dataset.filter;
    filterEl.querySelectorAll('.filter').forEach(function (f) { f.classList.toggle('on', f === b); });
    render();
  });

  fetch('/api/locker').then(function (r) { return r.json(); }).then(function (d) {
    document.getElementById('balanceCount').textContent = d.balance_smacks;
    all = d.items || [];
    // Filters are clutter with a handful of items - only worth showing once
    // there's enough here to actually need narrowing down.
    filterEl.hidden = all.length < 8;
    render();
  }).catch(function () {
    listEl.innerHTML = '<div class="empty"><p>Couldn&rsquo;t load your locker just now. Refresh and try again.</p></div>';
  });
})();
</script>

</body>
</html>
