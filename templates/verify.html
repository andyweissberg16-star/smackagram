<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<meta name="description" content="Verify your phone number.">
<meta name="robots" content="noindex">

<meta property="og:site_name" content="Smackagram">
<meta property="og:title" content="Verify your phone — Smackagram">
<meta property="og:description" content="Verify your phone number.">

<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:url" content="{{ request.base_url }}">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="Verify your phone — Smackagram">
<meta name="twitter:description" content="Verify your phone number.">
<meta name="twitter:image" content="{{ url_for('static', filename='img/og-default.jpg', _external=True) }}">
<link rel="icon" type="image/png" sizes="32x32" href="{{ url_for('static', filename='img/favicon-32.png') }}">
<link rel="apple-touch-icon" href="{{ url_for('static', filename='img/apple-touch-icon.png') }}">
<meta name="theme-color" content="#0D0D0D">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{{ url_for('static', filename='css/smackagram.css') }}">
<style>
  :root{
    --ink:#0D0D0D; --ink-2:#1A1A1A; --chalk:#F5F5F3; --chalk-dim:#9A9A96;
    --flare:#E8142C; --gold:#FFD400; --line:rgba(245,245,243,0.10); --line-strong:rgba(245,245,243,0.24);
  }
  body{background:var(--ink); color:var(--chalk); font-family:'Inter',sans-serif; line-height:1.5; -webkit-font-smoothing:antialiased;}
  .wrap{max-width:420px; margin:0 auto; padding:0 24px 60px;}
  nav a{color:var(--chalk-dim); text-decoration:none; font-size:14px;}
  .hero{text-align:center; padding:36px 0 8px;}
  .hero h1{font-family:'Anton',sans-serif; font-size:var(--h1-form); text-transform:uppercase; letter-spacing:0.5px;}
  .hero p{color:var(--chalk-dim); font-size:13px; margin-top:8px;}
  .card{background:var(--ink-2); border:1px solid var(--line-strong); border-radius:6px; padding:28px; margin-top:24px;}
  label{display:block; font-size:var(--fs-sm); color:var(--chalk-dim); text-transform:uppercase; letter-spacing:0.5px; margin-bottom:6px;}
  input[type=text]{
    width:100%; background:var(--ink); border:1px solid var(--line-strong); color:var(--chalk);
    padding:14px; font-family:'JetBrains Mono',monospace; font-size:22px; text-align:center; letter-spacing:6px;
    border-radius:4px; margin-bottom:14px;
  }
  input:focus{outline:none; border-color:var(--flare);}
  .btn{font-weight:700; font-size:14px; padding:14px 24px; border-radius:4px; border:none; cursor:pointer; text-transform:uppercase; letter-spacing:0.5px; width:100%;}
  .btn-flare{background:var(--flare); color:#fff; box-shadow:0 0 20px rgba(232,20,44,0.4);}
  .btn-flare:disabled{opacity:0.5; cursor:not-allowed;}
  #formError{display:none; color:var(--flare-text); font-size:12px; margin-bottom:12px;}
  .resend-link{text-align:center; font-size:13px; color:var(--chalk-dim); margin-top:18px;}
  .resend-link a{color:var(--gold); text-decoration:none; cursor:pointer;}
</style>
</head>
<body>

{% include '_nav.html' %}

<div class="wrap">
  <div class="hero">
    <h1>Verify Your Phone</h1>
    <p>We texted a 6-digit code to the phone number on your account.</p>
  </div>

  <div class="card">
    <label for="codeInput">Verification Code</label>
    <input id="codeInput" type="text" inputmode="numeric" maxlength="6" placeholder="000000">

    <div id="formError" role="alert"></div>
    <button id="verifyBtn" class="btn btn-flare">Verify</button>
    <p class="resend-link">Didn't get it? <a id="resendLink">Send a new code</a></p>
  </div>
</div>

<script>
function getNextParam() {
  return new URLSearchParams(window.location.search).get('next') || '/';
}

async function submitCode() {
  const errorEl = document.getElementById('formError');
  const btn = document.getElementById('verifyBtn');
  errorEl.style.display = 'none';

  const code = document.getElementById('codeInput').value.trim();
  if (!code) {
    errorEl.textContent = 'Enter the code we texted you.';
    smkInvalid(document.getElementById('codeInput'));
    errorEl.style.display = 'block';
    return;
  }

  btn.disabled = true;
  btn.textContent = 'Verifying...';

  try {
    const resp = await fetch('/api/verify-2fa', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({code: code})
    });
    const data = await resp.json();
    if (data.error) {
      errorEl.textContent = data.error;
      errorEl.style.display = 'block';
      btn.disabled = false;
      btn.textContent = 'Verify';
    } else {
      window.location.href = getNextParam();
    }
  } catch (err) {
    errorEl.textContent = "Couldn't verify — try again.";
    errorEl.style.display = 'block';
    btn.disabled = false;
    btn.textContent = 'Verify';
  }
}

document.getElementById('verifyBtn').addEventListener('click', submitCode);
document.getElementById('codeInput').addEventListener('keydown', (e) => {
  if (e.key === 'Enter') {
    e.preventDefault();
    submitCode();
  }
});

document.getElementById('resendLink').addEventListener('click', async (e) => {
  const link = e.target;
  const errorEl = document.getElementById('formError');
  errorEl.style.display = 'none';
  link.textContent = 'Sending...';
  try {
    const resp = await fetch('/api/resend-2fa', {method: 'POST'});
    const data = await resp.json();
    if (data.error) {
      errorEl.textContent = data.error;
      errorEl.style.display = 'block';
      link.textContent = 'Send a new code';
    } else {
      link.textContent = 'Code sent!';
      setTimeout(() => { link.textContent = 'Send a new code'; }, 3000);
    }
  } catch (err) {
    link.textContent = 'Send a new code';
  }
});
</script>
{% include '_footer.html' %}
</body>
</html>
