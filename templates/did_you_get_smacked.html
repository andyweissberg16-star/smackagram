<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Smack Inbox — Smackagram</title>
<meta name="description" content="Check whether someone sent you a Smackagram — then fire one straight back at them.">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Smackagram">
<meta property="og:title" content="Did You Get Smacked?">
<meta property="og:description" content="Check whether someone sent you a Smackagram — then fire one straight back at them.">
<meta property="og:image" content="{{ url_for('static', filename='img/og-default.jpg', _external=True) }}">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:url" content="{{ request.base_url }}">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="Did You Get Smacked?">
<meta name="twitter:description" content="Check whether someone sent you a Smackagram — then fire one straight back at them.">
<meta name="twitter:image" content="{{ url_for('static', filename='img/og-default.jpg', _external=True) }}">
<link rel="icon" type="image/png" sizes="32x32" href="{{ url_for('static', filename='img/favicon-32.png') }}">
<link rel="apple-touch-icon" href="{{ url_for('static', filename='img/apple-touch-icon.png') }}">
<meta name="theme-color" content="#0D0D0D">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{{ url_for('static', filename='css/smackagram.css') }}">
<style>
  :root{
    --ink:#0D0D0D;
    --ink-2:#1A1A1A;
    --chalk:#F5F5F3;
    --chalk-dim:#9A9A96;
    --flare:#E8142C;
    --gold:#FFD400;
    --line:rgba(245,245,243,0.10);
    --line-strong:rgba(245,245,243,0.24);
  }
  body{background:var(--ink); color:var(--chalk); font-family:'Inter',sans-serif; line-height:1.5; -webkit-font-smoothing:antialiased;}
  .wrap{max-width:560px; margin:0 auto; padding:0 24px 60px;}
  nav a.back-link{color:var(--chalk-dim); text-decoration:none; font-size:14px;}
  nav a.back-link:hover{color:var(--flare);}

  .hero{text-align:center; padding:44px 0 20px;}
  h1{font-family:'Anton',sans-serif; font-size:var(--h1-page); text-transform:uppercase; letter-spacing:0.5px; line-height:1.1;}
  h1 span{color:var(--flare); text-shadow:0 0 24px rgba(232,20,44,0.5);}
  .sub{color:var(--chalk-dim); font-size:14px; margin-top:8px;}

  .card{
    background:var(--ink-2); border:1px solid var(--line-strong); border-radius:8px; padding:28px; margin-top:16px;
  }
  label{display:block; font-size:12px; color:var(--chalk-dim); text-transform:uppercase; letter-spacing:0.5px; margin-bottom:8px;}
  input[type=tel]{
    width:100%; background:var(--ink); border:1px solid var(--line-strong); color:var(--chalk);
    padding:14px 16px; font-family:'Inter',sans-serif; font-size:15px; border-radius:4px; margin-bottom:16px;
  }
  input:focus{outline:none; border-color:var(--flare);}

  .btn{
    font-weight:700; font-size:14px; padding:16px 24px; border-radius:4px; border:none; cursor:pointer;
    text-transform:uppercase; letter-spacing:0.5px; width:100%; transition:transform 0.12s ease;
    background:var(--flare); color:#fff; box-shadow:0 0 20px rgba(232,20,44,0.4);
  }
  .btn:hover{transform:translateY(-1px);}
  .btn:disabled{opacity:0.5; cursor:not-allowed; transform:none;}

  #inboxArea{display:none; margin-top:24px;}
  .empty-note{color:var(--chalk-dim); font-size:14px; text-align:center; padding:20px 0;}

  .inbox-item{
    display:block; background:var(--ink-2); border:1px solid var(--line-strong); border-radius:8px;
    padding:18px 20px; margin-bottom:12px; text-decoration:none; color:inherit; transition:border-color 0.15s ease;
  }
  .inbox-item:hover{border-color:var(--flare);}
  .inbox-item.unreplied{border-left:3px solid var(--gold);}
  .inbox-item.replied{border-left:3px solid var(--chalk-dim);}
  .item-top{display:flex; justify-content:space-between; align-items:center; margin-bottom:8px;}
  .badge{
    font-family:'JetBrains Mono',monospace; font-size:10px; font-weight:700; text-transform:uppercase;
    letter-spacing:0.5px; padding:3px 10px; border-radius:20px;
  }
  .badge.new{background:var(--gold); color:var(--ink);}
  .badge.replied{background:transparent; border:1px solid var(--line-strong); color:var(--chalk-dim);}
  .item-date{font-size:11px; color:var(--chalk-dim);}
  .item-preview{font-size:14px; color:#DCDCD9; font-style:italic;}
  .item-action{font-size:12px; color:var(--gold); margin-top:8px; font-weight:600;}

  /* Teaser cards - shown when a match exists but the searcher hasn't
     proven they own the number. Blurred fake text makes it look like
     there's genuinely something there without leaking real content. */
  .inbox-item.locked{position:relative; overflow:hidden; cursor:default;}
  .inbox-item.locked .item-preview{filter:blur(5px); user-select:none; pointer-events:none;}
  .lock-icon{font-size:18px; margin-right:6px;}

  .verify-card{
    background:var(--ink-2); border:1px solid var(--flare); border-radius:8px;
    padding:24px; margin-top:8px; text-align:center;
  }
  .verify-card h3{font-family:'Anton',sans-serif; font-size:20px; text-transform:uppercase; margin-bottom:8px;}
  .verify-card p{color:var(--chalk-dim); font-size:14px; margin-bottom:16px;}
  .verify-card input[type=text]{
    width:100%; background:var(--ink); border:1px solid var(--line-strong); color:var(--chalk);
    padding:14px 16px; font-family:'JetBrains Mono',monospace; font-size:20px; text-align:center;
    letter-spacing:6px; border-radius:4px; margin-bottom:12px;
  }
  .verify-card input[type=text]:focus{outline:none; border-color:var(--flare);}
  .verify-note{font-size:12px; color:var(--chalk-dim); margin-top:12px;}
  .verify-note a{color:var(--gold); text-decoration:none; cursor:pointer;}
  .verify-error{color:var(--flare); font-size:13px; margin-top:10px; display:none;}

  footer{padding:32px 24px; text-align:center; font-size:12px; color:var(--chalk-dim); border-top:1px solid var(--line); margin-top:40px;}
  footer a{color:var(--chalk-dim); text-decoration:none;}
  footer a:hover{color:var(--flare);}
</style>
</head>
<body>

{% include '_nav.html' %}

<div class="wrap">
  <div class="hero">
    <h1>Smack <span>Inbox</span></h1>
    <p class="sub">Enter your number to see every smack you've ever gotten — and hit back on the ones still open.</p>
  </div>

  <div class="card" id="lookupCard">
    <label for="phoneInput">Your phone number</label>
    <input id="phoneInput" type="tel" placeholder="+1 555 555 5555">
    <button id="checkBtn" class="btn">Check my inbox</button>
  </div>

  <div id="inboxArea">
    <!-- filled in by JS -->
  </div>
</div>

<footer>
  <a href="/terms">Terms</a> &middot; <a href="/contact">Contact</a>
</footer>

<script>
const isLoggedIn = {{ 'true' if current_user else 'false' }};
let lastSearchedPhone = '';

document.getElementById('checkBtn').addEventListener('click', async () => {
  const phone = document.getElementById('phoneInput').value.trim();
  const btn = document.getElementById('checkBtn');
  if (!phone) return;
  lastSearchedPhone = phone;

  btn.textContent = 'Checking...';
  btn.disabled = true;

  try {
    const resp = await fetch('/api/check-if-smacked', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({phone: phone})
    });
    const data = await resp.json();
    showInbox(data, phone);
  } catch (err) {
    showInbox({found: false, items: []});
  } finally {
    btn.textContent = 'Check my inbox';
    btn.disabled = false;
  }
});

function formatDate(isoString) {
  const d = new Date(isoString);
  return d.toLocaleDateString('en-US', {month: 'short', day: 'numeric', year: 'numeric'});
}

function showInbox(data, phone) {
  const inboxArea = document.getElementById('inboxArea');
  inboxArea.style.display = 'block';

  if (!data.found) {
    inboxArea.innerHTML = `
      <p class="empty-note">Nothing found for that number — could've come from a different number, or maybe you're just in the clear.</p>
      <a href="/send-a-smack" class="btn" style="display:block; text-align:center; text-decoration:none;">Send one yourself instead</a>
    `;
    return;
  }

  if (!data.verified) {
    showTeaser(data.count, phone);
    return;
  }

  let html = '';
  data.items.forEach(item => {
    const dateStr = formatDate(item.created_at);
    const preview = item.preview ? (item.preview.length >= 90 ? item.preview + '...' : item.preview) : 'No preview available';

    if (item.replied) {
      html += `
        <a href="/conversation/${item.conversation_id}" class="inbox-item replied">
          <div class="item-top">
            <span class="badge replied">Replied</span>
            <span class="item-date">${dateStr}</span>
          </div>
          <p class="item-preview">${escapeHtml(preview)}</p>
          <p class="item-action">View the full exchange &rarr;</p>
        </a>
      `;
    } else if (item.reply_token) {
      html += `
        <a href="/reply/${item.reply_token}" class="inbox-item unreplied">
          <div class="item-top">
            <span class="badge new">New</span>
            <span class="item-date">${dateStr}</span>
          </div>
          <p class="item-preview">${escapeHtml(preview)}</p>
          <p class="item-action">Reply now &rarr;</p>
        </a>
      `;
    } else {
      html += `
        <div class="inbox-item unreplied" style="cursor:default;">
          <div class="item-top">
            <span class="badge new">New</span>
            <span class="item-date">${dateStr}</span>
          </div>
          <p class="item-preview">${escapeHtml(preview)}</p>
          <p class="item-action" style="color:var(--chalk-dim);">No reply available — send your own instead</p>
        </div>
      `;
    }
  });
  inboxArea.innerHTML = html;
}

// Shows blurred, fake-content teaser cards (enough to look like there's
// genuinely something there) plus a prompt to log in/sign up and prove
// ownership of the number before any real content is revealed.
function showTeaser(count, phone) {
  const inboxArea = document.getElementById('inboxArea');
  let teaserCards = '';
  for (let i = 0; i < count; i++) {
    teaserCards += `
      <div class="inbox-item locked unreplied">
        <div class="item-top">
          <span class="badge new"><span class="lock-icon">&#128274;</span>New</span>
        </div>
        <p class="item-preview">Someone sent a smack to this number — a message is waiting here for whoever it belongs to.</p>
      </div>
    `;
  }

  let ctaHtml;
  if (isLoggedIn) {
    ctaHtml = `
      <div class="verify-card" id="verifyCard">
        <h3>Prove it's your number</h3>
        <p>We'll text a 6-digit code to ${escapeHtml(phone)} — enter it here to unlock the message${count > 1 ? 's' : ''}.</p>
        <button class="btn" id="sendCodeBtn">Text me a code</button>
      </div>
    `;
  } else {
    const returnTo = encodeURIComponent('/did-you-get-smacked');
    ctaHtml = `
      <div class="verify-card">
        <h3>Is this you?</h3>
        <p>Log in or create a free account and verify this number to see what was sent.</p>
        <a href="/login?next=${returnTo}" class="btn" style="display:block; text-decoration:none; margin-bottom:10px;">Log In</a>
        <a href="/register?next=${returnTo}" class="btn" style="display:block; text-decoration:none; background:transparent; border:1px solid var(--line-strong); box-shadow:none;">Sign Up</a>
      </div>
    `;
  }

  inboxArea.innerHTML = teaserCards + ctaHtml;

  if (isLoggedIn) {
    document.getElementById('sendCodeBtn').addEventListener('click', () => sendVerificationCode(phone));
  }
}

async function sendVerificationCode(phone) {
  const btn = document.getElementById('sendCodeBtn');
  btn.textContent = 'Sending...';
  btn.disabled = true;

  try {
    const resp = await fetch('/api/verify-phone/send', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({phone: phone})
    });
    const data = await resp.json();
    if (data.error) {
      btn.textContent = 'Text me a code';
      btn.disabled = false;
      alert(data.error);
      return;
    }
    showCodeEntry(phone);
  } catch (err) {
    btn.textContent = 'Text me a code';
    btn.disabled = false;
    alert('Something went wrong sending the code — try again.');
  }
}

function showCodeEntry(phone) {
  const card = document.getElementById('verifyCard');
  card.innerHTML = `
    <h3>Enter your code</h3>
    <p>We just texted a 6-digit code to ${escapeHtml(phone)}.</p>
    <input type="text" id="codeInput" maxlength="6" inputmode="numeric" placeholder="000000">
    <button class="btn" id="confirmCodeBtn">Unlock</button>
    <p class="verify-error" id="verifyError"></p>
    <p class="verify-note">Didn't get it? <a id="resendLink">Send again</a></p>
  `;
  document.getElementById('confirmCodeBtn').addEventListener('click', () => confirmVerificationCode(phone));
  document.getElementById('resendLink').addEventListener('click', () => sendVerificationCode(phone));
  document.getElementById('codeInput').addEventListener('keydown', (e) => {
    if (e.key === 'Enter') confirmVerificationCode(phone);
  });
  document.getElementById('codeInput').focus();
}

async function confirmVerificationCode(phone) {
  const code = document.getElementById('codeInput').value.trim();
  const btn = document.getElementById('confirmCodeBtn');
  const errorEl = document.getElementById('verifyError');
  errorEl.style.display = 'none';
  btn.textContent = 'Checking...';
  btn.disabled = true;

  try {
    const resp = await fetch('/api/verify-phone/confirm', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({phone: phone, code: code})
    });
    const data = await resp.json();
    if (data.error) {
      errorEl.textContent = data.error;
      errorEl.style.display = 'block';
      btn.textContent = 'Unlock';
      btn.disabled = false;
      return;
    }
    // Verified - re-run the search so the real content now unlocks.
    document.getElementById('checkBtn').click();
  } catch (err) {
    errorEl.textContent = 'Something went wrong — try again.';
    errorEl.style.display = 'block';
    btn.textContent = 'Unlock';
    btn.disabled = false;
  }
}

function escapeHtml(str) {
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

document.getElementById('phoneInput').addEventListener('keydown', (e) => {
  if (e.key === 'Enter') document.getElementById('checkBtn').click();
});
</script>
</body>
</html>
