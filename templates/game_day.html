<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Game Day Smack</title>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;600&family=JetBrains+Mono:wght@700&display=swap" rel="stylesheet">
<style>
  :root{--flare:#E01B24; --chalk:#F5F5F3; --dim:#9A9A96;}
  *{box-sizing:border-box; margin:0;}
  body{background:#0A0A0B; color:var(--chalk); font-family:'Inter',sans-serif;
       min-height:100vh; display:flex; flex-direction:column; align-items:center;}
  .wrap{width:min(720px, 94vw); padding:34px 0 60px;}
  .crumb{font-family:'JetBrains Mono',monospace; font-size:12px;
         letter-spacing:2px; color:var(--flare); margin-bottom:14px;}
  .crumb a{color:var(--dim); text-decoration:none;}
  /* THE HERO IS THE LOSS. The page is themed around one fact. */
  .hero{border:2px solid var(--flare); border-radius:16px; padding:26px 26px 22px;
        background:linear-gradient(135deg, rgba(224,27,36,0.18), rgba(0,0,0,0.5));
        box-shadow:0 0 34px rgba(224,27,36,0.35);}
  .hero .kicker{font-family:'Anton',sans-serif; letter-spacing:3px;
        font-size:14px; color:var(--flare);}
  .hero h1{font-family:'Anton',sans-serif; font-size:clamp(34px,7vw,58px);
        line-height:1.05; margin:6px 0 4px; text-transform:uppercase;}
  .hero h1 .score{color:var(--flare);}
  .hero .sub{color:#C9CDD2; font-size:15px;}
  .card{margin-top:22px; border:2px solid var(--flare); border-radius:14px;
        padding:22px; background:#121214;}
  .card label{display:block; font-size:13px; color:var(--dim); margin:14px 0 6px;}
  .meter{display:flex; gap:8px; margin-top:4px;}
  .meter button{flex:1; padding:11px 4px; border-radius:8px; cursor:pointer;
      border:1px solid #3A3D42; background:#0E0E10; color:var(--dim);
      font-family:'Anton',sans-serif; font-size:13px; letter-spacing:0.5px;}
  .meter button.on{border-color:var(--flare); color:#fff;
      background:rgba(224,27,36,0.22);
      box-shadow:0 0 10px rgba(224,27,36,0.35);}
  .consent-row{display:flex; gap:11px; align-items:flex-start;
      margin-top:14px; font-size:13.5px; color:#C9CDD2; cursor:pointer;
      line-height:1.45;}
  .consent-row input{width:20px; height:20px; accent-color:var(--flare);
      flex:none; margin-top:1px;}
  .card select{width:100%; padding:12px 14px; border-radius:8px;
        font-size:15px; border:1px solid #3A3D42; background:#0E0E10;
        color:var(--chalk); margin-top:2px;}
  .card input{width:100%; padding:12px 14px; border-radius:8px; font-size:15px;
        border:none; background:#FFFFFF; color:#1A1A1A;}
  .card input::placeholder{color:#8A8A8A;}
  .gen{margin-top:18px; width:100%; padding:15px; border:none; border-radius:10px;
        background:var(--flare); color:#fff; font-family:'Anton',sans-serif;
        font-size:18px; letter-spacing:1.5px; cursor:pointer;}
  .gen:hover{background:#c4101f;}
  .out{margin-top:16px; min-height:96px; border:1px dashed #3A3D42;
        border-radius:10px; padding:16px; font-size:15px; line-height:1.55;
        color:#DDD; white-space:pre-wrap;}
  .send{display:none; margin-top:14px; width:100%; padding:15px; text-align:center;
        border:2px solid var(--flare); border-radius:10px; color:var(--chalk);
        font-family:'Anton',sans-serif; font-size:17px; letter-spacing:1.5px;
        text-decoration:none;}
  .send:hover{background:rgba(224,27,36,0.15);}
  .foot{margin-top:18px; font-size:12px; color:var(--dim); text-align:center;}
</style>
</head>
<body>
<div class="wrap">
  <div class="crumb"><a href="/smack-board">&larr; SMACK BOARD</a> &nbsp;/&nbsp; GAME DAY SMACK</div>

  <div class="hero">
    <div class="kicker">FINAL &middot; CERTIFIED LOSS</div>
    <h1 id="headline">THE GAME IS OVER</h1>
    <p class="sub" id="subline">Somebody in your life deserves this call.</p>
  </div>

  <div class="card">
    <label for="who">Who's getting smacked? (their first name)</label>
    <input id="who" placeholder="e.g. Dave" autocomplete="off">
    <label>How hard should Smacky go?</label>
    <div style="--frame:#E01B24;"><style>
  .fader{padding:4px 0 0;}
  .fader-scale{display:flex; justify-content:space-between; margin-bottom:10px;}
  .fader-tick{font-family:'JetBrains Mono',monospace; font-size:10px;
    font-weight:700; letter-spacing:1.5px; text-transform:uppercase;
    color:#5F5E5A; cursor:pointer; transition:color .15s ease;}
  .fader-tick.on{color:var(--heat, #E01B24);}
  .fader-input{-webkit-appearance:none; appearance:none; width:100%;
    height:8px; border-radius:4px; margin:0 0 14px; cursor:pointer;
    background:linear-gradient(to right,#E01B24 0%,#F03A18 22%,#FF6B14 45%,#FF9F0A 72%,#FFD400 100%);}
  .fader-input::-webkit-slider-runnable-track{height:8px; border-radius:4px;
    background:linear-gradient(to right,#E01B24 0%,#F03A18 22%,#FF6B14 45%,#FF9F0A 72%,#FFD400 100%);}
  .fader-input::-moz-range-track{height:8px; border-radius:4px;
    background:linear-gradient(to right,#E01B24 0%,#F03A18 22%,#FF6B14 45%,#FF9F0A 72%,#FFD400 100%);}
  .fader-input::-webkit-slider-thumb{-webkit-appearance:none; appearance:none;
    width:18px; height:30px; border-radius:4px; background:#F5F5F3;
    border:3px solid var(--heat, #E01B24); cursor:grab;
    box-shadow:0 0 14px var(--heat-glow, rgba(224,27,36,0.5));}
  .fader-input::-moz-range-thumb{width:18px; height:30px; border-radius:4px;
    background:#F5F5F3; border:3px solid var(--heat, #E01B24); cursor:grab;
    box-shadow:0 0 14px var(--heat-glow, rgba(224,27,36,0.5));}
  .fader-input:focus-visible{outline:2px solid #E01B24; outline-offset:4px;}
  .fader-readout{background:#141416 !important; border:2px solid var(--frame, #E01B24);
    border-radius:8px; padding:12px 14px;}
  .fader-level{display:block; font-family:'Anton',sans-serif; font-size:19px;
    text-transform:uppercase; color:var(--heat, #E01B24); line-height:1;}
  .fader-desc{display:block; font-size:13px; color:#B8B8B4; line-height:1.5; margin-top:5px;}
</style>
<div id="sensFader"></div>
<script>
(function(){
  window.SmackFader = function(onChange){
    var container = document.getElementById('sensFader');
    var selected = 4;
    fetch('/api/sensitivity-levels').then(function(r){return r.json();})
      .then(function(levels){
        var keys = Object.keys(levels).map(Number).sort(function(a,b){return a-b;});
        var display = keys.slice().reverse();
        var ticks = display.map(function(k){
          return '<span class="fader-tick" data-level="'+k+'">'+levels[k].label+'</span>';
        }).join('');
        container.innerHTML =
          '<div class="fader"><div class="fader-scale">'+ticks+'</div>'+
          '<input type="range" id="intensityRange" class="fader-input" min="'+keys[0]+
          '" max="'+keys[keys.length-1]+'" step="1" style="direction:rtl;" value="'+selected+
          '" aria-label="How hard should Smacky go"><div class="fader-readout">'+
          '<span class="fader-level" id="faderLevel"></span>'+
          '<span class="fader-desc" id="faderDesc"></span></div></div>';
        var range=document.getElementById('intensityRange');
        var levelEl=document.getElementById('faderLevel');
        var descEl=document.getElementById('faderDesc');
        var tickEls=Array.prototype.slice.call(container.querySelectorAll('.fader-tick'));
        var HEAT={4:'#E8142C',3:'#FF6B14',2:'#FF9F0A',1:'#FFD400'};
        var GLOW={4:'rgba(232,20,44,0.55)',3:'rgba(255,107,20,0.5)',
                  2:'rgba(255,159,10,0.45)',1:'rgba(255,212,0,0.4)'};
        function apply(v){
          selected=parseInt(v,10);
          levelEl.textContent=levels[selected].label;
          descEl.textContent=levels[selected].description;
          tickEls.forEach(function(t){
            t.classList.toggle('on',parseInt(t.dataset.level,10)===selected);});
          var f=range.closest('.fader');
          f.style.setProperty('--heat',HEAT[selected]||'#E8142C');
          f.style.setProperty('--heat-glow',GLOW[selected]||'rgba(224,27,36,0.55)');
          range.style.setProperty('--heat',HEAT[selected]||'#E8142C');
          if(onChange) onChange(selected);
        }
        range.addEventListener('input',function(){apply(range.value);});
        apply(selected);
      });
    return function(){return selected;};
  };
})();
</script>
</div>
    <label for="phone" style="margin-top:16px;">Their phone number</label>
    <input id="phone" type="tel" inputmode="tel" placeholder="1 (555) 555-5555">
    <label class="consent-row" for="adult">
      <input type="checkbox" id="adult">
      <span>I confirm the person receiving this call is <strong>18 or older</strong>.</span>
    </label>
    <label class="consent-row" for="know">
      <input type="checkbox" id="know">
      <span>I know this person, and this is a prank between friends.</span>
    </label>
    <label class="consent-row" for="terms">
      <input type="checkbox" id="terms">
      <span>I agree to the <a href="/terms" target="_blank" rel="noopener" style="color:var(--flare);">Terms</a>.</span>
    </label>
    <button class="gen" id="genBtn" disabled
            style="opacity:0.45;cursor:not-allowed;">WRITE THE ROAST</button>
    <div class="out" id="out">Hit the button and Smacky writes a roast about THIS loss &mdash; the score, the pain, the whole thing.</div>
    <a class="send" id="sendBtn" style="cursor:pointer;">SEND IT AS A CALL &rarr;</a>
  </div>

  <p class="foot">The call is anonymous. The loss is not.</p>
</div>

<script>
(function(){
  var p = new URLSearchParams(location.search);
  var o = { loser: p.get('loser') || p.get('team') || '',
            winner: p.get('winner') || '',
            ls: p.get('ls') || '', ws: p.get('ws') || '',
            sport: p.get('sport') || '' };
  if (!o.loser){ location.href = '/smack-board'; return; }
  var an = /^[aeiou]/i.test(o.loser) ? 'AN' : 'A';
  document.title = 'Smack ' + an.toLowerCase() + ' ' + o.loser + ' fan';
  var score = (o.ws && o.ls) ? o.ws + '\u2013' + o.ls : '';
  document.getElementById('headline').innerHTML =
    'THE ' + esc(o.loser.toUpperCase()) + ' LOST' +
    (score ? ' <span class="score">' + score + '</span>' : '');
  document.getElementById('subline').textContent =
    (o.winner ? 'Fell to the ' + o.winner + '. ' : '') +
    'Somebody in your life deserves this call.';

  function esc(t){ var d=document.createElement('div');
                   d.textContent=t; return d.innerHTML; }

  var btn = document.getElementById('genBtn'),
      out = document.getElementById('out'),
      send = document.getElementById('sendBtn'),
      adult = document.getElementById('adult'),
      lastRoast = '';
  // SHARED FADER - identical control to the Smackagram generator
  // (Brutal/Ruthless/Cocky/Friendly, savage-on-left, heat gradient).
  var sensVal = '4';
  window.SmackFader(function(v){ sensVal = String(v); gate(); });
  // GENERATE UNLOCKS only with name + sensitivity + 18-plus - the
  // full gate on page one, per Andy's spec.
  function gate(){
    var ok = document.getElementById('who').value.trim()
             && sensVal && adult.checked
             && document.getElementById('know').checked
             && document.getElementById('terms').checked;
    btn.disabled = !ok;
    btn.style.opacity = ok ? '1' : '0.45';
    btn.style.cursor = ok ? 'pointer' : 'not-allowed';
  }
  ['input','change'].forEach(function(ev){
    ['who','adult','know','terms','phone'].forEach(function(id){
      document.getElementById(id).addEventListener(ev, gate);
    });
  });
  // THE THREE DOORWAYS (Andy, Aug 7). SEND fires a REAL order:
  //   logged in + balance  -> debit, call fires, confirmation page
  //   logged in + broke    -> packs page, come back, state restored
  //   stranger             -> login/signup, come back, state restored
  // The staged smack survives every detour via sessionStorage.
  function stash(){
    try{ sessionStorage.setItem('gameday_staged', JSON.stringify({
      who: document.getElementById('who').value,
      phone: document.getElementById('phone').value,
      sens: sensVal, roast: lastRoast, url: location.search
    })); }catch(e){}
  }
  send.addEventListener('click', function(){
    if (!lastRoast) return;
    var ph = document.getElementById('phone').value.trim();
    if (!ph){ out.textContent = 'Type their phone number first.'; return; }
    send.textContent = 'SENDING\u2026';
    fetch('/api/orders', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({
        mode: 'custom', custom_message: lastRoast,
        recipient_name: document.getElementById('who').value.trim(),
        recipient_phone: ph,
        sensitivity: parseInt(sensVal, 10) || 2,
        consent_confirmed: true,
        source: 'game_day'
      })
    }).then(function(r){
      if (r.redirected){ stash(); location.href =
        '/login?next=' + encodeURIComponent('/game-day' + location.search);
        return null; }
      return r.json().then(function(d){ return {code:r.status, d:d}; });
    }).then(function(res){
      if (!res) return;
      if (res.code === 402 && res.d && res.d.error === 'insufficient_balance'){
        stash();
        location.href = res.d.redirect || '/get-smackagrams';
        return;
      }
      if (res.code >= 200 && res.code < 300 && !res.d.error){
        try{ sessionStorage.removeItem('gameday_staged'); }catch(e){}
        location.href = '/game-day/sent';
        return;
      }
      send.textContent = 'SEND IT AS A CALL \u2192';
      out.textContent = (res.d && res.d.error) || 'Could not send - try again.';
    }).catch(function(){
      send.textContent = 'SEND IT AS A CALL \u2192';
      out.textContent = 'Network hiccup - try again.';
    });
  });
  // RESTORE after any detour - signup or top-up lands back here with
  // everything intact; nobody re-types a roast they already paid for.
  try{
    var st = JSON.parse(sessionStorage.getItem('gameday_staged') || 'null');
    if (st && st.roast){
      document.getElementById('who').value = st.who || '';
      document.getElementById('phone').value = st.phone || '';
      sensVal = st.sens || '';
      lastRoast = st.roast;
      out.textContent = st.roast;
      send.style.display = 'block';
    }
  }catch(e){}
  btn.addEventListener('click', function(){
    var who = document.getElementById('who').value.trim();
    if (!who){ out.textContent = 'Type their name first.'; return; }
    btn.textContent = 'WRITING\u2026'; btn.disabled = true;
    fetch('/api/generate-trash-talk', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({
        team: o.loser, recipient_name: who,
        sensitivity: parseInt(sensVal, 10),
        game_outcome: { loser: o.loser, winner: o.winner,
                        loser_score: o.ls, winner_score: o.ws }
      })
    }).then(function(r){ return r.json(); })
      .then(function(d){
        btn.textContent = 'WRITE ANOTHER'; btn.disabled = false;
        if (d.generated_text){
          out.textContent = d.generated_text;
          lastRoast = d.generated_text;
          // hand EVERYTHING to the send flow - its Game Day header
          // and checkout take over from here
          send.style.display = 'block';
        } else {
          out.textContent = d.error || 'Generator hiccuped - try again.';
          console.log('generate response', d);
        }
      })
      .catch(function(){ btn.textContent='WRITE THE ROAST';
                         btn.disabled=false;
                         out.textContent='Network hiccup - try again.'; });
  });
})();
</script>
</body>
</html>
