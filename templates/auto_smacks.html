<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Your Auto-Smacks — Smackagram</title>
<link rel="stylesheet" href="{{ url_for('static', filename='css/smackagram.css') }}">
<style>
  :root{
    --ink:#000000; --ink-2:#0C0C0C;
    --surface:#141414; --surface-2:#1C1C1C;
    --line:#3A1416; --punch:#E8142C; --amber:#FFB800;
    --ivory:#FFFFFF; --muted:#B5B0B0; --muted-2:#7A7575;
    --radius:14px;
  }
  *{box-sizing:border-box;}
  html,body{background:var(--ink); color:var(--ivory); font-family:'Inter',sans-serif; -webkit-font-smoothing:antialiased;}
  .wrap{max-width:760px; margin:0 auto; padding:32px 20px 90px;}
  h1{font-family:'Anton',sans-serif; font-size:32px; letter-spacing:.5px; margin:0 0 6px;}
  .sub{color:var(--muted); font-size:14px; margin:0 0 28px;}
  .card{background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); padding:20px 22px; margin-bottom:14px;}
  .card.paused{border-color:var(--amber);}
  .row{display:flex; align-items:center; justify-content:space-between; gap:14px; flex-wrap:wrap;}
  .team{font-family:'Anton',sans-serif; font-size:19px; letter-spacing:.3px;}
  .meta{color:var(--muted); font-size:13px; margin-top:4px;}
  .badge{font-size:11px; font-weight:700; letter-spacing:.5px; text-transform:uppercase; padding:4px 10px; border-radius:20px;}
  .badge.active{background:rgba(40,200,120,.15); color:#3FE08F;}
  .badge.paused{background:rgba(255,184,0,.15); color:var(--amber);}
  .actions{display:flex; gap:10px; margin-top:14px;}
  .btn{border:none; border-radius:10px; padding:10px 18px; font-weight:700; font-size:13px; cursor:pointer;}
  .btn-cancel{background:transparent; color:var(--muted); border:1px solid var(--line);}
  .btn-reauth{background:var(--punch); color:#fff;}
  .btn-reauth:disabled{opacity:.5; cursor:default;}
  .reauth-box{margin-top:12px; padding:14px; background:var(--surface-2); border-radius:10px; font-size:13px; color:var(--muted);}
  .reauth-box label{display:flex; gap:8px; align-items:flex-start; margin-bottom:10px; cursor:pointer;}
  .empty{color:var(--muted); text-align:center; padding:60px 20px;}
  .empty a{color:var(--punch);}
</style>
</head>
<body>
<div class="wrap">
  <h1>Your Auto-Smacks</h1>
  <p class="sub">Standing rules that smack the same person every time a team loses. Wallet-funded — never touches a card on its own.</p>
  <div id="list"><p class="empty">Loading…</p></div>
</div>

<script>
async function load() {
  const list = document.getElementById('list');
  const resp = await fetch('/api/auto-smack-subscriptions');
  const data = await resp.json();
  const subs = data.subscriptions || [];
  if (!subs.length) {
    list.innerHTML = '<p class="empty">Nothing armed yet. Set one up from <a href="/send-a-smack">Send a Smack</a> after your next order.</p>';
    return;
  }
  list.innerHTML = subs.map(function (s) {
    const paused = s.status === 'paused_needs_reauth';
    return '<div class="card' + (paused ? ' paused' : '') + '">'
      + '<div class="row">'
      +   '<div><div class="team">' + s.target_team + '</div>'
      +   '<div class="meta">To ' + s.recipient_name + ' &middot; ' + s.sport.toUpperCase()
      +   (s.season_end_date ? (' &middot; through ' + s.season_end_date) : '') + '</div></div>'
      +   '<span class="badge ' + (paused ? 'paused' : 'active') + '">' + (paused ? 'Paused — needs reauth' : 'Active') + '</span>'
      + '</div>'
      + (paused
        ? '<div class="reauth-box">'
          + 'This paused because your wallet ran out — nothing was charged. '
          + 'Add funds, then confirm below to start it firing again.'
          + '<label><input type="checkbox" class="reauthCheck" data-id="' + s.id + '"> '
          + 'I confirm I want this Auto-Smack to resume.</label>'
          + '<button class="btn btn-reauth" data-id="' + s.id + '" onclick="reauthorize(' + s.id + ')" disabled>Resume Auto-Smack</button>'
          + '</div>'
        : '')
      + '<div class="actions"><button class="btn btn-cancel" onclick="cancelSub(' + s.id + ')">Cancel</button></div>'
      + '</div>';
  }).join('');

  document.querySelectorAll('.reauthCheck').forEach(function (cb) {
    cb.addEventListener('change', function () {
      var btn = document.querySelector('.btn-reauth[data-id="' + cb.dataset.id + '"]');
      if (btn) btn.disabled = !cb.checked;
    });
  });
}

async function cancelSub(id) {
  if (!confirm('Cancel this Auto-Smack? This cannot be undone.')) return;
  await fetch('/api/auto-smack-subscriptions/' + id + '/cancel', {method: 'POST'});
  load();
}

async function reauthorize(id) {
  const resp = await fetch('/api/auto-smack-subscriptions/' + id + '/reauthorize', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({reauthorize_confirmed: true})
  });
  const data = await resp.json();
  if (data.error) { alert(data.error); return; }
  load();
}

load();
</script>
</body>
</html>
